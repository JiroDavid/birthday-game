const TILE = 60;
const COLS = 15, ROWS = 9;
const PF_TOP = HUD_H;

// ─── CONFIG ───────────────────────────────────────────────────────────────

// ─── ASSETS ───────────────────────────────────────────────────────────────
function loadImage(src, callback) {
  const img = new Image();
  img.onload = () => callback(img);
  img.onerror = () => callback(img); // pass even on error so callers can check naturalWidth
  img.src = src;
}

// Bloom (boss + grub variant) sprite sheets
const bloomSprites = {};
const bloomPaths = {
  crawl:  'sprites/Momo-Mama/Momo-Mama/momo mama/mm-crawl.png',
  attack: 'sprites/Momo-Mama/Momo-Mama/momo mama/mm-generic attack.png',
  jump:   'sprites/Momo-Mama/Momo-Mama/momo mama/mm-jump.png',

  happy:  'sprites/Momo-Mama/Momo-Mama/EXTRAS/mm-happy.png',
};

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, gain, dur, startT, endFreq) {
  try {
    const ac = getAudio();
    const t = startT ?? ac.currentTime;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (endFreq !== undefined) osc.frequency.exponentialRampToValueAtTime(endFreq, t+dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.start(t); osc.stop(t+dur);
  } catch(e) { /* audio not ready yet */ }
}

function loadRoom(idx) {
  const room = ROOM_GRAPH[idx];
  currentRoom = room;
  currentRoomIdx = idx;
  room.visited = true;
  // Build O(1) obstacle lookup set once per room load
  if (!room.obstacleSet) {
    room.obstacleSet = new Set(room.obstacles.map(([x, y]) => `${x},${y}`));
  }
  enemies.length = 0;
  tears.length = 0;
  particles.length = 0;
  healthPacks.length = 0;
  enemyProjectiles.length = 0;
  boss = null;
  if (!room.cleared) {
    currentWave = 0; waveTransitionTimer = 0; waveNotifyTimer = 0;
    if (room.waves && room.waves.length > 0) {
      room.waves[0].forEach(s => spawnEnemy(s.type, s.x, s.y));
    } else {
      room.enemySpawns.forEach(s => spawnEnemy(s.type, s.x, s.y));
    }
    if (room.type === 'boss')  initBoss();
    if (room.type === 'boss2') initPinky();
  }
  // Checkpoint heal — entering the garden restores full HP
  if (room.type === 'garden' && player.hp < player.maxHP) {
    player.hp = player.maxHP;
    spawnParticles(player.x, player.y, '#FF6B9D', 20, 5, 35);
    spawnParticles(player.x, player.y, '#ffffff', 10, 3, 25);
  }
}

function isObstacle(tx, ty) {
  if (!currentRoom) return false;
  return currentRoom.obstacleSet
    ? currentRoom.obstacleSet.has(`${tx},${ty}`)
    : currentRoom.obstacles.some(([ox, oy]) => ox === tx && oy === ty);
}

function circleCollidesRect(cx, cy, cr, rx, ry, rw, rh) {
  const nearX = Math.max(rx, Math.min(cx, rx + rw));
  const nearY = Math.max(ry, Math.min(cy, ry + rh));
  return Math.hypot(cx - nearX, cy - nearY) < cr;
}

function resolveCircleVsObstacles(obj, radius) {
  const tx = Math.floor(obj.x / TILE);
  const ty = Math.floor((obj.y - PF_TOP) / TILE);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const ntx = tx + dx, nty = ty + dy;
      if (ntx < 1 || ntx > COLS - 2 || nty < 1 || nty > ROWS - 2) continue;
      if (!isObstacle(ntx, nty)) continue;
      const rx = ntx * TILE, ry = PF_TOP + nty * TILE;
      if (circleCollidesRect(obj.x, obj.y, radius, rx, ry, TILE, TILE)) {
        const centerX = rx + TILE / 2, centerY = ry + TILE / 2;
        const overlapX = (radius + TILE / 2) - Math.abs(obj.x - centerX);
        const overlapY = (radius + TILE / 2) - Math.abs(obj.y - centerY);
        if (overlapX < overlapY) {
          obj.x += obj.x < centerX ? -overlapX : overlapX;
        } else {
          obj.y += obj.y < centerY ? -overlapY : overlapY;
        }
      }
    }
  }
}

function clampToRoom(obj, radius) {
  obj.x = Math.max(TILE + radius, Math.min(W - TILE - radius, obj.x));
  obj.y = Math.max(PF_TOP + TILE + radius, Math.min(H - TILE - radius, obj.y));
}

function checkDoorTrigger() {
  if (!currentRoom || !currentRoom.cleared) return;
  const m = 24; // must be > player radius (16) so clampToRoom doesn't block trigger
  const checks = [
    { cond: player.y < PF_TOP+TILE+m && player.x>W/2-50 && player.x<W/2+50, dir:'north', entry:{x:W/2,y:H-TILE*2} },
    { cond: player.y > H-TILE-m       && player.x>W/2-50 && player.x<W/2+50, dir:'south', entry:{x:W/2,y:PF_TOP+TILE*2} },
    { cond: player.x > W-TILE-m       && player.y>H/2-50 && player.y<H/2+50, dir:'east',  entry:{x:TILE*2,y:H/2} },
    { cond: player.x < TILE+m         && player.y>H/2-50 && player.y<H/2+50, dir:'west',  entry:{x:W-TILE*2,y:H/2} },
  ];
  for (const c of checks) {
    if (!c.cond) continue;
    const targetIdx = currentRoom.doors[c.dir];
    if (targetIdx === null) continue;
    transition.entryPos = c.entry;
    startTransition(targetIdx);
    return;
  }
}

function startTransition(targetIdx) {
  for (const k in keys) keys[k] = false;
  transition.active = true;
  transition.progress = 0;
  transition.fromIdx = currentRoomIdx;
  transition.toIdx = targetIdx;
  transition.dir = targetIdx > currentRoomIdx ? -1 : 1;
  gameState = 'TRANSITION';
}

function updateTransition() {
  transition.progress++;
  if (transition.progress >= transition.duration) {
    transition.active = false;
    loadRoom(transition.toIdx);
    if (transition.entryPos) {
      player.x = transition.entryPos.x;
      player.y = transition.entryPos.y;
    }
    const destType = ROOM_GRAPH[transition.toIdx].type;
    if (destType === 'boss' || destType === 'boss2') {
      gameState = 'BOSS_INTRO';
      bossIntro.timer = 0;
    } else {
      gameState = 'PLAYING';
    }
  }
}

function drawTransition() {
  const t = transition.progress / transition.duration;
  const offset = t * W * transition.dir;
  ctx.save();
  ctx.translate(offset, 0);
  drawRoom(ROOM_GRAPH[transition.fromIdx]);
  ctx.restore();
  ctx.save();
  ctx.translate(offset + W * -transition.dir, 0);
  drawRoom(ROOM_GRAPH[transition.toIdx]);
  ctx.restore();
}

// ─── ENEMIES ──────────────────────────────────────────────────────────────
function enemyRadius(e) {
  if (e.type === 'fly')      return 10;
  if (e.type === 'tank')     return 22;
  if (e.type === 'brute')    return 24;
  if (e.type === 'sentinel') return 20;
  if (e.type === 'cyclops') return 20;
  return 14; // grub
}

function spawnEnemy(type, x, y) {
  // Push spawn position away from the player — prevents instant-damage on wave spawn
  const MIN_SPAWN_DIST = 140;
  const sdx = x - player.x, sdy = y - player.y;
  const sdist = Math.hypot(sdx, sdy);
  if (sdist < MIN_SPAWN_DIST) {
    const ang = sdist < 1 ? Math.random() * Math.PI * 2 : Math.atan2(sdy, sdx);
    x = player.x + Math.cos(ang) * MIN_SPAWN_DIST;
    y = player.y + Math.sin(ang) * MIN_SPAWN_DIST;
    x = Math.max(90, Math.min(W - 90, x));
    y = Math.max(PF_TOP + 55, Math.min(H - 55, y));
  }
  const hm = DIFF[difficulty].enemyHPMult;
  const base = { type, x, y, hitFlash: 0, slowTimer: 0, knockVx: 0, knockVy: 0, animFrame: 0, animTimer: 0 };
  if (type === 'grub') enemies.push({ ...base, hp: Math.ceil(3 * hm), hopTimer: 0 });
  if (type === 'fly')  enemies.push({ ...base, hp: Math.ceil(2 * hm), phase: 'orbit', orbitAngle: Math.random() * Math.PI * 2, dashVx: 0, dashVy: 0, dashTimer: 0, telegraphTimer: 0, orbitRadius: 120 + Math.random() * 60, orbitFrames: null });
  if (type === 'tank') enemies.push({ ...base, hp: Math.ceil(6 * hm), pulseTimer: 0, orbitalCooldown: 0,
    facing: 1,
    attackTimer: 90 + Math.floor(Math.random() * 60),
    attackType: null, attackAnimFrame: 0, attackAnimTimer: 0,
    laserAngle: 0, laserLife: 0,
    stoneFired: false, stoneProjectiles: [],
    nextAttack: Math.random() < 0.5 ? 'laser' : 'stone',
  });
  // Act 2 enemy types
  if (type === 'cyclops')  enemies.push({ ...base, hp: Math.ceil(5 * hm), phase: 'walk',
    laserTimer: 140 + Math.floor(Math.random() * 80), chargeTimer: 0,
    laserAngle: 0, laserFireTimer: 0, laserPosHist: [],
  });
  if (type === 'brute')    enemies.push({ ...base, hp: Math.ceil(5 * hm), knockVx: 0, knockVy: 0,
    attackCooldown: 0, attacking: false, attackTimer: 0,
  });
  if (type === 'sentinel') enemies.push({ ...base, hp: Math.ceil(6 * hm), knockVx: 0, knockVy: 0,
    attackCooldown: 0, attacking: false, attackTimer: 0,
  });
}

function updateGrub(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const speed = 1.7 * DIFF[difficulty].enemySpeedMult * (e.slowTimer > 0 ? 0.4 : 1);
  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  e.knockVx *= Math.pow(0.85, dt); e.knockVy *= Math.pow(0.85, dt);
  e.x += ((dx / len) * speed + e.knockVx) * dt;
  e.y += ((dy / len) * speed + e.knockVy) * dt;
  resolveCircleVsObstacles(e, 14);
  clampToRoom(e, 14);
  e.hopTimer = (e.hopTimer + dt) % 30;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;
}

function updateFly(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const slowMult = e.slowTimer > 0 ? 0.4 : 1;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;

  if (e.phase === 'orbit') {
    e.orbitAngle += 0.025 * slowMult * dt;
    const targetX = player.x + Math.cos(e.orbitAngle) * e.orbitRadius;
    const targetY = player.y + Math.sin(e.orbitAngle) * e.orbitRadius;
    const dx = targetX - e.x, dy = targetY - e.y;
    const len = Math.hypot(dx, dy) || 1;
    e.x += (dx/len) * 3.2 * DIFF[difficulty].enemySpeedMult * slowMult * dt;
    e.y += (dy/len) * 3.2 * DIFF[difficulty].enemySpeedMult * slowMult * dt;
    clampToRoom(e, 10);

    if (e.orbitFrames === null) e.orbitFrames = 90 + Math.floor(Math.random() * 60);
    e.orbitFrames -= dt;
    if (e.orbitFrames <= 0) {
      e.phase = 'telegraph';
      e.telegraphTimer = 40;
    }
  } else if (e.phase === 'telegraph') {
    e.telegraphTimer -= dt;
    if (e.telegraphTimer <= 0) {
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.dashVx = (dx/len) * 8 * DIFF[difficulty].enemySpeedMult;
      e.dashVy = (dy/len) * 8 * DIFF[difficulty].enemySpeedMult;
      e.dashTimer = 24;
      e.phase = 'dash';
    }
  } else if (e.phase === 'dash') {
    e.x += e.dashVx * slowMult * dt;
    e.y += e.dashVy * slowMult * dt;
    e.dashTimer -= dt;
    clampToRoom(e, 10);
    if (e.dashTimer <= 0) {
      e.phase = 'orbit';
      e.orbitFrames = 90 + Math.floor(Math.random() * 60);
    }
  }
}

function updateTank(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const speed = 1.0 * DIFF[difficulty].enemySpeedMult * (e.slowTimer > 0 ? 0.4 : 1);
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;

  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  e.knockVx *= Math.pow(0.8, dt); e.knockVy *= Math.pow(0.8, dt);
  e.x += ((dx/len)*speed + e.knockVx) * dt;
  e.y += ((dy/len)*speed + e.knockVy) * dt;
  clampToRoom(e, 22);

  e.pulseTimer = (e.pulseTimer + dt) % 60;
}

function updateCyclops(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const slowMult = e.slowTimer > 0 ? 0.4 : 1;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;

  // Record player position every frame for delayed laser tracking
  e.laserPosHist.push({x: player.x, y: player.y});
  if (e.laserPosHist.length > 90) e.laserPosHist.shift();

  // Laser charge phase — stand still, eye glows
  if (e.phase === 'laser_charge') {
    e.chargeTimer -= dt;
    if (e.chargeTimer <= 0) {
      // Start beam aimed at the delayed position (not live player)
      const DELAY = 45;
      const hist = e.laserPosHist.length >= DELAY
        ? e.laserPosHist[e.laserPosHist.length - DELAY]
        : e.laserPosHist[0] || {x: player.x, y: player.y};
      e.laserAngle = Math.atan2(hist.y - e.y, hist.x - e.x);
      e.phase = 'laser_fire';
      e.laserFireTimer = 180;
      e.animFrame = 0;
    }
    return;
  }

  // Laser fire phase — beam tracks where the player WAS ~45 frames ago.
  // Moving player stays ahead of their own trail; stopped player gets caught.
  if (e.phase === 'laser_fire') {
    e.laserFireTimer -= dt;

    const DELAY = 45;
    const hist = e.laserPosHist.length >= DELAY
      ? e.laserPosHist[e.laserPosHist.length - DELAY]
      : e.laserPosHist[0] || {x: player.x, y: player.y};
    const targetAng = Math.atan2(hist.y - e.y, hist.x - e.x);
    let diff = targetAng - e.laserAngle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    // Rotation is faster now — dodging comes from the delay, not slow rotation
    const rotSpeed = 0.048 * DIFF[difficulty].enemySpeedMult;
    e.laserAngle += Math.sign(diff) * Math.min(Math.abs(diff), rotSpeed) * dt;

    // Damage if player is within beam width (dodgeable by moving)
    if (player.iframes <= 0) {
      const px = player.x - e.x, py = player.y - (e.y - CYCLOPS_EYE_OFFSET);
      const cos = Math.cos(e.laserAngle), sin = Math.sin(e.laserAngle);
      const dot = px * cos + py * sin;         // distance along beam
      const perp = Math.abs(px * sin - py * cos); // distance from beam centreline
      if (dot > 20 && perp < 18 && dot < 540) {
        player.hp = Math.max(0, player.hp - 1);
        player.iframes = CONFIG.player.iframeDuration;
        startShake(4, 7); playPlayerHit();
        if (player.hp <= 0) killPlayer();
      }
    }

    if (e.laserFireTimer <= 0) {
      e.phase = 'walk';
      e.laserTimer = 220 + Math.floor(Math.random() * 100);
      e.animFrame = 0;
    }
    return;
  }

  const dx = player.x - e.x, dy = player.y - e.y;
  const dist = Math.hypot(dx, dy) || 1;

  if (e.laserTimer > 0) e.laserTimer -= dt;
  if (e.laserTimer <= 0 && dist > 60) {
    e.phase = 'laser_charge';
    e.chargeTimer = 55;
    e.animFrame = 0;
    return;
  }

  if (dist > 80) {
    const speed = 1.6 * DIFF[difficulty].enemySpeedMult * slowMult;
    e.knockVx *= Math.pow(0.85, dt); e.knockVy *= Math.pow(0.85, dt);
    e.x += ((dx/dist) * speed + e.knockVx) * dt;
    e.y += ((dy/dist) * speed + e.knockVy) * dt;
    resolveCircleVsObstacles(e, 20);
    clampToRoom(e, 20);
  }
}

function updateBrute(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const slowMult = e.slowTimer > 0 ? 0.4 : 1;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;
  if (e.attackCooldown > 0) e.attackCooldown -= dt;

  if (e.attacking) {
    e.attackTimer -= dt;
    if (e.attackTimer <= 0) { e.attacking = false; e.attackCooldown = 130; }
    return;
  }

  const dx = player.x - e.x, dy = player.y - e.y;
  const dist = Math.hypot(dx, dy) || 1;

  if (e.attackCooldown <= 0 && dist < 100) {
    e.attacking = true;
    e.attackTimer = 28;
    spawnParticles(e.x, e.y, '#4488ff', 12, 5, 20);
    startShake(5, 8);
    if (player.iframes <= 0) {
      player.hp = Math.max(0, player.hp - 2);
      player.iframes = CONFIG.player.iframeDuration;
      player.vx = (player.x - e.x) / dist * 7;
      player.vy = (player.y - e.y) / dist * 7;
      startShake(7, 12); playPlayerHit();
      if (player.hp <= 0) killPlayer();
    }
    return;
  }

  const speed = 1.5 * DIFF[difficulty].enemySpeedMult * slowMult;
  e.knockVx *= Math.pow(0.85, dt); e.knockVy *= Math.pow(0.85, dt);
  e.x += ((dx/dist)*speed + e.knockVx) * dt;
  e.y += ((dy/dist)*speed + e.knockVy) * dt;
  resolveCircleVsObstacles(e, 24);
  clampToRoom(e, 24);
}

function updateSentinel(e, dt) {
  e.animTimer += dt; if (e.animTimer >= 8) { e.animTimer -= 8; e.animFrame++; }
  const slowMult = e.slowTimer > 0 ? 0.4 : 1;
  if (e.slowTimer > 0) e.slowTimer -= dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.orbitalCooldown > 0) e.orbitalCooldown -= dt;
  if (e.attackCooldown > 0) e.attackCooldown -= dt;

  if (e.attacking) {
    e.attackTimer -= dt;
    if (e.attackTimer <= 0) { e.attacking = false; e.attackCooldown = 90; }
    return;
  }

  const dx = player.x - e.x, dy = player.y - e.y;
  const dist = Math.hypot(dx, dy) || 1;

  if (e.attackCooldown <= 0 && dist < 68) {
    e.attacking = true;
    e.attackTimer = 26;
    if (player.iframes <= 0) {
      player.hp = Math.max(0, player.hp - 1);
      player.iframes = CONFIG.player.iframeDuration;
      player.vx = (player.x - e.x) / dist * 5;
      player.vy = (player.y - e.y) / dist * 5;
      startShake(4, 8); playPlayerHit();
      if (player.hp <= 0) killPlayer();
    }
    return;
  }

  const speed = 1.1 * DIFF[difficulty].enemySpeedMult * slowMult;
  e.knockVx *= Math.pow(0.8, dt); e.knockVy *= Math.pow(0.8, dt);
  e.x += ((dx/dist)*speed + e.knockVx) * dt;
  e.y += ((dy/dist)*speed + e.knockVy) * dt;
  resolveCircleVsObstacles(e, 20);
  clampToRoom(e, 20);
}

function updateEnemyProjectiles(dt) {
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < PF_TOP || p.y > H) {
      enemyProjectiles[i] = enemyProjectiles[enemyProjectiles.length - 1];
      enemyProjectiles.pop(); continue;
    }
    if (player.iframes <= 0 && Math.hypot(p.x - player.x, p.y - player.y) < (p.radius||10) + 14) {
      player.hp = Math.max(0, player.hp - (p.damage || 1));
      player.iframes = CONFIG.player.iframeDuration;
      startShake(4, 8); playPlayerHit();
      enemyProjectiles[i] = enemyProjectiles[enemyProjectiles.length - 1];
      enemyProjectiles.pop();
      if (player.hp <= 0) killPlayer();
    }
  }
}

// ─── INTERACTION ──────────────────────────────────────────────────────────
// ─── CHAT WINDOW ──────────────────────────────────────────────────────────
function showChat(speaker, text, callback) {
  chatWindow.active = true;
  chatWindow.speaker = speaker;
  chatWindow.text = text;
  chatWindow.choices = null;
  chatWindow.choiceIdx = 0;
  chatWindow.callback = callback || null;
}

function showChatChoice(speaker, text, choices, callback) {
  chatWindow.active = true;
  chatWindow.speaker = speaker;
  chatWindow.text = text;
  chatWindow.choices = choices;
  chatWindow.choiceIdx = 0;
  chatWindow.callback = callback || null;
}

function advanceChatWindow() {
  const cb = chatWindow.callback;
  const idx = chatWindow.choiceIdx;
  chatWindow.active = false;
  chatWindow.callback = null;
  if (cb) cb(chatWindow.choices ? idx : undefined);
}

function nearInteractable() {
  if (!currentRoom) return false;
  if (bossDialogue.active && bossDialogue.phase === 'waiting' &&
      Math.hypot(player.x - bossDialogue.deathX, player.y - bossDialogue.deathY) < 90) return true;
  if (currentRoom.type === 'garden') {
    const pb = currentRoom.photoBoard, vb = currentRoom.videoBoard, th = currentRoom.throne;
    if (Math.hypot(player.x-pb.x, player.y-pb.y) < 50) return true;
    if (Math.hypot(player.x-vb.x, player.y-vb.y) < 50) return true;
    if (Math.hypot(player.x-th.x, player.y-th.y) < 50) return true;
  }
  return false;
}

function tryInteract() {
  if (!currentRoom) return;
  if (chatWindow.active) return;

  // Boss post-defeat dialogue
  if (bossDialogue.active && bossDialogue.phase === 'waiting' &&
      Math.hypot(player.x - bossDialogue.deathX, player.y - bossDialogue.deathY) < 90) {
    bossDialogue.phase = 'chatting';
    showChat('BLOOM', "ah... I lost. And I'm so lonely...", () => {
      showChatChoice('', 'What will you do?', ['Befriend', 'Marry'], (idx) => {
        bossDialogue.choice = idx === 0 ? 'befriend' : 'marry';
        const playerLine = idx === 0 ? 'Will you be my friend?' : 'Will you marry me?';
        showChat('YOU', playerLine, () => {
          const bloomLine = idx === 0
            ? "Yes! I'd love to be your friend! ✨"
            : 'Yes! I love you! ❤️';
          showChat('BLOOM', bloomLine, () => {
            bossDialogue.active = false;
            bossDialogue.phase = null;
            pet.x = bossDialogue.deathX; pet.y = bossDialogue.deathY;
            pet.active = true; pet.befriended = true; pet.bounceTimer = 0;
            // Unlock Secret Garden east door → Act 2 rooms
            ROOM_GRAPH[7].doors.east = 8;
            checkRoomClear();
          });
        });
      });
    });
    return;
  }

  if (currentRoom.type !== 'garden') return;
  const pb = currentRoom.photoBoard, vb = currentRoom.videoBoard, th = currentRoom.throne;
  if (Math.hypot(player.x-pb.x, player.y-pb.y) < 50) openPopup('photos');
  else if (Math.hypot(player.x-vb.x, player.y-vb.y) < 50) openPopup('videos');
  else if (Math.hypot(player.x-th.x, player.y-th.y) < 50) startCelebration();
}

function openPopup(type) {
  for (const k in keys) keys[k] = false;
  popupState.type = type;
  popupState.index = 0;
  gameState = 'POPUP';
  if (type === 'videos') { bgMusic.pause(); showVideo(0); }
}

function closePopup() {
  const wasVideo = popupState.type === 'videos';
  if (activeVideoEl) { activeVideoEl.pause(); activeVideoEl.style.display = 'none'; activeVideoEl = null; }
  confettiParticles.length = 0;
  gameState = 'PLAYING';
  for (const k in keys) keys[k] = false;
  if (wasVideo && !musicMuted) bgMusic.play().catch(() => {});
}

function navigatePopup(dir) {
  const list = popupState.type === 'photos' ? CONFIG.photos : CONFIG.videos;
  popupState.index = (popupState.index + dir + list.length) % list.length;
  if (popupState.type === 'videos') {
    if (activeVideoEl) { activeVideoEl.pause(); activeVideoEl.style.display = 'none'; }
    showVideo(popupState.index);
  }
}

// Video frame position in logical canvas coords — must match drawPopup vx/vy/vw/vh
const VID_FRAME = { x: 190, y: 144, w: 520, h: 250 };
function showVideo(idx) {
  activeVideoEl = videoEls[idx];
  const rect = canvas.getBoundingClientRect();
  const sx = rect.width / W, sy = rect.height / H;   // logical→CSS pixel scale
  activeVideoEl.style.left   = (rect.left + VID_FRAME.x * sx) + 'px';
  activeVideoEl.style.top    = (rect.top  + VID_FRAME.y * sy) + 'px';
  activeVideoEl.style.width  = Math.round(VID_FRAME.w * sx) + 'px';
  activeVideoEl.style.height = Math.round(VID_FRAME.h * sy) + 'px';
  activeVideoEl.style.display = 'block';
  activeVideoEl.currentTime = 0;
  activeVideoEl.play().catch(() => {});
}

function startCelebration() {
  for (const k in keys) keys[k] = false;
  gameState = 'CELEBRATION';
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8'];
  for (let i = 0; i < 80; i++) {
    confettiParticles.push({
      x: Math.random() * W,
      y: -10 - Math.random() * 60,
      vx: (Math.random()-0.5) * 3,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI*2,
      rotV: (Math.random()-0.5) * 0.15,
      w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random()*colors.length)],
    });
  }
  playConfetti();
}

// ─── LOOP ─────────────────────────────────────────────────────────────────
function update(dt) {
  frameCount++;
  Object.keys(keysJustPressed).forEach(k => delete keysJustPressed[k]);

  if (gameState === 'TITLE') { if (!bgMusic.paused) stopBGMusic(); return; }
  if (gameState === 'DEAD')  return;
  if (gameState === 'PAUSED') return;
  if (gameState === 'TRANSITION') { updateTransition(); return; }
  if (gameState === 'BOSS_INTRO') { updateBossIntro(); return; }
  if (gameState === 'SKILL_PICKUP') { updateSkillPickup(); return; }
  if (gameState === 'POPUP') return;
  if (gameState === 'CELEBRATION') {
    // Tick confetti physics
    for (let i = confettiParticles.length-1; i >= 0; i--) {
      const c = confettiParticles[i];
      c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 0.05 * dt; c.rot += c.rotV * dt;
      if (c.y > H+20) confettiParticles.splice(i,1);
    }
    return;
  }


  if (gameState === 'PLAYING') {
    updatePlayer(dt);
    updateOrbitals(dt);
    for (let i = enemies.length-1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type==='grub')           updateGrub(e, dt);
      else if (e.type==='fly')       updateFly(e, dt);
      else if (e.type==='tank')      updateTank(e, dt);
      else if (e.type==='cyclops')   updateCyclops(e, dt);
      else if (e.type==='brute')     updateBrute(e, dt);
      else if (e.type==='sentinel')  updateSentinel(e, dt);
    }
    if (boss) {
      if (boss.bossType === 'pinky') updatePinky(dt);
      else if (boss.bossType === 'owlet') updateOwlet(dt);
      else updateBloom(dt);
    }
    updatePet(dt);
    updateEnemyProjectiles(dt);
    updateTears(dt);
    updateParticles(dt);
    checkTearEnemyCollisions();
    checkPlayerEnemyCollisions();
    updateHealthPacks(dt);
    if (waveNotifyTimer > 0) waveNotifyTimer -= dt;
    if (waveTransitionTimer > 0) {
      waveTransitionTimer -= dt;
      if (waveTransitionTimer <= 0 && currentRoom.waves) {
        currentRoom.waves[currentWave].forEach(s => spawnEnemy(s.type, s.x, s.y));
      }
    }
    checkDoorTrigger();
    // E key interaction now handled in keydown via tryInteract()
  }
}

function updatePlayer(dt) {
  if (chatWindow.active) return;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['W']) dy -= 1;
  if (keys['s'] || keys['S']) dy += 1;
  if (keys['a'] || keys['A']) dx -= 1;
  if (keys['d'] || keys['D']) dx += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

  player.vx *= Math.pow(0.8, dt); player.vy *= Math.pow(0.8, dt);
  player.x += (dx * CONFIG.player.speed + player.vx) * dt;
  player.y += (dy * CONFIG.player.speed + player.vy) * dt;

  // Dash movement
  if (player.dashActive > 0) {
    player.dashActive -= dt;
    player.x += player.dashVx * dt;
    player.y += player.dashVy * dt;
    player.x = Math.max(90, Math.min(W - 90, player.x));
    player.y = Math.max(PF_TOP + TILE + 16, Math.min(H - TILE - 16, player.y));
  }
  if (player.dashCooldown > 0) player.dashCooldown -= dt;

  if (dx > 0) player.facing = 1;
  if (dx < 0) player.facing = -1;

  if (player.iframes > 0) player.iframes -= dt;

  player.fireTimer = Math.max(0, player.fireTimer - dt);
  let sx = 0, sy = 0;
  if (keys['ArrowRight']) sx = 1;
  if (keys['ArrowLeft'])  sx = -1;
  if (keys['ArrowDown'])  sy = 1;
  if (keys['ArrowUp'])    sy = -1;

  if ((sx !== 0 || sy !== 0) && player.fireTimer <= 0) {
    fireTear(sx, sy);
    player.fireTimer = CONFIG.player.fireRate;
  }
  resolveCircleVsObstacles(player, 16);
  clampToRoom(player, 16);
  player.animTimer += dt;
  if (player.animTimer >= 6) { player.animTimer -= 6; player.animFrame++; }
}

function fireTear(sx, sy) {
  const speed = CONFIG.player.tearSpeed * (player.skills.speed ? 1.8 : 1);
  const len = Math.hypot(sx, sy);
  const baseTear = {
    x: player.x, y: player.y,
    vx: (sx / len) * speed,
    vy: (sy / len) * speed,
    life: CONFIG.player.tearLifespan,
    lifespan: CONFIG.player.tearLifespan,
    radius: CONFIG.player.tearRadius,
    hitEnemies: new Set(),
    returning: false,
  };

  if (player.skills.triple) {
    [-15, 0, 15].forEach(deg => {
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      tears.push({
        ...baseTear,
        hitEnemies: new Set(),
        vx: baseTear.vx * cos - baseTear.vy * sin,
        vy: baseTear.vx * sin + baseTear.vy * cos,
      });
    });
  } else {
    tears.push({ ...baseTear });
  }
  playShoot();
}

function updateTears(dt) {
  for (let i = tears.length - 1; i >= 0; i--) {
    const t = tears[i];

    // Homing steering
    if (player.skills.homing && !t.returning) {
      let nearest = null, nearestDist = Infinity;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - t.x, e.y - t.y);
        if (d < nearestDist) { nearestDist = d; nearest = e; }
      });
      if (boss) {
        const d = Math.hypot(boss.x - t.x, boss.y - t.y);
        if (d < nearestDist) { nearestDist = d; nearest = boss; }
      }
      if (nearest) {
        const dx = nearest.x - t.x, dy = nearest.y - t.y;
        const len = Math.hypot(dx, dy) || 1;
        t.vx += (dx / len) * 0.3 * dt;
        t.vy += (dy / len) * 0.3 * dt;
        const spd = Math.hypot(t.vx, t.vy);
        const maxSpd = CONFIG.player.tearSpeed * (player.skills.speed ? 1.8 : 1);
        if (spd > maxSpd) { t.vx = t.vx / spd * maxSpd; t.vy = t.vy / spd * maxSpd; }
      }
    }

    // Boomerang: reverse at half lifespan
    if (player.skills.boomerang && !t.returning && t.life <= t.lifespan / 2) {
      t.returning = true;
      t.vx = -t.vx; t.vy = -t.vy;
      t.hitEnemies.clear();
    }

    t.prevX = t.x;
    t.prevY = t.y;
    t.x += t.vx * dt;
    t.y += t.vy * dt;
    t.life -= dt;

    if (t.x < TILE || t.x > W - TILE || t.y < PF_TOP + TILE || t.y > H - TILE || t.life <= 0) {
      if (t.life > 0) impactParticles(t.x, t.y, '#88ccff');
      tears[i] = tears[tears.length - 1];
      tears.pop();
    }
  }
}

const MAX_PARTICLES = 220;
function spawnParticles(x, y, color, count, speed, life) {
  const room = MAX_PARTICLES - particles.length;
  if (room <= 0) return;
  const n = Math.min(count, room);
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.5 + Math.random() * 0.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life * (0.7 + Math.random() * 0.3),
      maxLife: life,
      r: 3 + Math.random() * 3,
      color,
    });
  }
}

function impactParticles(x, y, color) {
  spawnParticles(x, y, color, 5, 3, 12);
}

function updateParticles(dt) {
  const decay = Math.pow(0.92, dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= decay; p.vy *= decay;
    p.life -= dt;
    if (p.life <= 0) {
      particles[i] = particles[particles.length - 1];
      particles.pop();
    }
  }
}

function render() {
  ctx.save();
  ctx.scale(renderDPR, renderDPR); // logical coords stay 900×560; buffer = DPR× physical pixels
  if (screenShake.timer > 0) {
    ctx.translate(screenShake.x, screenShake.y);
    screenShake.timer--;
    screenShake.x = (Math.random()-0.5)*screenShake.timer*0.5;
    screenShake.y = (Math.random()-0.5)*screenShake.timer*0.5;
    if (screenShake.timer<=0) { screenShake.x=0; screenShake.y=0; }
  }
  ctx.clearRect(-10,-10,W+20,H+20);
  ctx.imageSmoothingEnabled = false;

  if (gameState==='TITLE') { drawTitle(); ctx.restore(); return; }

  if (gameState==='TRANSITION') { drawTransition(); drawHUD(); ctx.restore(); return; }

  if (gameState==='PAUSED') { drawPauseMenu(); ctx.restore(); return; }

  if (currentRoom) drawRoom(currentRoom);
  drawGardenProps(currentRoom);
  enemies.forEach(drawEnemy);
  drawEnemyProjectiles();
  if (boss) {
    if (boss.bossType === 'pinky') drawPinky();
    else if (boss.bossType === 'owlet') drawOwlet();
    else drawBloom();
    drawBossHPBar();
  }
  drawPet();
  drawBossDialogue();
  drawHealthPacks();
  drawTears();
  drawInteractPrompt();
  drawChatWindow();
  drawPlayer();
  drawOrbitals();
  drawParticles();
  // Wave incoming banner — animated
  if (waveNotifyTimer > 0 && currentRoom.waves && currentWave > 0) {
    const t = waveNotifyTimer / 90; // 1→0
    // Fade in first 15%, hold, fade out last 20%
    const alpha = t > 0.8 ? (1-t)/0.2 : t < 0.2 ? t/0.2 : 1;
    // Slide down from top
    const slideY = t > 0.8 ? (1-(1-t)/0.2) * -60 : 0;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(0, slideY);
    ctx.textAlign = 'center';
    const bw = 320, bh = 62, bx = W/2 - bw/2, by = H/2 - bh/2 - 20;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, bx+4, by+4, bw, bh, 10); ctx.fill();
    // Body
    const grad = ctx.createLinearGradient(bx, by, bx, by+bh);
    grad.addColorStop(0, '#2d0a20'); grad.addColorStop(1, '#1a0416');
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, bw, bh, 10); ctx.fill();
    // Outer border
    ctx.strokeStyle = '#FF69B4'; ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, bh, 10); ctx.stroke();
    // Inner border
    ctx.strokeStyle = '#cc3366'; ctx.lineWidth = 1;
    roundRect(ctx, bx+5, by+5, bw-10, bh-10, 7); ctx.stroke();
    // Corner petals
    const petals = [[bx+2,by+2],[bx+bw-2,by+2],[bx+2,by+bh-2],[bx+bw-2,by+bh-2]];
    ctx.fillStyle = '#FF69B4'; ctx.font = '12px serif';
    petals.forEach(([px,py]) => ctx.fillText('✿', px, py+6));
    // Wave label
    ctx.fillStyle = '#ffaacc'; ctx.font = px(6);
    ctx.fillText('— WAVE ' + (currentWave + 1) + ' —', W/2, by + 24);
    // Main text
    ctx.fillStyle = '#ffffff'; ctx.font = px(10);
    ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 12;
    ctx.fillText('INCOMING!', W/2, by + 47);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  drawHUD();

  drawSkillBar();
  if (gameState==='SKILL_PICKUP') { drawSkillPickup(); ctx.restore(); return; }
  if (gameState==='BOSS_INTRO')   { drawBossIntro();   ctx.restore(); return; }

  if (gameState === 'POPUP') {
    // Room, props, player already drawn above — just overlay the popup
    drawPopup();
    ctx.restore(); return;
  }

  if (gameState === 'CELEBRATION') {
    drawCelebration();
    ctx.restore(); return;
  }

  if (gameState === 'DEAD') {
    drawDeathScreen();
    ctx.restore(); return;
  }

  ctx.restore();
}

window.addEventListener('keydown', e => {
  if (!keys[e.key]) keysJustPressed[e.key] = true;
  keys[e.key] = true;

  // Popup / celebration controls
  if ((e.key==='e'||e.key==='E'||e.key==='Escape') &&
      (gameState==='POPUP'||gameState==='CELEBRATION')) {
    closePopup(); e.preventDefault(); return;
  }
  if (e.key==='ArrowLeft'  && gameState==='POPUP') { navigatePopup(-1); e.preventDefault(); return; }
  if (e.key==='ArrowRight' && gameState==='POPUP') { navigatePopup(1);  e.preventDefault(); return; }
  if (e.key===' ' && gameState==='POPUP' && popupState.type==='videos' && activeVideoEl) {
    activeVideoEl.paused ? activeVideoEl.play() : activeVideoEl.pause();
    e.preventDefault(); return;
  }

  // Chat window input (movement already blocked in updatePlayer)
  if (chatWindow.active && gameState === 'PLAYING') {
    if (e.key === 'e' || e.key === 'E' || e.key === 'Enter' || e.key === ' ') {
      advanceChatWindow();
      e.preventDefault(); return;
    }
    if (chatWindow.choices) {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') {
        chatWindow.choiceIdx = (chatWindow.choiceIdx - 1 + chatWindow.choices.length) % chatWindow.choices.length;
        e.preventDefault(); return;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        chatWindow.choiceIdx = (chatWindow.choiceIdx + 1) % chatWindow.choices.length;
        e.preventDefault(); return;
      }
    }
    e.preventDefault(); return;
  }

  // Pause toggle
  if (e.key === 'Escape') {
    if (gameState === 'PLAYING') {
      gameState = 'PAUSED';
      for (const k in keys) keys[k] = false;
      bgMusic.pause();
      e.preventDefault(); return;
    }
    if (gameState === 'PAUSED') {
      gameState = 'PLAYING';
      if (!musicMuted) bgMusic.play().catch(() => {});
      e.preventDefault(); return;
    }
  }

  // Pause menu actions
  if (gameState === 'PAUSED') {
    if (e.key === 'm' || e.key === 'M') {
      musicMuted = !musicMuted;
      if (musicMuted) bgMusic.pause();
      else bgMusic.play().catch(() => {});
    }
    if (e.key === 'r' || e.key === 'R') { stopBGMusic(); gameState = 'TITLE'; titleMode = 'main'; titleSelected = 'play'; }
    e.preventDefault(); return;
  }

  // E key in PLAYING — tryInteract
  if ((e.key==='e'||e.key==='E') && gameState==='PLAYING') {
    tryInteract();
  }

  // Space in PLAYING — dash
  if (e.key === ' ' && gameState === 'PLAYING' && player.skills.dash && player.dashCooldown <= 0 && player.dashActive <= 0) {
    let dvx = 0, dvy = 0;
    if (keys['w'] || keys['W']) dvy -= 1;
    if (keys['s'] || keys['S']) dvy += 1;
    if (keys['a'] || keys['A']) dvx -= 1;
    if (keys['d'] || keys['D']) dvx += 1;
    if (dvx === 0 && dvy === 0) dvx = player.facing; // default: dash in facing direction
    const dlen = Math.hypot(dvx, dvy) || 1;
    player.dashVx = (dvx / dlen) * 13;
    player.dashVy = (dvy / dlen) * 13;
    player.dashActive = 12;
    player.dashCooldown = 180; // 3 seconds at 60fps
    player.iframes = Math.max(player.iframes, 14); // brief invincibility during dash
    spawnParticles(player.x, player.y, '#aaeeff', 10, 3, 18);
  }

  if (gameState === 'DEAD') {
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   deathScreenSel = 0;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  deathScreenSel = 1;
    if (e.key === 'Enter' || e.key === 'e' || e.key === 'E') {
      if (deathScreenSel === 0) { initGame(); }
      else { initGameAtRoom(7); }
    }
    e.preventDefault(); return;
  }

  if (gameState === 'TITLE') {
    if (titleMode === 'main') {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        titleSelected = titleSelected === 'play' ? 'levels' : 'play';
      }
      if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && titleSelected === 'play') {
        difficulty = difficulty === 'normal' ? 'hell' : 'normal';
      }
      if (e.key === 'Enter') {
        if (titleSelected === 'play') initGame();
        else { titleMode = 'levelselect'; titleLevelSel = 0; }
      }
      if (e.key === 'Escape') titleSelected = 'play';
    } else if (titleMode === 'levelselect') {
      if (e.key === 'ArrowUp')   titleLevelSel = Math.max(0, titleLevelSel - 1);
      if (e.key === 'ArrowDown') titleLevelSel = Math.min(LEVEL_LIST.length - 1, titleLevelSel + 1);
      if (e.key === 'Enter') initGameAtRoom(LEVEL_LIST[titleLevelSel].roomIdx);
      if (e.key === 'Escape') { titleMode = 'main'; titleSelected = 'levels'; }
    }
  }
  const gameKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D','e','E','Enter',' ','Escape','1','2'];
  if (gameKeys.includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { Object.keys(keys).forEach(k => { keys[k] = false; }); });

function startShake(intensity, duration) {
  screenShake.timer = duration;
  screenShake.x = (Math.random() - 0.5) * intensity;
  screenShake.y = (Math.random() - 0.5) * intensity;
}

function initGame() {
  // Reset all rooms for new game
  ROOM_GRAPH.forEach(r => {
    r.cleared = r.type === 'start' || r.type === 'garden';
    r.visited = false;
  });
  ROOM_GRAPH[0].visited = true;
  ROOM_GRAPH[7].doors.east = null; // re-lock Act 2 path until Bloom befriended

  // Apply difficulty
  const d = DIFF[difficulty];
  player.maxHP = d.playerHP;
  CONFIG.player.maxHP = d.playerHP;
  CONFIG.player.iframeDuration = d.iframes;
  CONFIG.player.fireRate = d.fireRate;

  player.hp = player.maxHP;
  player.iframes = 0;
  player.fireTimer = 0;
  player.vx = 0; player.vy = 0;
  player.facing = 1;
  player.x = 450; player.y = 300;
  player.animFrame = 0; player.animTimer = 0;
  Object.keys(player.skills).forEach(k => player.skills[k] = false);
  player.orbitals = [];
  player.dashCooldown = 0; player.dashActive = 0; player.dashVx = 0; player.dashVy = 0;

  skillPool = ['homing','explosive','piercing','orbital','freeze','boomerang','triple','speed','dash'];
  for (let i = skillPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [skillPool[i], skillPool[j]] = [skillPool[j], skillPool[i]];
  }

  tears.length = 0;
  enemies.length = 0;
  particles.length = 0;
  healthPacks.length = 0;
  enemyProjectiles.length = 0;
  confettiParticles.length = 0;
  currentRoomIdx = 0;
  currentWave = 0; waveTransitionTimer = 0; waveNotifyTimer = 0;
  boss = null;
  bossDialogue.active = false; bossDialogue.phase = 'waiting';
  chatWindow.active = false; chatWindow.callback = null;
  pet.active = false; pet.befriended = false; pet.bounceTimer = 0;
  pet.attackTimer = 0; pet.attackAnim = 0; pet.attacking = false;
  skillPickupState.replaceMode = false; skillPickupState.pendingSkill = null;
  gameState = 'PLAYING';
  loadRoom(0);
  startBGMusic();
}

function initGameAtRoom(roomIdx) {
  initGame(); // resets all state and loads room 0
  // Count fight rooms before target to decide how many skills to grant
  const fightRoomsCleared = ROOM_GRAPH.slice(0, roomIdx).filter(r => r.type === 'fight').length;
  const skillCount = Math.min(4, fightRoomsCleared);
  for (let i = 0; i < skillCount && skillPool.length > 0; i++) {
    const s = skillPool.pop();
    player.skills[s] = true;
    if (s === 'orbital') {
      for (let o = 0; o < 2; o++) player.orbitals.push({ angle: o * Math.PI, r: 50, hitCooldown: 0 });
    }
  }
  // Mark all prior rooms cleared and visited
  for (let i = 0; i < roomIdx; i++) {
    ROOM_GRAPH[i].cleared = true;
    ROOM_GRAPH[i].visited = true;
  }
  ROOM_GRAPH[roomIdx].visited = true;
  // Bloom must have been beaten to reach room 7+, so unlock the Act 2 door
  if (roomIdx >= 7) {
    ROOM_GRAPH[7].doors.east = 8;
    pet.befriended = true;
    pet.active = true;
    pet.x = player.x - 60;
    pet.y = player.y;
  }
  titleMode = 'main';
  titleSelected = 'play';
  loadRoom(roomIdx);
}

function killPlayer() {
  stopBGMusic();
  if (currentRoomIdx >= 8) {
    deathInAct2 = true;
    deathScreenSel = 0;
    gameState = 'DEAD';
  } else {
    gameState = 'TITLE';
    titleMode = 'main';
    titleSelected = 'play';
  }
}

function initBoss() {
  const d = DIFF[difficulty];
  const hp = d.bossHP;
  boss = {
    x: W/2, y: 220,
    hp, maxHP: hp,
    phase: 1,
    speed: d.bossSpeed,
    jumpTimer: 120,
    telegraphTimer: 0,
    telegraphing: false,
    shadowX: 0, shadowY: 0,
    jumpInFlight: false,
    jumpT: 0,
    startX: 0, startY: 0,
    hitFlash: 0,
    iframes: 0,
    slowTimer: 0,
    spawnedMinions1: false,
    spawnedMinions2: false,
    knockVx: 0, knockVy: 0,
    projectiles: [],
    animFrame: 0,
    animTimer: 0,
    orbitalCooldown: 0,
    chargeTimer: 200,
    charging: false,
    chargeWindup: 90,
    chargePulse: 0,
  };
}

function updateBloom(dt) {
  if (!boss) return;
  if (boss.hitFlash > 0) boss.hitFlash -= dt;
  if (boss.iframes > 0) boss.iframes -= dt;
  if (boss.slowTimer > 0) boss.slowTimer -= dt;
  if (boss.orbitalCooldown > 0) boss.orbitalCooldown -= dt;

  boss.animTimer += dt;
  if (boss.animTimer >= 8) { boss.animTimer = 0; boss.animFrame++; }

  if (boss.jumpInFlight) {
    boss.jumpT += 0.06 * dt;
    boss.x = boss.startX + (boss.shadowX - boss.startX) * boss.jumpT;
    boss.y = boss.startY + (boss.shadowY - boss.startY) * boss.jumpT
             - Math.sin(boss.jumpT * Math.PI) * 80;
    if (boss.jumpT >= 1) {
      boss.jumpInFlight = false;
      boss.x = boss.shadowX; boss.y = boss.shadowY;
      const shakeMag = boss.phase >= 2 ? 12 : 8;
      startShake(shakeMag, boss.phase >= 2 ? 20 : 14);
      spawnParticles(boss.x, boss.y, '#aa44ee', 20, 8, 40);
      spawnParticles(boss.x, boss.y, '#44ee88', 15, 6, 35);
      if (boss.phase >= 2) {
        const dx = player.x - boss.x, dy = player.y - boss.y;
        const len = Math.hypot(dx, dy) || 1;
        boss.projectiles.push({ x: boss.x, y: boss.y, vx: (dx/len)*2.2, vy: (dy/len)*2.2, life: 200, color: '#aa44ee', radius: 12 });
        if (boss.phase === 3) {
          const ang = Math.atan2(dy, dx) + 0.4;
          boss.projectiles.push({ x: boss.x, y: boss.y, vx: Math.cos(ang)*2.2, vy: Math.sin(ang)*2.2, life: 200, color: '#cc44ff', radius: 12 });
        }
      }
    }
    updateBossProjectiles(dt);
    return;
  }

  const speedMult = boss.slowTimer > 0 ? 0.4 : 1;
  const phaseSpeedMult = boss.phase === 3 ? 2.1 : boss.phase === 2 ? 1.6 : 1.0;
  const speed = boss.speed * speedMult * phaseSpeedMult;
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const len = Math.hypot(dx, dy) || 1;
  boss.knockVx *= Math.pow(0.85, dt); boss.knockVy *= Math.pow(0.85, dt);
  boss.x += ((dx/len)*speed + boss.knockVx) * dt;
  boss.y += ((dy/len)*speed + boss.knockVy) * dt;
  clampToRoom(boss, 45);

  const ph2thresh = Math.floor(boss.maxHP * 2/3);
  const ph3thresh = Math.floor(boss.maxHP * 1/3);

  if (boss.phase === 1 && boss.hp <= ph2thresh) {
    boss.phase = 2;
    boss.animFrame = 0;
    startShake(12, 20);
    if (!boss.spawnedMinions1) {
      boss.spawnedMinions1 = true;
      spawnEnemy('grub', boss.x - 130, boss.y + 80);
      spawnEnemy('grub', boss.x + 130, boss.y + 80);
      spawnEnemy('grub', boss.x,       boss.y + 130);
      spawnEnemy('fly',  boss.x - 60,  boss.y - 100);
      spawnEnemy('fly',  boss.x + 60,  boss.y - 100);
    }
  }

  if (boss.phase === 2 && boss.hp <= ph3thresh) {
    boss.phase = 3;
    boss.animFrame = 0;
    startShake(16, 25);
    if (!boss.spawnedMinions2) {
      boss.spawnedMinions2 = true;
      spawnEnemy('grub', boss.x - 180, boss.y + 60);
      spawnEnemy('grub', boss.x + 180, boss.y + 60);
      spawnEnemy('fly',  boss.x - 80,  boss.y - 120);
      spawnEnemy('fly',  boss.x + 80,  boss.y - 120);
      spawnEnemy('tank', boss.x,        boss.y + 160);
    }
  }

  const jumpTimerByPhase = boss.phase === 3 ? 65 : boss.phase === 2 ? 90 : 120;
  boss.jumpTimer -= dt;
  if (!boss.telegraphing && boss.jumpTimer <= 60) {
    boss.telegraphing = true;
    boss.telegraphTimer = 60;
    boss.shadowX = player.x; boss.shadowY = player.y;
  }
  if (boss.telegraphing) {
    boss.telegraphTimer -= dt;
    if (boss.telegraphTimer <= 0) {
      boss.telegraphing = false;
      boss.jumpInFlight = true;
      boss.jumpT = 0;
      boss.startX = boss.x; boss.startY = boss.y;
      boss.jumpTimer = jumpTimerByPhase;
      boss.animFrame = 0;
    }
  }

  // Charge-burst attack
  boss.chargeTimer -= dt;
  if (boss.chargePulse > 0) boss.chargePulse -= dt;
  if (!boss.charging && boss.chargeTimer <= boss.chargeWindup) {
    boss.charging = true;
  }
  if (boss.chargeTimer <= 0) {
    boss.charging = false;
    const burstCount = boss.phase === 3 ? 14 : 10;
    const baseAngle = Math.random() * Math.PI * 2;
    for (let i = 0; i < burstCount; i++) {
      const ang = baseAngle + (i / burstCount) * Math.PI * 2;
      boss.projectiles.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(ang) * 2.0, vy: Math.sin(ang) * 2.0,
        life: 220, color: '#FF69B4', radius: 13,
      });
    }
    startShake(6, 10);
    spawnParticles(boss.x, boss.y, '#FF69B4', 18, 5, 30);
    const chargeInterval = boss.phase === 3 ? 140 : boss.phase === 2 ? 190 : 250;
    boss.chargeTimer = chargeInterval;
    boss.chargePulse = boss.chargeWindup;
  }

  updateBossProjectiles(dt);
}

function updateBossProjectiles(dt) {
  if (!boss) return;
  for (let i = boss.projectiles.length - 1; i >= 0; i--) {
    const p = boss.projectiles[i];

    // Very slow homing: rotate velocity toward player at 0.008 rad/frame
    if (p.homing) {
      const targetAng = Math.atan2(player.y - p.y, player.x - p.x);
      let pAng = Math.atan2(p.vy, p.vx);
      let diff = targetAng - pAng;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      pAng += Math.sign(diff) * Math.min(Math.abs(diff), 0.008 * dt);
      const spd = Math.hypot(p.vx, p.vy);
      p.vx = Math.cos(pAng) * spd;
      p.vy = Math.sin(pAng) * spd;
    }

    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    const r = p.radius || 10;
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < PF_TOP || p.y > H) {
      boss.projectiles[i] = boss.projectiles[boss.projectiles.length - 1];
      boss.projectiles.pop(); continue;
    }
    if (player.iframes <= 0 && Math.hypot(p.x - player.x, p.y - player.y) < r + 14) {
      player.hp = Math.max(0, player.hp - 1);
      player.iframes = CONFIG.player.iframeDuration;
      startShake(4, 8);
      boss.projectiles[i] = boss.projectiles[boss.projectiles.length - 1];
      boss.projectiles.pop();
      if (player.hp <= 0) killPlayer();
    }
  }
}

function initPinky() {
  const hp = difficulty === 'hell' ? 150 : 100;
  const speed = DIFF[difficulty].bossSpeed * 2.0;
  boss = {
    bossType: 'pinky',
    x: W/2, y: 220,
    hp, maxHP: hp,
    phase: 1,
    speed,
    jumpTimer: 160,
    telegraphTimer: 0,
    telegraphing: false,
    shadowX: 0, shadowY: 0,
    jumpInFlight: false,
    jumpT: 0,
    startX: 0, startY: 0,
    hitFlash: 0,
    iframes: 0,
    slowTimer: 0,
    spawnedMinions1: false,
    projectiles: [],
    animFrame: 0,
    animTimer: 0,
    orbitalCooldown: 0,
    attackTimer: 120,
    attackAnim: 0,
    facing: 1,
    knockVx: 0, knockVy: 0,
    // Dash attack
    dashTimer: 220,
    dashTelegraph: 0,
    dashInFlight: false,
    dashVx: 0, dashVy: 0,
    dashLife: 0,
    // Spread shot
    shotTimer: 200,
    // Ring burst (phase 2+)
    ringTimer: 280,
    // Teleport blink (phase 3)
    blinkTimer: 320,
    blinkFlash: 0,
    transformed: false, // set true after first death triggers Owlet transformation
  };
}

function updatePinky(dt) {
  if (!boss) return;
  if (boss.hitFlash > 0) boss.hitFlash -= dt;
  if (boss.iframes > 0) boss.iframes -= dt;
  if (boss.slowTimer > 0) boss.slowTimer -= dt;
  if (boss.orbitalCooldown > 0) boss.orbitalCooldown -= dt;
  if (boss.attackAnim > 0) boss.attackAnim -= dt;

  boss.animTimer += dt;
  if (boss.animTimer >= 8) { boss.animTimer = 0; boss.animFrame++; }

  const dx = player.x - boss.x, dy = player.y - boss.y;
  const dist = Math.hypot(dx, dy) || 1;
  boss.facing = dx > 0 ? 1 : -1;

  // Phase transitions
  const hp = boss.maxHP;
  if (boss.phase === 1 && boss.hp <= hp * 2/3) {
    boss.phase = 2; boss.animFrame = 0;
    startShake(12, 20);
    if (!boss.spawnedMinions1) {
      boss.spawnedMinions1 = true;
      spawnEnemy('cyclops', boss.x - 160, boss.y + 80);
      spawnEnemy('cyclops', boss.x + 160, boss.y + 80);
    }
  }
  if (boss.phase === 2 && boss.hp <= hp * 1/3) {
    boss.phase = 3; boss.animFrame = 0;
    startShake(16, 25);
  }

  // Jump attack (phase 2+)
  if (boss.phase >= 2) {
    if (boss.jumpInFlight) {
      boss.jumpT += 0.08 * dt;
      boss.x = boss.startX + (boss.shadowX - boss.startX) * boss.jumpT;
      boss.y = boss.startY + (boss.shadowY - boss.startY) * boss.jumpT
               - Math.sin(boss.jumpT * Math.PI) * 60;
      if (boss.jumpT >= 1) {
        boss.jumpInFlight = false;
        boss.x = boss.shadowX; boss.y = boss.shadowY;
        startShake(10, 16);
        spawnParticles(boss.x, boss.y, '#FF69B4', 18, 7, 35);
        const projCount = boss.phase >= 3 ? 5 : 3;
        for (let i = 0; i < projCount; i++) {
          const spread = (i - (projCount - 1) / 2) * 0.25;
          const ang = Math.atan2(player.y - boss.y, player.x - boss.x) + spread;
          boss.projectiles.push({ x: boss.x, y: boss.y,
            vx: Math.cos(ang) * 3.5, vy: Math.sin(ang) * 3.5,
            life: 160, color: '#FF69B4', radius: 10 });
        }
      }
      updateBossProjectiles(dt);
      return;
    }

    const jumpInterval = boss.phase >= 3 ? 100 : 140;
    boss.jumpTimer -= dt;
    if (!boss.telegraphing && boss.jumpTimer <= 45) {
      boss.telegraphing = true;
      boss.telegraphTimer = 45;
      boss.shadowX = player.x; boss.shadowY = player.y;
    }
    if (boss.telegraphing) {
      boss.telegraphTimer -= dt;
      if (boss.telegraphTimer <= 0) {
        boss.telegraphing = false;
        boss.jumpInFlight = true;
        boss.jumpT = 0;
        boss.startX = boss.x; boss.startY = boss.y;
        boss.jumpTimer = jumpInterval;
        boss.animFrame = 0;
      }
    }
  }

  // Dash attack (all phases)
  if (boss.dashInFlight) {
    boss.x += boss.dashVx * dt;
    boss.y += boss.dashVy * dt;
    boss.dashLife -= dt;
    clampToRoom(boss, 32);
    if (player.iframes <= 0 && Math.hypot(boss.x - player.x, boss.y - player.y) < 48) {
      player.hp = Math.max(0, player.hp - 2);
      player.iframes = CONFIG.player.iframeDuration;
      player.vx = boss.dashVx * 0.5; player.vy = boss.dashVy * 0.5;
      startShake(8, 14); playPlayerHit();
      if (player.hp <= 0) killPlayer();
    }
    if (boss.dashLife <= 0) {
      boss.dashInFlight = false;
      const dashCooldown = boss.phase === 3 ? 100 : boss.phase === 2 ? 140 : 190;
      boss.dashTimer = dashCooldown;
    }
    updateBossProjectiles(dt);
    return;
  }
  if (boss.dashTelegraph > 0) {
    boss.dashTelegraph -= dt;
    if (boss.dashTelegraph <= 0) {
      const ddx = player.x - boss.x, ddy = player.y - boss.y;
      const dlen = Math.hypot(ddx, ddy) || 1;
      boss.dashVx = (ddx/dlen) * 10; boss.dashVy = (ddy/dlen) * 10;
      boss.dashInFlight = true; boss.dashLife = 28;
      spawnParticles(boss.x, boss.y, '#FF69B4', 10, 4, 20);
    }
    updateBossProjectiles(dt);
    return;
  }
  boss.dashTimer -= dt;
  if (boss.dashTimer <= 0) {
    boss.dashTelegraph = 50;
    spawnParticles(boss.x, boss.y, '#ff88cc', 6, 2, 15);
  }

  // Phase 1 melee attack
  if (boss.phase === 1) {
    boss.attackTimer -= dt;
    if (boss.attackTimer <= 0) {
      boss.attackTimer = 90;
      boss.attackAnim = 24;
      if (player.iframes <= 0 && dist < 90) {
        player.hp = Math.max(0, player.hp - 1.5);
        player.iframes = CONFIG.player.iframeDuration;
        player.vx = (dx/dist) * 6; player.vy = (dy/dist) * 6;
        startShake(5, 10); playPlayerHit();
        if (player.hp <= 0) killPlayer();
      }
    }
  }

  // Spread shot (all phases)
  boss.shotTimer -= dt;
  if (boss.shotTimer <= 0) {
    const shotCount = boss.phase >= 3 ? 5 : boss.phase >= 2 ? 4 : 3;
    const baseAng = Math.atan2(player.y - boss.y, player.x - boss.x);
    for (let i = 0; i < shotCount; i++) {
      const ang = baseAng + (i - (shotCount-1)/2) * 0.32;
      boss.projectiles.push({ x: boss.x, y: boss.y, vx: Math.cos(ang)*3, vy: Math.sin(ang)*3, life: 200, color: '#FF69B4', radius: 9 });
    }
    spawnParticles(boss.x, boss.y, '#FF69B4', 8, 3, 20);
    boss.shotTimer = boss.phase >= 3 ? 130 : boss.phase >= 2 ? 165 : 210;
    boss.attackAnim = 18;
  }

  // Ring burst (phase 2+)
  if (boss.phase >= 2) {
    boss.ringTimer -= dt;
    if (boss.ringTimer <= 0) {
      const count = boss.phase >= 3 ? 12 : 8;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2;
        boss.projectiles.push({ x: boss.x, y: boss.y, vx: Math.cos(ang)*2.5, vy: Math.sin(ang)*2.5, life: 220, color: '#ff88cc', radius: 9 });
      }
      startShake(5, 10);
      spawnParticles(boss.x, boss.y, '#ff88cc', 18, 5, 35);
      boss.ringTimer = boss.phase >= 3 ? 170 : 240;
      boss.animFrame = 0;
    }
  }

  // Teleport blink (phase 3 only)
  if (boss.phase >= 3) {
    if (boss.blinkFlash > 0) boss.blinkFlash -= dt;
    boss.blinkTimer -= dt;
    if (boss.blinkTimer <= 0) {
      spawnParticles(boss.x, boss.y, '#ffffff', 14, 4, 28);
      const ang = Math.atan2(boss.y - player.y, boss.x - player.x) + (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2);
      boss.x = Math.max(100, Math.min(W-100, player.x + Math.cos(ang) * 130));
      boss.y = Math.max(PF_TOP+60, Math.min(H-60, player.y + Math.sin(ang) * 100));
      spawnParticles(boss.x, boss.y, '#FF69B4', 14, 4, 28);
      startShake(4, 8);
      boss.blinkFlash = 12;
      boss.blinkTimer = 190;
    }
  }

  const speedMult = boss.slowTimer > 0 ? 0.4 : 1;
  const phaseMult = boss.phase === 3 ? 1.25 : boss.phase === 2 ? 1.05 : 1.0;
  const spd = boss.speed * speedMult * phaseMult;
  // Decelerate when very close so Pinky doesn't stick on top of the player
  const chaseDist = Math.max(0, dist - 60);
  const moveSpd = spd * Math.min(1, chaseDist / 80);
  boss.knockVx *= Math.pow(0.85, dt); boss.knockVy *= Math.pow(0.85, dt);
  boss.x += ((dx/dist)*moveSpd + boss.knockVx) * dt;
  boss.y += ((dy/dist)*moveSpd + boss.knockVy) * dt;
  clampToRoom(boss, 32);

  updateBossProjectiles(dt);
}

function killPinky() {
  if (!boss) return;
  if (!boss.transformed) { transformToOwlet(); return; }
  // Owlet truly defeated
  playBossDeath();
  spawnParticles(boss.x, boss.y, '#aaccff', 40, 8, 60);
  spawnParticles(boss.x, boss.y, '#ffffff', 20, 5, 50);
  spawnParticles(boss.x, boss.y, '#88aaee', 15, 4, 45);
  startShake(15, 30);
  enemies.forEach(e => spawnParticles(e.x, e.y, '#aaccff', 6, 3, 25));
  enemies.length = 0;
  boss = null;
  checkRoomClear();
}

function transformToOwlet() {
  startShake(28, 55);
  spawnParticles(boss.x, boss.y, '#ffffff', 70, 12, 100);
  spawnParticles(boss.x, boss.y, '#aaccff', 45, 9, 75);
  spawnParticles(boss.x, boss.y, '#FF69B4', 25, 7, 55);
  playBossDeath(); // reuse sound as transformation crack

  const hp = difficulty === 'hell' ? 90 : 60;
  boss.bossType  = 'owlet';
  boss.transformed = true;
  boss.hp        = hp;
  boss.maxHP     = hp;
  boss.phase     = 1;
  boss.projectiles = [];
  boss.iframes   = 140;   // brief invulnerability during transformation
  boss.hitFlash  = 0;
  boss.animFrame = 0;
  boss.animTimer = 0;
  boss.attackAnim = 0;
  boss.knockVx   = 0;  boss.knockVy  = 0;
  // Owlet-specific state
  boss.driftX    = W/2; boss.driftY  = H/2 - 60;
  boss.driftTimer    = 120;
  boss.homingTimer   = 180;
  boss.burstTimer    = 280;
  boss.spiralTimer   = 360;
  boss.spiralActive  = false;
  boss.spiralAngle   = 0;
  boss.spiralFireTimer = 0;
  boss.spiralCount   = 0;
  boss.crossTimer    = 300;
  boss.throwAnim     = 0;
}

function updateOwlet(dt) {
  if (!boss) return;
  if (boss.hitFlash  > 0) boss.hitFlash  -= dt;
  if (boss.iframes   > 0) boss.iframes   -= dt;
  if (boss.slowTimer > 0) boss.slowTimer -= dt;
  if (boss.attackAnim > 0) boss.attackAnim -= dt;
  if (boss.throwAnim  > 0) boss.throwAnim  -= dt;

  boss.animTimer += dt;
  if (boss.animTimer >= 10) { boss.animTimer = 0; boss.animFrame++; }

  const dx = player.x - boss.x, dy = player.y - boss.y;
  boss.facing = dx > 0 ? 1 : -1;

  // Phase 2 at 50% HP
  if (boss.phase === 1 && boss.hp <= boss.maxHP * 0.5) {
    boss.phase = 2;
    startShake(10, 18);
    spawnParticles(boss.x, boss.y, '#aaccff', 22, 6, 46);
  }

  // ── Slow drift (not chasing) ──────────────────────────────────────────
  boss.driftTimer -= dt;
  if (boss.driftTimer <= 0) {
    boss.driftX = W/2 + (Math.random() - 0.5) * 320;
    boss.driftY = PF_TOP + 70 + Math.random() * 200;
    boss.driftTimer = 140 + Math.floor(Math.random() * 100);
  }
  const ddx = boss.driftX - boss.x, ddy = boss.driftY - boss.y;
  const ddist = Math.hypot(ddx, ddy) || 1;
  const driftSpd = (boss.slowTimer > 0 ? 0.4 : 1) * 1.15;
  if (ddist > 24) {
    boss.x += (ddx / ddist) * driftSpd * dt;
    boss.y += (ddy / ddist) * driftSpd * dt;
  }
  boss.knockVx *= Math.pow(0.88, dt); boss.knockVy *= Math.pow(0.88, dt);
  boss.x += boss.knockVx * dt; boss.y += boss.knockVy * dt;
  boss.x = Math.max(80, Math.min(W - 80, boss.x));
  boss.y = Math.max(PF_TOP + 60, Math.min(H - 120, boss.y));

  // ── Homing shots (slow-tracking, 7s life, fade out at end) ───────────
  boss.homingTimer -= dt;
  if (boss.homingTimer <= 0) {
    const count = boss.phase >= 2 ? 5 : 3;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.28;
      const ang = Math.atan2(dy, dx) + spread;
      boss.projectiles.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(ang) * 2.4, vy: Math.sin(ang) * 2.4,
        life: 420, maxLife: 420,
        color: '#88bbff', radius: 8, homing: true,
      });
    }
    boss.throwAnim = 22;
    boss.homingTimer = boss.phase >= 2 ? 190 : 250;
  }

  // ── Radial burst ─────────────────────────────────────────────────────
  boss.burstTimer -= dt;
  if (boss.burstTimer <= 0) {
    const count = boss.phase >= 2 ? 16 : 12;
    const offset = Math.random() * Math.PI * 2;
    for (let i = 0; i < count; i++) {
      const ang = offset + (i / count) * Math.PI * 2;
      boss.projectiles.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(ang) * (2.8 + Math.random() * 0.4),
        vy: Math.sin(ang) * (2.8 + Math.random() * 0.4),
        life: 230, maxLife: 230, color: '#ccaaff', radius: 7,
      });
    }
    boss.attackAnim = 26;
    startShake(5, 8);
    spawnParticles(boss.x, boss.y, '#ccaaff', 14, 4, 28);
    boss.burstTimer = boss.phase >= 2 ? 270 : 360;
  }

  // ── Double spiral ────────────────────────────────────────────────────
  if (boss.spiralActive) {
    boss.spiralFireTimer -= dt;
    if (boss.spiralFireTimer <= 0) {
      boss.spiralAngle += 0.30;
      for (let s = 0; s < 2; s++) {
        const ang = boss.spiralAngle + s * Math.PI;
        boss.projectiles.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(ang) * 2.6, vy: Math.sin(ang) * 2.6,
          life: 200, maxLife: 200, color: '#ff99dd', radius: 6,
        });
      }
      boss.spiralFireTimer = 4;
      boss.spiralCount++;
      if (boss.spiralCount >= (boss.phase >= 2 ? 30 : 22)) {
        boss.spiralActive = false; boss.spiralCount = 0;
      }
    }
  } else {
    boss.spiralTimer -= dt;
    if (boss.spiralTimer <= 0) {
      boss.spiralActive  = true;
      boss.spiralAngle   = Math.atan2(dy, dx);
      boss.spiralFireTimer = 0;
      boss.spiralCount   = 0;
      boss.spiralTimer   = boss.phase >= 2 ? 310 : 410;
      boss.attackAnim = 14;
    }
  }

  // ── 8-ray star burst (phase 2+) ──────────────────────────────────────
  if (boss.phase >= 2) {
    boss.crossTimer -= dt;
    if (boss.crossTimer <= 0) {
      const baseAng = Math.atan2(dy, dx);
      for (let arm = 0; arm < 4; arm++) {
        const ang = baseAng + arm * Math.PI / 2;
        boss.projectiles.push({ x: boss.x, y: boss.y,
          vx: Math.cos(ang) * 3.2, vy: Math.sin(ang) * 3.2,
          life: 200, maxLife: 200, color: '#ff88bb', radius: 8 });
      }
      for (let arm = 0; arm < 4; arm++) {
        const ang = baseAng + Math.PI / 4 + arm * Math.PI / 2;
        boss.projectiles.push({ x: boss.x, y: boss.y,
          vx: Math.cos(ang) * 2.6, vy: Math.sin(ang) * 2.6,
          life: 220, maxLife: 220, color: '#ffaace', radius: 6 });
      }
      boss.attackAnim = 22;
      startShake(4, 7);
      boss.crossTimer = 290;
    }
  }

  updateBossProjectiles(dt);
}

function updatePet(dt) {
  if (!pet.active) return;
  pet.bounceTimer += dt;
  if (!pet.befriended) return;

  // Follow player
  const dx = player.x - pet.x, dy = player.y - pet.y;
  const dist = Math.hypot(dx, dy);
  const targetDist = 60;
  if (dist > targetDist + 5) {
    const speed = Math.min((dist - targetDist) * 0.1, 4);
    pet.x += (dx/dist) * speed * dt;
    pet.y += (dy/dist) * speed * dt;
  }

  // Ally attack
  if (pet.attackTimer > 0) pet.attackTimer -= dt;
  if (pet.attacking) {
    pet.attackAnim += dt;
    if (pet.attackAnim >= 24) { pet.attacking = false; pet.attackAnim = 0; }
    return;
  }

  if (pet.attackTimer <= 0 && (enemies.length > 0 || boss)) {
    let nearest = null, nearestDist = 85;
    for (const e of enemies) {
      const d = Math.hypot(e.x - pet.x, e.y - pet.y);
      if (d < nearestDist) { nearestDist = d; nearest = e; }
    }
    if (boss) {
      const d = Math.hypot(boss.x - pet.x, boss.y - pet.y);
      if (d < nearestDist) { nearestDist = d; nearest = boss; }
    }

    if (nearest) {
      pet.attacking = true;
      pet.attackAnim = 0;
      pet.attackTimer = 120;
      spawnParticles(nearest.x, nearest.y, '#aa44ee', 8, 3, 18);
      if (nearest === boss) {
        if (boss.iframes <= 0) {
          boss.hp = Math.max(0, boss.hp - 1.5);
          boss.hitFlash = 6;
          boss.iframes = 10;
          if (boss.hp <= 0) {
            if (boss.bossType === 'pinky') killPinky();
            else killBoss();
          }
        }
      } else {
        const idx = enemies.indexOf(nearest);
        if (idx >= 0) {
          playHit();
          nearest.hp -= 1.5;
          nearest.hitFlash = 6;
          if (nearest.hp <= 0) killEnemy(nearest, idx);
        }
      }
    }
  }
}

let lastTime = performance.now();
(function loop(now) {
  const elapsed = now - lastTime;
  lastTime = now;
  const dt = Math.min(elapsed / (1000 / 60), 3);
  update(dt);
  render();
  requestAnimationFrame(loop);
})(performance.now());

// Crisp canvas: buffer = exact physical pixels (CSS display × device DPR = zero upscaling)
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const scaleX = (window.innerWidth  - 16) / W;
  const scaleY = (window.innerHeight - 16) / H;
  const cssScale = Math.min(scaleX, scaleY);

  // CSS display size — what the user visually sees
  const cssW = Math.round(W * cssScale);
  const cssH = Math.round(H * cssScale);
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  // Physical buffer = CSS size × DPR → canvas pixels match screen pixels exactly
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  // ctx scale: game logic runs in 900×560 coords, maps to physical buffer
  renderDPR = canvas.width / W;
}
window.addEventListener('resize', () => {
  resizeCanvas();
  if (activeVideoEl && gameState === 'POPUP') {
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width / W, sy = rect.height / H;
    activeVideoEl.style.left   = (rect.left + VID_FRAME.x * sx) + 'px';
    activeVideoEl.style.top    = (rect.top  + VID_FRAME.y * sy) + 'px';
    activeVideoEl.style.width  = Math.round(VID_FRAME.w * sx) + 'px';
    activeVideoEl.style.height = Math.round(VID_FRAME.h * sy) + 'px';
  }
});
resizeCanvas();

// ─── COMBAT ───────────────────────────────────────────────────────────────
function checkRoomClear() {
  if (enemies.length > 0 || boss !== null) return;
  if (bossDialogue.active) return;
  if (currentRoom.cleared) return;

  // Wave system: if more waves remain, queue next wave instead of clearing
  if (currentRoom.waves && currentWave < currentRoom.waves.length - 1) {
    currentWave++;
    waveTransitionTimer = 90; // ~1.5s pause before next wave
    waveNotifyTimer = 90;
    return;
  }

  currentRoom.cleared = true;
  playDoorUnlock();
  const noSkip = ['start', 'garden', 'boss', 'boss2'];
  if (!noSkip.includes(currentRoom.type)) {
    // Replenish pool if running low
    if (skillPool.length < 2) {
      const activeSkills = Object.entries(player.skills).filter(([,v]) => v).map(([k]) => k);
      const all = ['homing','explosive','piercing','orbital','freeze','boomerang','triple','speed','dash'];
      const refill = all.filter(s => !activeSkills.includes(s));
      for (let i = refill.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [refill[i], refill[j]] = [refill[j], refill[i]];
      }
      skillPool.push(...refill);
    }
    skillPickupState.choices = [skillPool.pop(), skillPool.pop()].filter(Boolean);
    skillPickupState.selected = 0;
    skillPickupState.pendingSkill = null;
    skillPickupState.replaceMode = false;
    gameState = 'SKILL_PICKUP';
    for (const k in keys) keys[k] = false;
  }
}

function damageEnemy(e, tearVx, tearVy, idx) {
  playHit();
  e.hp -= DIFF[difficulty].tearDamage;
  e.hitFlash = 6;
  const len = Math.hypot(tearVx, tearVy) || 1;
  e.knockVx = (tearVx / len) * 4;
  e.knockVy = (tearVy / len) * 4;
  if (player.skills.freeze) e.slowTimer = 120;
  if (e.hp <= 0) killEnemy(e, idx);
}

function killBoss() {
  if (!boss) return;
  playBossDeath();
  spawnParticles(boss.x, boss.y, '#aa44ee', 40, 8, 60);
  spawnParticles(boss.x, boss.y, '#44ee88', 20, 6, 50);
  spawnParticles(boss.x, boss.y, '#ffffff', 15, 5, 45);
  startShake(15, 30);
  // Clear remaining minions with particle burst
  enemies.forEach(e => spawnParticles(e.x, e.y, '#aa44ee', 6, 3, 25));
  enemies.length = 0;
  // Start defeat dialogue
  bossDialogue.active = true;
  bossDialogue.phase = 'waiting';
  bossDialogue.choice = null;
  bossDialogue.deathX = boss.x;
  bossDialogue.deathY = boss.y;
  boss = null;
  // Note: checkRoomClear is called when dialogue completes
}

function killEnemy(e, idx) {
  const heavy = e.type === 'tank' || e.type === 'brute';
  if (heavy) playTankDeath(); else playEnemyDeath();
  const colors = { grub: '#4aaa2a', fly: '#6666ff', tank: '#cc2222', cyclops: '#cc8833', brute: '#4488ff', sentinel: '#cc8844' };
  spawnParticles(e.x, e.y, colors[e.type] || '#fff', heavy ? 20 : 10, heavy ? 6 : 4, heavy ? 40 : 20);
  if (heavy) startShake(8, 12);
  const dropChance = heavy ? 0.40 : e.type === 'sentinel' ? 0.30 : 0.20;
  if (Math.random() < dropChance) healthPacks.push({ x: e.x, y: e.y, life: 420 });
  enemies[idx] = enemies[enemies.length - 1];
  enemies.pop();
  checkRoomClear();
}

function updateHealthPacks(dt) {
  for (let i = healthPacks.length - 1; i >= 0; i--) {
    const h = healthPacks[i];
    h.life -= dt;
    if (h.life <= 0) { healthPacks.splice(i, 1); continue; }
    // Always collect on contact — heal only if below max (no overflow, no underflow)
    if (Math.hypot(player.x - h.x, player.y - h.y) < 36) {
      if (player.hp < player.maxHP) {
        player.hp = Math.min(player.maxHP, player.hp + 1);
        spawnParticles(h.x, h.y, '#FF6B9D', 12, 3, 25);
        playHeal();
      }
      healthPacks.splice(i, 1);
    }
  }
}

function segmentPointDist(ex, ey, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(ex-ax, ey-ay);
  const t = Math.max(0, Math.min(1, ((ex-ax)*dx + (ey-ay)*dy) / len2));
  return Math.hypot(ex - (ax + t*dx), ey - (ay + t*dy));
}

function checkTearEnemyCollisions() {
  for (let ti = tears.length - 1; ti >= 0; ti--) {
    const t = tears[ti];
    let tearUsed = false;

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (t.hitEnemies.has(ei)) continue;
      const tearDist = (t.prevX !== undefined)
        ? segmentPointDist(e.x, e.y, t.prevX, t.prevY, t.x, t.y)
        : Math.hypot(t.x - e.x, t.y - e.y);
      if (tearDist < t.radius + enemyRadius(e)) {
        if (player.skills.explosive) {
          [[1,0],[-1,0]].forEach(([sx, sy]) => {
            tears.push({
              x: t.x, y: t.y,
              vx: sx * CONFIG.player.tearSpeed * 0.45,
              vy: sy * CONFIG.player.tearSpeed * 0.45,
              life: 9, lifespan: 9, radius: t.radius,
              hitEnemies: new Set([ei]), returning: false,
            });
          });
        }
        impactParticles(t.x, t.y, '#88aaff');
        damageEnemy(e, t.vx, t.vy, ei);
        if (!player.skills.piercing) {
          tears.splice(ti, 1);
          tearUsed = true;
          break;
        } else {
          t.hitEnemies.add(ei);
        }
      }
    }
    if (tearUsed) continue;
    // Boss tear collision
    if (boss && boss.hp > 0 && !tearUsed && boss.iframes <= 0) {
      const bossDist = (t.prevX !== undefined)
        ? segmentPointDist(boss.x, boss.y, t.prevX, t.prevY, t.x, t.y)
        : Math.hypot(t.x - boss.x, t.y - boss.y);
      if (bossDist < t.radius + (boss.bossType === 'pinky' || boss.bossType === 'owlet' ? 28 : 45)) {
        if (player.skills.freeze) boss.slowTimer = 120;
        boss.hp = Math.max(0, boss.hp - DIFF[difficulty].tearDamage);
        boss.hitFlash = 6;
        boss.iframes = 10;
        const len = Math.hypot(t.vx, t.vy) || 1;
        boss.knockVx = (t.vx/len) * 2; boss.knockVy = (t.vy/len) * 2;
        if (player.skills.explosive) {
          [[1,0],[-1,0]].forEach(([sx,sy]) => {
            tears.push({ x:t.x, y:t.y, vx:sx*CONFIG.player.tearSpeed*0.45, vy:sy*CONFIG.player.tearSpeed*0.45,
                         life:9, lifespan:9, radius:t.radius,
                         hitEnemies:new Set(['boss']), returning:false });
          });
        }
        impactParticles(t.x, t.y, '#ffaaaa');
        if (!player.skills.piercing) {
          tears.splice(ti, 1);
        } else {
          t.hitEnemies.add('boss');
        }
        if (boss && boss.hp <= 0) {
          if (boss.bossType === 'pinky' || boss.bossType === 'owlet') killPinky(); else killBoss();
        }
      }
    }
  }
}

function checkPlayerEnemyCollisions() {
  if (player.iframes > 0) return;
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];
    if (Math.hypot(player.x - e.x, player.y - e.y) < 16 + enemyRadius(e)) {
      playPlayerHit();
      player.hp = Math.max(0, player.hp - 1);
      player.iframes = CONFIG.player.iframeDuration;
      // Knock player away from enemy
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      player.vx = (dx / len) * 5;
      player.vy = (dy / len) * 5;
      startShake(4, 8);
      if (player.hp <= 0) { killPlayer(); }
      break;
    }
  }
}

// ─── DRAWING ──────────────────────────────────────────────────────────────
function px(size) { return `${size}px 'Press Start 2P', monospace`; }

function drawRoom(room) {
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const rx = tx * TILE, ry = PF_TOP + ty * TILE;
      const isWall = tx===0 || tx===COLS-1 || ty===0 || ty===ROWS-1;
      const isObstacle = room.obstacleSet ? room.obstacleSet.has(`${tx},${ty}`) : room.obstacles.some(([ox,oy]) => ox===tx && oy===ty);

      if (isWall) {
        // Stone border walls
        if (tileset.stone && tileset.stone.naturalWidth > 0) {
          ctx.drawImage(tileset.stone, 0, 0, 128, 128, rx, ry, TILE, TILE);
          // Darken walls slightly
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(rx, ry, TILE, TILE);
        } else {
          ctx.fillStyle = '#4a4a3a';
          ctx.fillRect(rx, ry, TILE, TILE);
          ctx.fillStyle = '#5a5a4a';
          ctx.fillRect(rx+2, ry+2, TILE-4, TILE-4);
        }
      } else if (isObstacle) {
        // Grass base under obstacle
        if (tileset.grass && tileset.grass.naturalWidth > 0) {
          ctx.drawImage(tileset.grass, 0, 0, 128, 128, rx, ry, TILE, TILE);
        } else {
          ctx.fillStyle = '#2a5a2a'; ctx.fillRect(rx, ry, TILE, TILE);
        }
        // Bush or rock — slightly smaller than tile, bushes sway
        const useRock = (tx + ty) % 3 === 0;
        if (useRock && tileset.props && tileset.props.naturalWidth > 0) {
          // Rock: no sway, centered, a bit smaller
          const rw = TILE - 10, rh = TILE - 18;
          ctx.drawImage(tileset.props, 2, 428, 58, 44, rx + (TILE-rw)/2, ry + TILE - rh - 4, rw, rh);
        } else if (tileset.plant && tileset.plant.naturalWidth > 0) {
          // Bush: gentle wind sway, slightly smaller
          const sway = Math.sin(frameCount * 0.018 + rx * 0.055 + ry * 0.04) * 2.5;
          const bw = TILE - 6, bh = TILE - 8;
          ctx.drawImage(tileset.plant, 212, 182, 54, 48, rx + (TILE-bw)/2 + sway, ry + (TILE-bh), bw, bh);
        } else {
          ctx.fillStyle = '#3a6a3a';
          ctx.beginPath(); ctx.arc(rx+TILE/2, ry+TILE/2, 22, 0, Math.PI*2); ctx.fill();
        }
      } else {
        // Grass floor — 8 distinct tile crops from the 256×256 sheet (4×4 grid of 64px tiles)
        if (tileset.grass && tileset.grass.naturalWidth > 0) {
          const v = (tx * 3 + ty * 7 + room.id * 11) % 8;
          ctx.drawImage(tileset.grass, (v % 4) * 64, Math.floor(v / 4) * 64, 64, 64, rx, ry, TILE, TILE);
        } else {
          ctx.fillStyle = (tx+ty)%2===0 ? '#2a5a2a' : '#2e6430';
          ctx.fillRect(rx, ry, TILE, TILE);
        }
        if (room.type === 'garden') {
          ctx.fillStyle = 'rgba(100,200,100,0.08)';
          ctx.fillRect(rx, ry, TILE, TILE);
        }
      }
    }
  }

  // Doors
  const doorDefs = {
    north: { x: W/2-30, y: PF_TOP,    w: 60,   h: TILE },
    south: { x: W/2-30, y: H-TILE,    w: 60,   h: TILE },
    east:  { x: W-TILE, y: H/2-30,    w: TILE, h: 60   },
    west:  { x: 0,      y: H/2-30,    w: TILE, h: 60   },
  };
  Object.entries(room.doors).forEach(([dir, targetIdx]) => {
    if (targetIdx === null) return;
    const d = doorDefs[dir];
    const locked = !room.cleared;
    // Door opening — draw grass under it
    if (tileset.grass && tileset.grass.naturalWidth > 0) {
      ctx.drawImage(tileset.grass, 0, 0, 64, 64, d.x, d.y, d.w, d.h);
    }
    // Door frame overlay
    ctx.fillStyle = locked ? 'rgba(200,50,50,0.75)' : 'rgba(80,200,80,0.45)';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    if (locked) {
      ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 3;
      const isVert = dir==='north'||dir==='south';
      for (let i=0; i<3; i++) {
        const off = 12 + i*14;
        ctx.beginPath();
        if (isVert) { ctx.moveTo(d.x+off, d.y); ctx.lineTo(d.x+off, d.y+d.h); }
        else        { ctx.moveTo(d.x, d.y+off); ctx.lineTo(d.x+d.w, d.y+off); }
        ctx.stroke();
      }
    }
  });

  // Decorative floor scatter — varied grass tufts, small flowers, with gentle sway
  for (let i = 0; i < 22; i++) {
    const t  = (room.id * 17 + i * 41) % 121;
    const t2 = (room.id * 31 + i * 13) % 97;
    const tx = 2 + (t  * 13) % (COLS - 4);
    const ty = 2 + (t2 *  9) % (ROWS - 4);
    if (room.obstacleSet ? room.obstacleSet.has(`${tx},${ty}`) : room.obstacles.some(([ox,oy]) => ox===tx && oy===ty)) continue;
    const rx = tx * TILE + TILE / 2;
    const ry = PF_TOP + ty * TILE + TILE / 2;
    const sway = Math.sin(frameCount * 0.022 + rx * 0.07 + ry * 0.05) * 1.8;
    // vary sprite row (2 grass tuft rows in TX Plant.png) and size
    const row   = i % 2 === 0 ? 400 : 432;
    const col   = (i % 4) * 32;
    const scale = 0.65 + (i % 5) * 0.07; // 0.65–0.93
    const w = Math.round(24 * scale);
    const h = Math.round(20 * scale);
    if (tileset.plant && tileset.plant.naturalWidth > 0) {
      ctx.drawImage(tileset.plant, col, row, 24, 20, rx - w / 2 + sway, ry - h / 2, w, h);
    } else {
      ctx.fillStyle = i % 2 === 0 ? '#e8c547' : '#FFB3C6';
      ctx.beginPath(); ctx.arc(rx + sway, ry, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Vignette overlay (gradient cached — never changes)
  if (!drawRoom._vignette) {
    const g = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(20,10,30,0.5)');
    drawRoom._vignette = g;
  }
  ctx.fillStyle = drawRoom._vignette;
  ctx.fillRect(0, PF_TOP, W, H-PF_TOP);
}

const SKILL_META = {
  homing:    { icon:'🎯', name:'HOMING TEARS',    desc:'Tears curve toward nearest enemy' },
  explosive: { icon:'💥', name:'EXPLOSIVE TEARS', desc:'Burst into 2 shards on impact' },
  piercing:  { icon:'👻', name:'PIERCING TEARS',  desc:'Pass through all enemies' },
  orbital:   { icon:'🛡️', name:'ORBITAL SHIELD', desc:'2 orbs orbit and damage enemies' },
  freeze:    { icon:'❄️', name:'FREEZE TEARS',    desc:'Slow enemies by 60% on hit' },
  boomerang: { icon:'🔄', name:'BOOMERANG TEARS', desc:'Return at max range, hit twice' },
  triple:    { icon:'🌀', name:'TRIPLE SHOT',     desc:'Fire 3 tears in a spread' },
  speed:     { icon:'⚡', name:'SPEED TEARS',     desc:'Tears move 80% faster' },
  dash:      { icon:'💨', name:'DASH',            desc:'Space to dash · 3s cooldown' },
};

function activeSkills() {
  return Object.entries(player.skills).filter(([,v]) => v).map(([k]) => k);
}

function updateSkillPickup() {
  if (skillNavCooldown > 0) { skillNavCooldown--; return; }
  const active = activeSkills();
  const atMax = active.length >= 4;
  const showSkip = atMax;
  const numCards = skillPickupState.replaceMode ? skillPickupState.choices.length
                  : showSkip ? 3 : 2;

  if (keys['ArrowLeft']  || keys['a'] || keys['A']) {
    skillPickupState.selected = Math.max(0, skillPickupState.selected - 1);
    skillNavCooldown = 14;
  }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) {
