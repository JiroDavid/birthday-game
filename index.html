    skillPickupState.selected = Math.min(numCards - 1, skillPickupState.selected + 1);
    skillNavCooldown = 14;
  }

  // Back out of replace mode
  if (skillPickupState.replaceMode && (keys['Escape'] || keys['b'] || keys['B'])) {
    skillPickupState.replaceMode = false;
    skillPickupState.pendingSkill = null;
    skillPickupState.choices = [...skillPickupState.originalChoices];
    skillPickupState.selected = 0; skillNavCooldown = 20;
    return;
  }

  if (keys['e'] || keys['E'] || keys['Enter'] || keys[' ']) {
    const sel = skillPickupState.selected;
    const exitPickup = () => {
      skillPickupState.choices = []; gameState = 'PLAYING'; skillNavCooldown = 20;
      for (const k in keys) keys[k] = false;
      Object.keys(keysJustPressed).forEach(k => delete keysJustPressed[k]);
    };
    if (skillPickupState.replaceMode) {
      const toReplace = skillPickupState.choices[sel];
      player.skills[toReplace] = false;
      if (toReplace === 'orbital') player.orbitals = [];
      if (toReplace === 'dash') { player.dashCooldown = 0; player.dashActive = 0; }
      applySkill(skillPickupState.pendingSkill);
      skillPickupState.replaceMode = false; skillPickupState.pendingSkill = null;
      exitPickup();
    } else {
      const isSkipSlot = showSkip && sel === 2;
      if (isSkipSlot) {
        exitPickup();
      } else if (sel < skillPickupState.choices.length) {
        const chosen = skillPickupState.choices[sel];
        if (atMax) {
          skillPickupState.originalChoices = [...skillPickupState.choices];
          skillPickupState.pendingSkill = chosen;
          skillPickupState.choices = active;
          skillPickupState.replaceMode = true;
          skillPickupState.selected = 0; skillNavCooldown = 20;
        } else {
          applySkill(chosen);
          exitPickup();
        }
      }
    }
  }
}

function drawSkillPickup() {
  ctx.fillStyle = 'rgba(20,5,30,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';

  if (skillPickupState.replaceMode) {
    ctx.fillStyle = '#FF69B4'; ctx.font = px(12);
    ctx.fillText('SKILL LIMIT REACHED', W/2, 130);
    ctx.fillStyle = '#888'; ctx.font = px(9);
    ctx.fillText('Pick a skill to REPLACE with: ' + (SKILL_META[skillPickupState.pendingSkill]?.name || ''), W/2, 158);

    const cards = skillPickupState.choices;
    const cardW = 155, cardH = 140;
    const totalW = cards.length * (cardW + 12) - 12;
    const startX = W/2 - totalW/2;
    cards.forEach((skillId, i) => {
      const meta = SKILL_META[skillId];
      const cx = startX + i * (cardW + 12) + cardW/2;
      const cy = H/2 + 10;
      const sel = skillPickupState.selected === i;
      ctx.fillStyle = sel ? '#3d0018' : '#1a0a28';
      ctx.strokeStyle = sel ? '#FF69B4' : '#5a3a6a';
      ctx.lineWidth = sel ? 3 : 1;
      roundRect(ctx, cx-cardW/2, cy-cardH/2, cardW, cardH, 8);
      ctx.fill(); ctx.stroke();
      ctx.font = '26px serif'; ctx.fillText(meta.icon, cx, cy-32);
      ctx.fillStyle = sel ? '#FFD6E0' : '#888'; ctx.font = px(6);
      ctx.fillText(meta.name, cx, cy);
      ctx.fillStyle = '#ff4444'; ctx.font = px(5);
      ctx.fillText('REMOVE', cx, cy + 22);
    });
  } else {
    ctx.fillStyle = '#FFB3C6'; ctx.font = px(14);
    ctx.fillText('❖ UPGRADE ❖', W/2, 130);
    const active = activeSkills();
    const atMax = active.length >= 4;
    ctx.fillStyle = atMax ? '#ff8888' : '#666'; ctx.font = px(7);
    ctx.fillText('Skills: ' + active.length + '/4' + (atMax ? ' — FULL' : ''), W/2, 154);

    const cards = atMax ? [...skillPickupState.choices, 'skip'] : skillPickupState.choices;
    const cardW = 175, cardH = 152;
    const totalW = cards.length * (cardW + 12) - 12;
    const startX = W/2 - totalW/2;
    cards.forEach((skillId, i) => {
      const isSkip = skillId === 'skip';
      const meta = isSkip ? { icon: '⏭', name: 'SKIP', desc: 'Keep current skills as-is' } : SKILL_META[skillId];
      const cx = startX + i * (cardW + 12) + cardW/2;
      const cy = H/2 + 14;
      const sel = skillPickupState.selected === i;
      ctx.fillStyle = sel ? (isSkip ? '#181818' : '#2d1040') : '#1a0a28';
      ctx.strokeStyle = sel ? (isSkip ? '#777' : '#FFB3C6') : '#5a3a6a';
      ctx.lineWidth = sel ? 3 : 1;
      roundRect(ctx, cx-cardW/2, cy-cardH/2, cardW, cardH, 8);
      ctx.fill(); ctx.stroke();
      ctx.font = '28px serif'; ctx.fillText(meta.icon, cx, cy-34);
      ctx.fillStyle = sel ? (isSkip ? '#aaa' : '#FFD6E0') : '#C7F0BD'; ctx.font = px(6);
      ctx.fillText(meta.name, cx, cy - 4);
      if (!isSkip) {
        ctx.fillStyle = '#888'; ctx.font = px(5);
        wrapText(ctx, meta.desc, cx, cy+16, cardW-20, 13);
        if (atMax) { ctx.fillStyle = '#FF69B4'; ctx.font = px(5); ctx.fillText('▶ pick to replace a skill', cx, cy+48); }
      } else {
        ctx.fillStyle = '#555'; ctx.font = px(5); ctx.fillText(meta.desc, cx, cy+16);
      }
    });
  }

  const hint = skillPickupState.replaceMode
    ? '[← →] choose skill to remove   [B/Esc] go back'
    : '[← →] navigate   [E] select';
  ctx.fillStyle = '#555'; ctx.font = px(5);
  ctx.fillText(hint, W/2, H - 70);
  ctx.restore();
}

function updateBossIntro() {
  bossIntro.timer++;
  if (bossIntro.timer === 1) playBossIntro();
  if (bossIntro.timer >= bossIntro.duration) { for (const k in keys) keys[k] = false; gameState = 'PLAYING'; }
}

function drawBossIntro() {
  const isPinky = currentRoom && currentRoom.type === 'boss2';
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  const alpha = Math.min(1, bossIntro.timer/20);
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.fillStyle = isPinky ? '#FF69B4' : '#cc3333'; ctx.font = px(16);
  ctx.fillText(isPinky ? 'PINKY' : 'BLOOM', W/2, H/2-20);
  ctx.fillStyle = '#888'; ctx.font = px(14);
  ctx.fillText(isPinky ? 'She fights just like you...' : "She's here to protect her slimes...", W/2, H/2+20);
  ctx.restore();
}

// ─── SKILLS ───────────────────────────────────────────────────────────────
function applySkill(skillId) {
  playSkillPickup();
  player.skills[skillId] = true;
  spawnParticles(player.x, player.y, '#e8c547', 20, 5, 30);

  if (skillId === 'orbital') {
    player.orbitals = [
      { angle: 0,       speed: 0.04 },
      { angle: Math.PI, speed: 0.04 },
    ];
  }
}

function updateOrbitals(dt) {
  if (!player.skills.orbital || player.orbitals.length === 0) return;
  const r = 50;
  for (let oi = 0; oi < player.orbitals.length; oi++) {
    const orb = player.orbitals[oi];
    orb.angle += orb.speed * dt;
    orb.x = player.x + Math.cos(orb.angle) * r;
    orb.y = player.y + Math.sin(orb.angle) * r;

    // Check vs enemies (reverse loop so splices are safe)
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if ((e.orbitalCooldown || 0) > 0) continue;
      if (Math.hypot(orb.x - e.x, orb.y - e.y) < enemyRadius(e) + 8) {
        damageEnemy(e, 0, 0, ei);
        e.orbitalCooldown = 30;
      }
    }
    // Check vs boss
    if (boss && boss.hp > 0) {
      if (Math.hypot(orb.x - boss.x, orb.y - boss.y) < 40 + 8) {
        if ((!boss.orbitalCooldown || boss.orbitalCooldown <= 0) && boss.iframes <= 0) {
          boss.hp--;
          boss.hitFlash = 6;
          boss.iframes = 10;
          boss.orbitalCooldown = 30;
          if (boss.hp <= 0) {
            if (boss.bossType === 'pinky' || boss.bossType === 'owlet') killPinky(); else killBoss();
          }
        }
      }
    }
  }
}

function drawOrbitals() {
  if (!player.skills.orbital || player.orbitals.length === 0) return;
  ctx.save();
  ctx.strokeStyle = '#e8c547';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#e8c547';
  ctx.shadowBlur = 8;
  ctx.fillStyle = 'rgba(232,197,71,0.4)';
  for (let i = 0; i < player.orbitals.length; i++) {
    const orb = player.orbitals[i];
    if (orb.x === undefined) continue;
    ctx.beginPath(); ctx.arc(orb.x, orb.y, 8, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(player.x, player.y + 28, 18, 7, 0, 0, Math.PI*2); ctx.fill();

  // Blink during i-frames
  if (player.iframes > 0 && Math.floor(frameCount / 4) % 2 === 1) {
    ctx.restore(); return;
  }

  ctx.translate(player.x, player.y);
  ctx.scale(player.facing, 1);

  // Pick animation sheet + frame count
  let sheet = null, frameCount2 = 1;
  const isMoving = (keys['w']||keys['W']||keys['s']||keys['S']||keys['a']||keys['A']||keys['d']||keys['D']);
  if (player.iframes > 0 && dudeSprites.hurt) {
    sheet = dudeSprites.hurt; frameCount2 = DUDE_FRAMES.hurt;
  } else if (isMoving && dudeSprites.walk) {
    sheet = dudeSprites.walk; frameCount2 = DUDE_FRAMES.walk;
  } else if (dudeSprites.idle) {
    sheet = dudeSprites.idle; frameCount2 = DUDE_FRAMES.idle;
  }

  const frame = Math.floor(player.animFrame % frameCount2);

  if (sheet && sheet.naturalWidth > 0) {
    ctx.drawImage(sheet, frame * DUDE_FS, 0, DUDE_FS, DUDE_FS,
                  -DUDE_DS/2, -DUDE_DS/2, DUDE_DS, DUDE_DS);
  } else {
    // Fallback placeholder
    ctx.fillStyle = '#c8a87a';
    ctx.beginPath(); ctx.arc(0, -8, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6,-10,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-10,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#88aaff';
    ctx.beginPath(); ctx.ellipse(-7,-4,2,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-4,2,4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGrub(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const frame = Math.floor(e.animFrame % GRUB_FRAMES);
  if (grubSprites.crawl && grubSprites.crawl.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    ctx.drawImage(grubSprites.crawl, frame * GRUB_FS, 0, GRUB_FS, GRUB_FS,
                  -GRUB_DS/2, -GRUB_DS/2, GRUB_DS, GRUB_DS);
    ctx.filter = 'none';
  } else {
    // Canvas fallback (original hop/squash art)
    const bob = Math.sin(e.hopTimer / 30 * Math.PI * 2) * 4;
    const squash = 1 + Math.abs(Math.sin(e.hopTimer / 30 * Math.PI * 2)) * 0.2;
    ctx.translate(0, bob);
    ctx.scale(1/squash, squash);
    const bodyColor = e.hitFlash>0 ? '#fff' : e.slowTimer>0 ? '#88ccff' : '#4a8a2a';
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0,0,18,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6,-5,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-5,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFly(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  let sheet = null, frames = 1;
  if (e.hitFlash > 0 && batSprites.hurt)         { sheet = batSprites.hurt; frames = BAT_FRAMES.hurt; }
  else if (e.phase === 'dash' && batSprites.run)  { sheet = batSprites.run;  frames = BAT_FRAMES.run; }
  else if (batSprites.idle)                        { sheet = batSprites.idle; frames = BAT_FRAMES.idle; }

  const frame = Math.floor(e.animFrame % frames);

  if (sheet && sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    if (e.phase === 'telegraph') {
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 15 * Math.abs(Math.sin(frameCount * 0.2));
    }
    ctx.drawImage(sheet, frame * BAT_FS, 0, BAT_FS, BAT_FS,
                  -BAT_DS/2, -BAT_DS/2, BAT_DS, BAT_DS);
    ctx.filter = 'none';
    ctx.shadowBlur = 0;
  } else {
    // Canvas fallback (original fly art)
    const flutter = Math.sin(frameCount * 0.3) * 3;
    const glow = e.phase === 'telegraph' ? Math.abs(Math.sin(frameCount * 0.2)) : 0;
    if (glow > 0) { ctx.shadowColor='#ff4444'; ctx.shadowBlur=15*glow; }
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = 'rgba(150,180,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-14,-2+flutter,14,7,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14,-2+flutter,14,7,0.3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#5a5a9a';
    ctx.beginPath(); ctx.ellipse(0,4,8,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(-5,-4,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-4,4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawTank(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const frame = Math.floor(e.animFrame % GOLEM_IDLE_FRAMES);

  if (golemSprites.sheet && golemSprites.sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    ctx.drawImage(golemSprites.sheet,
                  frame * GOLEM_FS, GOLEM_IDLE_ROW * GOLEM_FS, GOLEM_FS, GOLEM_FS,
                  -GOLEM_DS/2, -GOLEM_DS/2, GOLEM_DS, GOLEM_DS);
    ctx.filter = 'none';
  } else {
    // Canvas fallback (original tank art)
    const pulse = 1 + Math.sin(e.pulseTimer/60*Math.PI*2) * 0.04;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#6a1a1a';
    ctx.beginPath(); ctx.ellipse(0,4,24,19,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#8a2a2a';
    ctx.beginPath(); ctx.ellipse(0,3,20,16,0,0,Math.PI*2); ctx.fill();
    for (let i=0; i<3; i++) {
      ctx.fillStyle = i<e.hp ? '#ff6060' : '#3a1010';
      ctx.beginPath(); ctx.arc(-8+i*8,6,4,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#7a2020'; ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-16,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-16,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

const CYCLOPS_EYE_OFFSET = 20; // px above sprite center where the eye sits

function drawCyclops(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const facing = player.x > e.x ? 1 : -1;
  ctx.scale(facing, 1);

  const isLaserCharge = e.phase === 'laser_charge';
  const isLaserFire   = e.phase === 'laser_fire';
  const sheet = cyclopsSprites.sheet;
  let row = 1, frames = CYCLOPS_FRAMES.walk;
  if (e.hitFlash > 0)                        { row = 4; frames = CYCLOPS_FRAMES.hurt; }
  else if (isLaserCharge || isLaserFire)     { row = 8; frames = 6; }

  const frame = Math.floor(e.animFrame % frames);
  if (sheet && sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    if (isLaserCharge) {
      const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.35);
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 20 + 14 * pulse;
    }
    if (isLaserFire) { ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 28; }
    ctx.drawImage(sheet, frame * CYCLOPS_FS, row * CYCLOPS_FS, CYCLOPS_FS, CYCLOPS_FS,
                  -CYCLOPS_DS/2, -CYCLOPS_DS/2, CYCLOPS_DS, CYCLOPS_DS);
    ctx.filter = 'none'; ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#cc8833';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6, -4, 7, 0, Math.PI*2); ctx.fill();
    if (isLaserCharge || isLaserFire) ctx.fillStyle = '#ff4400';
    else ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.arc(6, -4, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Draw laser beam AFTER sprite so it renders on top
  if (e.phase === 'laser_fire') {
    ctx.save();
    const beamLen = 680;
    const ox = e.x, oy = e.y - CYCLOPS_EYE_OFFSET;
    const ex = ox + Math.cos(e.laserAngle) * beamLen;
    const ey = oy + Math.sin(e.laserAngle) * beamLen;
    const progress = Math.min(1, e.laserFireTimer / 30);
    // Outer glow
    ctx.globalAlpha = 0.35 * progress;
    ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 26;
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 24;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    // Core beam
    ctx.globalAlpha = 0.9 * progress;
    ctx.strokeStyle = '#ffeecc'; ctx.lineWidth = 6; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    // Inner white core
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawBrute(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const facing = player.x > e.x ? 1 : -1;
  ctx.scale(facing, 1);
  const isAttacking = e.attacking;
  let sheet = null, fCount = 1, fw = BRUTE_FW, fh = BRUTE_FH;
  if (e.hitFlash > 0 && bruteSprites.hurt)          { sheet = bruteSprites.hurt;   fCount = BRUTE_FRAMES.hurt; }
  else if (isAttacking && bruteSprites.attack)       { sheet = bruteSprites.attack; fCount = BRUTE_FRAMES.attack; }
  else if (bruteSprites.walk)                         { sheet = bruteSprites.walk;   fCount = BRUTE_FRAMES.walk; }
  else if (bruteSprites.idle)                         { sheet = bruteSprites.idle;   fCount = BRUTE_FRAMES.idle; }
  const frame = Math.floor(e.animFrame % fCount);
  if (sheet && sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    if (isAttacking) { ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 12; }
    ctx.drawImage(sheet, frame * fw, 0, fw, fh, -BRUTE_DSW/2, -BRUTE_DSH/2, BRUTE_DSW, BRUTE_DSH);
    ctx.filter = 'none'; ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#4466aa';
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSentinel(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  // Flip to face player
  const facingDir = player.x > e.x ? 1 : -1;
  ctx.scale(facingDir, 1);
  const isAttacking = e.attacking;
  let sheet = null, fCount = 1;
  if (e.hitFlash > 0 && sentinelSprites.hurt)       { sheet = sentinelSprites.hurt;   fCount = SENTINEL_FRAMES.hurt; }
  else if (isAttacking && sentinelSprites.attack)    { sheet = sentinelSprites.attack; fCount = SENTINEL_FRAMES.attack; }
  else if (sentinelSprites.walk)                      { sheet = sentinelSprites.walk;   fCount = SENTINEL_FRAMES.walk; }
  const frame = Math.floor(e.animFrame % fCount);
  if (sheet && sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    if (isAttacking) { ctx.shadowColor = '#cc8844'; ctx.shadowBlur = 8; }
    ctx.drawImage(sheet, frame * SENTINEL_FS, 0, SENTINEL_FS, SENTINEL_FS,
                  -SENTINEL_DS/2, -SENTINEL_DS/2, SENTINEL_DS, SENTINEL_DS);
    ctx.filter = 'none'; ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#886633';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemyProjectiles() {
  if (enemyProjectiles.length === 0) return;
  ctx.save();
  ctx.shadowBlur = 8;
  for (const p of enemyProjectiles) {
    const alpha = Math.min(1, p.life / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color || '#aaddff';
    ctx.shadowColor = p.color || '#aaddff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius || 10, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemy(e) {
  if (e.type === 'grub')          drawGrub(e);
  else if (e.type === 'fly')      drawFly(e);
  else if (e.type === 'tank')     drawTank(e);
  else if (e.type === 'cyclops')  drawCyclops(e);
  else if (e.type === 'brute')    drawBrute(e);
  else if (e.type === 'sentinel') drawSentinel(e);
}

function drawTears() {
  tears.forEach(t => {
    // Stay fully visible until last 25% of life, then fade
    const lifeFrac = t.life / t.lifespan;
    const alpha = lifeFrac > 0.25 ? 1 : Math.max(0, lifeFrac / 0.25);
    const r = t.radius * (0.7 + 0.3 * alpha); // shrinks only slightly
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = player.skills.freeze ? '#88ccff' :
                    player.skills.explosive ? '#ff8844' : '#88aaff';
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawHealthPacks() {
  healthPacks.forEach(h => {
    const alpha = Math.min(1, h.life / 60);
    const bob = Math.sin(frameCount * 0.08 + h.x) * 2;
    const pulse = 1 + Math.sin(frameCount * 0.12 + h.x) * 0.08;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(h.x, h.y + bob);
    ctx.scale(pulse, pulse);
    // Heart shape — same path as HUD hearts, scaled to 18px
    const s = 18 / 20;
    ctx.scale(s, s);
    ctx.fillStyle = '#FF6B9D';
    ctx.beginPath();
    ctx.arc(-5, -3, 5, Math.PI, 0);
    ctx.arc(5, -3, 5, Math.PI, 0);
    ctx.lineTo(0, 8);
    ctx.closePath();
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(-3, -5, 2.5, 1.5, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawParticles() {
  if (particles.length > 0) {
    ctx.save();
    let lastColor = null;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = p.life / p.maxLife;
      if (p.color !== lastColor) { ctx.fillStyle = p.color; lastColor = p.color; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * ctx.globalAlpha, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawMinimap() {
  const cellW = 22, cellH = 14, gap = 3;
  const totalW = ROOM_GRAPH.length*(cellW+gap)-gap;
  const startX = W - 10 - totalW;
  const startY = HUD_H/2 - cellH/2;

  ROOM_GRAPH.forEach((room, i) => {
    const rx = startX + i*(cellW+gap), ry = startY;
    // Cell background
    if (!room.visited)             ctx.fillStyle = '#1a1a2a';
    else if (room.type==='garden') ctx.fillStyle = '#5a9e6f';
    else if (room.cleared)         ctx.fillStyle = '#7a5a8a';
    else                           ctx.fillStyle = '#c87a3a';
    roundRect(ctx, rx, ry, cellW, cellH, 3);
    ctx.fill();

    // Current room: bright pink outline
    if (i === currentRoomIdx) {
      ctx.strokeStyle = '#FFB3C6';
      ctx.lineWidth = 2;
      roundRect(ctx, rx, ry, cellW, cellH, 3);
      ctx.stroke();
    }

    // Garden: small pink dot marker
    if (room.type === 'garden') {
      ctx.fillStyle = '#FFB3C6';
      ctx.beginPath(); ctx.arc(rx + cellW/2, ry + cellH/2, 3, 0, Math.PI*2); ctx.fill();
    }

    // Boss: red dot when uncleared
    if (room.type === 'boss' && room.visited && !room.cleared) {
      ctx.fillStyle = '#ff4444';
      ctx.beginPath(); ctx.arc(rx + cellW/2, ry + cellH/2, 3, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.textAlign = 'left';
}

function drawSkillBar() {
  const active = activeSkills();
  const MAX_SLOTS = 4;
  const slotSize = 32, gap = 5, pad = 7;
  const totalW = MAX_SLOTS * (slotSize + gap) - gap + pad * 2;
  const totalH = slotSize + pad * 2 + 14;
  const bx = 10, by = H - totalH - 8;
  ctx.save();
  // Panel background
  ctx.fillStyle = 'rgba(28,8,22,0.88)';
  roundRect(ctx, bx, by, totalW, totalH, 8); ctx.fill();
  ctx.strokeStyle = '#FF69B4'; ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, totalW, totalH, 8); ctx.stroke();
  // Inner petal decorations on corners
  ctx.fillStyle = '#cc3366'; ctx.font = '9px serif';
  ctx.fillText('✿', bx + 3, by + 10);
  ctx.fillText('✿', bx + totalW - 12, by + 10);
  // Label
  ctx.textAlign = 'center'; ctx.fillStyle = '#cc6699'; ctx.font = px(4);
  ctx.fillText('SKILLS', bx + totalW/2, by + 11);
  // Slots
  for (let i = 0; i < MAX_SLOTS; i++) {
    const sx = bx + pad + i * (slotSize + gap);
    const sy = by + pad + 10;
    const skill = active[i];
    // Slot background
    if (skill) {
      ctx.fillStyle = 'rgba(200,60,130,0.22)';
      ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 8;
    } else {
      ctx.fillStyle = 'rgba(50,20,40,0.5)';
      ctx.shadowBlur = 0;
    }
    roundRect(ctx, sx, sy, slotSize, slotSize, 5); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = skill ? '#FF69B4' : '#3a1a30'; ctx.lineWidth = 1.2;
    roundRect(ctx, sx, sy, slotSize, slotSize, 5); ctx.stroke();
    if (skill) {
      ctx.font = `${slotSize - 10}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(SKILL_META[skill].icon, sx + slotSize/2, sy + slotSize - 6);
      // Dash cooldown: pie-sweep overlay
      if (skill === 'dash' && player.dashCooldown > 0) {
        const progress = player.dashCooldown / 180;
        const cx2 = sx + slotSize/2, cy2 = sy + slotSize/2, r2 = slotSize/2 - 1;
        ctx.fillStyle = 'rgba(0,0,0,0.58)';
        ctx.beginPath();
        ctx.moveTo(cx2, cy2);
        ctx.arc(cx2, cy2, r2, -Math.PI/2, -Math.PI/2 + Math.PI*2*progress);
        ctx.closePath();
        ctx.fill();
        // Remaining seconds label
        const secs = Math.ceil(player.dashCooldown / 60);
        ctx.fillStyle = '#fff'; ctx.font = px(5);
        ctx.fillText(secs, cx2, cy2 + 3);
      }
    } else {
      ctx.fillStyle = '#3a1a30'; ctx.font = px(6);
      ctx.fillText('+', sx + slotSize/2, sy + slotSize/2 + 3);
    }
  }
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  // HUD background — soft dark with pastel gradient hint
  const hudGrad = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hudGrad.addColorStop(0, '#2a1a2e');
  hudGrad.addColorStop(1, '#1e1228');
  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, 0, W, HUD_H);
  // Bottom border line
  ctx.strokeStyle = '#FFB3C6';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();

  // Hearts — bigger, cuter
  const hs = 22; // heart display size
  for (let i = 0; i < player.maxHP; i++) {
    const hx = 10 + i * (hs + 3);
    const hy = HUD_H / 2;
    ctx.fillStyle = i < player.hp ? '#FF6B9D' : '#3a2a3a';
    ctx.save();
    ctx.translate(hx + hs/2, hy);
    ctx.scale(hs/20, hs/20);
    ctx.beginPath();
    ctx.arc(-5, -3, 5, Math.PI, 0);
    ctx.arc(5, -3, 5, Math.PI, 0);
    ctx.lineTo(0, 8);
    ctx.closePath();
    ctx.fill();
    // Shine on filled hearts
    if (i < player.hp) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(-3, -5, 2.5, 1.5, -0.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Room name — centered, readable
  ctx.fillStyle = '#FFD6E0';
  ctx.font = px(11);
  ctx.textAlign = 'center';
  ctx.fillText(currentRoom ? currentRoom.name.toUpperCase() : '', W/2, HUD_H/2 + 4);

  drawMinimap();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, cx, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  words.forEach((w, i) => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && i > 0) {
      ctx.fillText(line.trim(), cx, y); y += lineH; line = w + ' ';
    } else { line = test; }
  });
  ctx.fillText(line.trim(), cx, y);
}

function drawBloom() {
  if (!boss) return;
  ctx.save();

  // Jump telegraph shadow
  if (boss.telegraphing) {
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(frameCount * 0.15));
    ctx.globalAlpha = 0.5 * pulse;
    ctx.fillStyle = '#220022';
    ctx.beginPath(); ctx.ellipse(boss.shadowX, boss.shadowY, 40, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Charge-burst telegraph: expanding pink ring + glow on Bloom
  if (boss.charging) {
    const progress = 1 - (boss.chargeTimer / boss.chargeWindup);
    const ringR = 30 + progress * 60;
    const alpha = 0.15 + 0.55 * progress;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#FF69B4';
    ctx.lineWidth = 3 + progress * 4;
    ctx.shadowColor = '#FF69B4';
    ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(boss.x, boss.y, ringR, 0, Math.PI * 2); ctx.stroke();
    // Pulse ring expanding outward
    const ringR2 = ringR * 0.55;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(boss.x, boss.y, ringR2, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  ctx.translate(boss.x, boss.y);

  // Pick animation sheet
  let sheet = null, frames = 1;
  if (boss.hitFlash > 0 && bloomSprites.hurt)        { sheet = bloomSprites.hurt;   frames = BLOOM_FRAMES.hurt; }
  else if (boss.jumpInFlight && bloomSprites.jump)    { sheet = bloomSprites.jump;   frames = BLOOM_FRAMES.jump; }
  else if (boss.phase >= 2 && bloomSprites.attack)    { sheet = bloomSprites.attack; frames = BLOOM_FRAMES.attack; }
  else if (bloomSprites.crawl)                         { sheet = bloomSprites.crawl;  frames = BLOOM_FRAMES.crawl; }

  const frame = Math.floor(boss.animFrame % frames);
  const half = 64; // display at 128×128 (2× of 64px frames)

  if (sheet && sheet.naturalWidth > 0) {
    if (boss.hitFlash > 0) { ctx.filter = 'brightness(10)'; }
    ctx.drawImage(sheet, frame * BLOOM_FS, 0, BLOOM_FS, BLOOM_FS, -half, -half, half*2, half*2);
    ctx.filter = 'none';
  } else {
    // Canvas fallback blob
    const wobble = Math.sin(frameCount * 0.1) * 4;
    ctx.fillStyle = boss.hitFlash > 0 ? '#fff' : (boss.phase===3 ? '#cc1100' : boss.phase===2 ? '#882299' : '#aa44ee');
    ctx.beginPath(); ctx.ellipse(0, wobble/2, 38+wobble, 35-wobble/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(-10,-12,12,8,-0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-13,-5,9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(13,-5,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = boss.phase>=2 ? '#ff0000':'#222';
    ctx.beginPath(); ctx.arc(-11,-5,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-5,5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Name tag above sprite
  ctx.save();
  ctx.textAlign = 'center';
  const tagY = boss.y - 82;
  ctx.fillStyle = 'rgba(26,6,16,0.85)';
  roundRect(ctx, boss.x - 36, tagY - 14, 72, 18, 4); ctx.fill();
  ctx.strokeStyle = '#FF9BB5';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#FFD6E5';
  ctx.font = px(6);
  ctx.fillText('BLOOM', boss.x, tagY);
  ctx.restore();

  // Projectiles — batched per color to avoid per-item save/restore
  if (boss.projectiles.length > 0) {
    ctx.save();
    ctx.shadowBlur = 10;
    let lastProjColor = null;
    for (let i = 0; i < boss.projectiles.length; i++) {
      const p = boss.projectiles[i];
      const c = p.color || '#aa44ee';
      if (c !== lastProjColor) {
        ctx.fillStyle = c; ctx.shadowColor = c; lastProjColor = c;
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius || 10, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawOwlet() {
  if (!boss) return;
  ctx.save();

  // Soft blue magical aura
  const auraAlpha = 0.18 + 0.10 * Math.abs(Math.sin(frameCount * 0.05));
  ctx.globalAlpha = auraAlpha;
  ctx.fillStyle = '#4488ff';
  ctx.shadowColor = '#88bbff'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(boss.x, boss.y, 44, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  ctx.translate(boss.x, boss.y);
  // Owlet sprite faces LEFT by default, so negate facing to flip toward player
  ctx.scale(-boss.facing, 1);

  let sheet = null, frames = 1;
  if      (boss.hitFlash  > 0 && owletSprites.hurt)   { sheet = owletSprites.hurt;    frames = OWLET_FRAMES.hurt;    }
  else if (boss.throwAnim > 0 && owletSprites.throw_)  { sheet = owletSprites.throw_;  frames = OWLET_FRAMES.throw_;  }
  else if (boss.attackAnim > 0 && owletSprites.attack1){ sheet = owletSprites.attack1; frames = OWLET_FRAMES.attack1; }
  else if (boss.phase >= 2 && owletSprites.run)        { sheet = owletSprites.run;     frames = OWLET_FRAMES.run;     }
  else if (owletSprites.idle)                          { sheet = owletSprites.idle;    frames = OWLET_FRAMES.idle;    }

  const frame = Math.floor(boss.animFrame % frames);
  if (sheet && sheet.naturalWidth > 0) {
    if (boss.hitFlash > 0) ctx.filter = 'brightness(10)';
    // Shift sprite up 6px to compensate for 6 empty rows at top of 32px frame
    ctx.drawImage(sheet, frame * OWLET_FS, 0, OWLET_FS, OWLET_FS, -OWLET_DS/2, -OWLET_DS/2 - 6, OWLET_DS, OWLET_DS);
    ctx.filter = 'none';
  } else {
    ctx.fillStyle = boss.hitFlash > 0 ? '#fff' : '#88bbff';
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Nametag
  ctx.save();
  ctx.textAlign = 'center';
  const tagY = boss.y - 52;
  ctx.fillStyle = 'rgba(0,10,26,0.88)';
  roundRect(ctx, boss.x - 36, tagY - 14, 72, 18, 4); ctx.fill();
  ctx.strokeStyle = '#88bbff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ccddff'; ctx.font = px(6);
  ctx.fillText('OWLET', boss.x, tagY);
  ctx.restore();

  // Projectiles with glow + alpha fade for homing orbs
  if (boss.projectiles.length > 0) {
    ctx.save();
    for (const p of boss.projectiles) {
      const alpha = p.maxLife ? Math.min(1, p.life / 60) : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle   = p.color || '#88bbff';
      ctx.shadowColor = p.color || '#88bbff';
      ctx.shadowBlur  = p.homing ? 18 : 9;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius || 9, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawPinky() {
  if (!boss) return;
  ctx.save();

  // Jump shadow
  if (boss.telegraphing) {
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(frameCount * 0.15));
    ctx.globalAlpha = 0.5 * pulse;
    ctx.fillStyle = '#220011';
    ctx.beginPath(); ctx.ellipse(boss.shadowX, boss.shadowY, 32, 16, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Dash telegraph glow
  if (boss.dashTelegraph > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.45);
    ctx.globalAlpha = 0.6 * pulse;
    ctx.fillStyle = '#FF69B4'; ctx.shadowColor = '#FF69B4'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(boss.x, boss.y, 38, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // Blink flash
  if (boss.blinkFlash > 0) {
    ctx.globalAlpha = Math.min(1, boss.blinkFlash / 6);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(boss.x, boss.y, 44, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.translate(boss.x, boss.y);
  ctx.scale(boss.facing, 1);

  let sheet = null, frames = 1;
  if (boss.hitFlash > 0 && pinkSprites.hurt)        { sheet = pinkSprites.hurt;    frames = PINK_FRAMES.hurt; }
  else if (boss.jumpInFlight && pinkSprites.jump)    { sheet = pinkSprites.jump;    frames = PINK_FRAMES.jump; }
  else if (boss.attackAnim > 0 && pinkSprites.attack1) { sheet = pinkSprites.attack1; frames = PINK_FRAMES.attack1; }
  else if (boss.phase >= 3 && pinkSprites.run)       { sheet = pinkSprites.run;     frames = PINK_FRAMES.run; }
  else if (boss.phase >= 2 && pinkSprites.attack2)   { sheet = pinkSprites.attack2; frames = PINK_FRAMES.attack2; }
  else if (pinkSprites.walk)                          { sheet = pinkSprites.walk;    frames = PINK_FRAMES.walk; }

  const frame = Math.floor(boss.animFrame % frames);
  if (sheet && sheet.naturalWidth > 0) {
    if (boss.hitFlash > 0) ctx.filter = 'brightness(10)';
    ctx.drawImage(sheet, frame * PINK_FS, 0, PINK_FS, PINK_FS, -PINK_DS/2, -PINK_DS/2, PINK_DS, PINK_DS);
    ctx.filter = 'none';
  } else {
    ctx.fillStyle = boss.hitFlash > 0 ? '#fff' : '#FF69B4';
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Nametag
  ctx.save();
  ctx.textAlign = 'center';
  const tagY = boss.y - 50;
  ctx.fillStyle = 'rgba(26,6,16,0.85)';
  roundRect(ctx, boss.x - 30, tagY - 14, 60, 18, 4); ctx.fill();
  ctx.strokeStyle = '#FF69B4'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#FFD6E5'; ctx.font = px(6);
  ctx.fillText('PINKY', boss.x, tagY);
  ctx.restore();

  // Projectiles
  if (boss.projectiles.length > 0) {
    ctx.save();
    ctx.shadowBlur = 10;
    let lastC = null;
    for (const p of boss.projectiles) {
      const c = p.color || '#FF69B4';
      if (c !== lastC) { ctx.fillStyle = c; ctx.shadowColor = c; lastC = c; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius || 10, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBossHPBar() {
  if (!boss) return;
  const isPinky  = boss.bossType === 'pinky';
  const isOwlet  = boss.bossType === 'owlet';
  ctx.save();
  const barW = 400, barH = 14;
  const bx = W/2 - barW/2, by = H - 30;
  ctx.fillStyle = '#1a0a0a'; ctx.fillRect(bx-2, by-2, barW+4, barH+4);
  // Track background
  ctx.fillStyle = isPinky ? '#440020' : isOwlet ? '#001540' : '#660000';
  ctx.fillRect(bx, by, barW, barH);
  const hpW = Math.max(0, (boss.hp / boss.maxHP)) * barW;
  const hpColor = isPinky
    ? (boss.phase === 3 ? '#ff1177' : boss.phase === 2 ? '#cc3388' : '#882255')
    : isOwlet
      ? (boss.phase >= 2 ? '#55aaff' : '#2266cc')
      : (boss.phase === 3 ? '#ff2200' : boss.phase === 2 ? '#cc3333' : '#883333');
  ctx.fillStyle = hpColor; ctx.fillRect(bx, by, hpW, barH);
  // Phase pips
  if (isOwlet) {
    // Single pip at 50%
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(bx + barW/2 - 1, by, 2, barH);
  } else {
    const p2x = bx + (2/3) * barW, p3x = bx + (1/3) * barW;
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(p2x-1, by, 2, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(p3x-1, by, 2, barH);
  }
  const bossName  = isPinky ? 'PINKY' : isOwlet ? 'OWLET' : 'BLOOM';
  const phaseStars = isOwlet
    ? (boss.phase >= 2 ? bossName+' ★★' : bossName+' ★')
    : (boss.phase === 3 ? bossName+' ★★★' : boss.phase === 2 ? bossName+' ★★' : bossName+' ★');
  ctx.fillStyle = isOwlet
    ? (boss.phase >= 2 ? '#88ccff' : '#5599ee')
    : (boss.phase === 3 ? '#ff8888' : (isPinky ? '#ff88cc' : '#e8c547'));
  ctx.font = px(9); ctx.textAlign = 'center';
  ctx.fillText(phaseStars, W/2, by - 6);
  ctx.restore();
}

function drawSpeechBubble(cx, topY, text, borderColor) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = px(6);
  // Word-wrap to 260px
  const maxW = 260, words = text.split(' '), lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW - 16) { lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  const lh = 14, pad = 8, bw = maxW, bh = lines.length * lh + pad * 2;
  const bx = cx - bw/2, by = topY - bh;
  ctx.fillStyle = 'rgba(10,5,20,0.92)';
  roundRect(ctx, bx, by, bw, bh, 6); ctx.fill();
  ctx.strokeStyle = borderColor; ctx.lineWidth = 2; ctx.stroke();
  // Tail
  ctx.beginPath();
  ctx.moveTo(cx - 8, by + bh); ctx.lineTo(cx, by + bh + 10); ctx.lineTo(cx + 8, by + bh);
  ctx.fillStyle = 'rgba(10,5,20,0.92)'; ctx.fill();
  ctx.strokeStyle = borderColor; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = px(6);
  lines.forEach((line, i) => ctx.fillText(line, cx, by + pad + (i + 1) * lh - 2));
  ctx.restore();
}

function drawBossDialogue() {
  if (!bossDialogue.active) return;
  // Draw defeated Bloom sprite at death position
  const bx = bossDialogue.deathX, by = bossDialogue.deathY;
  const bounce = Math.sin(frameCount * 0.08) * 3;
  ctx.save();
  ctx.translate(bx, by + bounce);
  const sheet = bloomSprites.hurt || bloomSprites.crawl;
  if (sheet && sheet.naturalWidth > 0) {
    const fr = Math.floor(frameCount / 10) % (bloomSprites.hurt ? BLOOM_FRAMES.hurt : BLOOM_FRAMES.crawl);
    ctx.drawImage(sheet, fr * BLOOM_FS, 0, BLOOM_FS, BLOOM_FS, -48, -48, 96, 96);
  }
  ctx.restore();
}

// Draws a 5-petal sakura flower (code-drawn decoration)
function drawSakuraFlower(cx, cy, r, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const rot = frameCount * 0.004 + cx * 0.031 + cy * 0.017;
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot + (i / 5) * Math.PI * 2);
    ctx.fillStyle = i % 2 === 0 ? '#FFB7C5' : '#FF8FAB';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.56, r * 0.29, r * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFE4EC';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawInteractPrompt() {
  if (chatWindow.active) return;
  if (!nearInteractable()) return;
  const boxW = 248, boxH = 42, bx = W/2 - boxW/2, by = H - boxH - 12;
  ctx.save();
  // Sakura-tinted dark background
  ctx.fillStyle = 'rgba(28,6,18,0.94)';
  roundRect(ctx, bx, by, boxW, boxH, 10); ctx.fill();
  ctx.strokeStyle = '#FF9BB5'; ctx.lineWidth = 2; ctx.stroke();
  // Small petal decorations at edges
  drawSakuraFlower(bx + 18, by + boxH/2, 7, 0.55);
  drawSakuraFlower(bx + boxW - 18, by + boxH/2, 7, 0.55);
  if (Math.floor(frameCount/20)%2===0) {
    ctx.fillStyle = '#FFD6E5'; ctx.font = px(9); ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('[E] Interact', W/2, by + boxH/2);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
}

function drawChatWindow() {
  if (!chatWindow.active) return;
  const pad = 16, boxH = 158, boxW = W - pad * 2;
  const bx = pad, by = H - boxH - pad;
  const innerX = bx + 22, innerW = boxW - 44;

  ctx.save();

  // Box: deep rose background with sakura border
  ctx.fillStyle = 'rgba(26,6,16,0.97)';
  roundRect(ctx, bx, by, boxW, boxH, 12); ctx.fill();
  ctx.strokeStyle = '#FF9BB5'; ctx.lineWidth = 2.5; ctx.stroke();

  // Corner sakura flowers
  drawSakuraFlower(bx + 18,        by + 18,        9, 0.45);
  drawSakuraFlower(bx + boxW - 18, by + 18,        9, 0.45);
  drawSakuraFlower(bx + 18,        by + boxH - 18, 9, 0.45);
  drawSakuraFlower(bx + boxW - 18, by + boxH - 18, 9, 0.45);

  // Speaker name tag
  if (chatWindow.speaker) {
    ctx.font = px(9);
    const isBloom = chatWindow.speaker === 'BLOOM';
    const label = isBloom ? '✿ BLOOM' : chatWindow.speaker;
    const nameW = ctx.measureText(label).width + 28;

    // Tag fill
    if (isBloom) {
      const grd = ctx.createLinearGradient(bx + 12, 0, bx + 12 + nameW, 0);
      grd.addColorStop(0, '#7a0044');
      grd.addColorStop(1, '#cc2277');
      ctx.fillStyle = grd;
    } else {
      ctx.fillStyle = chatWindow.speaker === 'YOU' ? '#2a3366' : '#4a2255';
    }
    roundRect(ctx, bx + 12, by - 28, nameW, 34, 7); ctx.fill();
    ctx.strokeStyle = '#FF9BB5'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#FFE8EE'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + 26, by - 11);
    ctx.textBaseline = 'alphabetic';
  }

  // Body text — slightly pinkish white
  ctx.font = px(9); ctx.fillStyle = '#FFE8EE'; ctx.textAlign = 'left';
  const lineH = 26;
  const words = chatWindow.text.split(' ');
  const lines = []; let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > innerW) { lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  lines.forEach((line, i) => ctx.fillText(line, innerX, by + 36 + i * lineH));

  // Choices
  if (chatWindow.choices) {
    const choiceY = by + boxH - 46;
    chatWindow.choices.forEach((c, i) => {
      const sel = i === chatWindow.choiceIdx;
      ctx.fillStyle = sel ? '#FF69B4' : '#886688';
      ctx.font = px(9); ctx.textAlign = 'left';
      ctx.fillText((sel ? '♥ ' : '   ') + c, innerX + i * 220, choiceY);
    });
    ctx.fillStyle = '#AA7799'; ctx.font = px(7); ctx.textAlign = 'right';
    ctx.fillText('[◄ ►] select   [E] confirm', bx + boxW - 18, by + boxH - 12);
  } else {
    if (Math.floor(frameCount / 20) % 2 === 0) {
      ctx.fillStyle = '#FF9BB5'; ctx.font = px(10); ctx.textAlign = 'right';
      ctx.fillText('▼', bx + boxW - 18, by + boxH - 12);
    }
    ctx.fillStyle = '#AA7799'; ctx.font = px(7); ctx.textAlign = 'right';
    ctx.fillText('[E] next', bx + boxW - 18, by + boxH - 12);
  }
  ctx.restore();
}

function drawPet() {
  if (!pet.active) return;
  const bounce = Math.sin(pet.bounceTimer * 0.08) * 3;
  ctx.save();
  // Scale up + glow during attack
  const atkScale = pet.attacking ? 1.25 : 1;
  ctx.translate(pet.x, pet.y + bounce);
  ctx.scale(atkScale, atkScale);
  if (pet.attacking) {
    ctx.shadowColor = '#aa44ee';
    ctx.shadowBlur = 14 * (1 - pet.attackAnim / 24);
  }

  const sheet = bloomSprites.happy;
  const frame = Math.floor(pet.bounceTimer / 10) % BLOOM_FRAMES.happy;
  const petSize = 48;

  if (sheet && sheet.naturalWidth > 0) {
    ctx.drawImage(sheet, frame * BLOOM_FS, 0, BLOOM_FS, BLOOM_FS,
                  -petSize/2, -petSize/2, petSize, petSize);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#cc66ff';
    ctx.beginPath(); ctx.ellipse(0,0,16,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(-5,-5,5,3,-0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-6,-2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-2,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#220033';
    ctx.beginPath(); ctx.arc(-5,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-2,2.5,0,Math.PI*2); ctx.fill();
  }

  if (pet.befriended) {
    // Nametag above pet
    ctx.textAlign = 'center';
    ctx.font = px(6);
    const label = '✿ Bloom';
    const lw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(30,10,20,0.72)';
    roundRect(ctx, -lw/2-6, -46, lw+12, 16, 4); ctx.fill();
    ctx.strokeStyle = '#ffb7c5'; ctx.lineWidth = 1;
    roundRect(ctx, -lw/2-6, -46, lw+12, 16, 4); ctx.stroke();
    ctx.fillStyle = '#ffb7c5'; ctx.fillText(label, 0, -33);
  } else if (Math.hypot(player.x - pet.x, player.y - pet.y) < 48) {
    ctx.fillStyle = '#fff'; ctx.font = '9px "Press Start 2P",monospace';
    ctx.textAlign = 'center'; ctx.fillText('[E] befriend', 0, -32);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawGardenProps(room) {
  if (!room || room.type !== 'garden') return;
  ctx.save();
  ctx.textAlign = 'center';

  // ── Tileset helpers (TX Plant.png only) ─────────────────────────────
  // Bush sprite at (212,182,54,48) — anchor is bottom-centre
  function tsBush(x, y, scale) {
    if (!tileset.plant || !tileset.plant.naturalWidth) return;
    const bw = Math.round(54 * scale), bh = Math.round(48 * scale);
    ctx.drawImage(tileset.plant, 212, 182, 54, 48, x - bw/2, y - bh, bw, bh);
  }
  // Grass tuft rows 400/432, 4 variants at x=0,32,64,96 — anchor is centre
  function tsTuft(x, y, variant, scale) {
    if (!tileset.plant || !tileset.plant.naturalWidth) return;
    const col = (variant % 4) * 32, row = variant < 4 ? 400 : 432;
    const w = Math.round(24 * scale), h = Math.round(20 * scale);
    ctx.drawImage(tileset.plant, col, row, 24, 20, x - w/2, y - h/2, w, h);
  }

  // ── Wall-edge bushes ─────────────────────────────────────────────────
  // Safe zone: x [87,813] (bw/2=27), y [160,500] (bh=48 → top at y-48 ≥ 112)
  // Top edge
  tsBush(100, 165, 1.0);  tsBush(800, 165, 1.0);
  tsBush(230, 162, 0.9);  tsBush(670, 162, 0.9);
  tsBush(360, 160, 0.85); tsBush(540, 160, 0.85);
  // Left + right edges
  tsBush( 92, 248, 0.9);  tsBush(808, 248, 0.9);
  tsBush( 92, 368, 0.9);  tsBush(808, 368, 0.9);
  // Bottom edge  (y=488 → sprite top at 440, well above bottom wall at 500)
  tsBush(100, 488, 1.0);  tsBush(800, 488, 1.0);
  tsBush(260, 486, 0.9);  tsBush(640, 486, 0.9);
  tsBush(450, 487, 0.85);

  // ── Scattered tufts (interior, avoiding boards and throne) ───────────
  // Boards: photo (x 126-234, y 256-404), video (x 666-774, y 256-404)
  // Throne: approx x 395-505, y 145-265
  [
    [142,190,0,0.9], [172,218,1,0.8], [108,460,2,0.85], [155,438,3,0.9],
    [275,178,0,0.8], [302,442,1,0.9], [244,452,2,0.8],  [132,472,0,0.75],
    [756,192,1,0.9], [726,220,2,0.8], [790,458,0,0.85], [742,438,3,0.9],
    [618,180,1,0.8], [586,444,2,0.9], [658,452,0,0.8],  [768,472,3,0.75],
    [418,418,0,0.8], [482,412,2,0.85],[388,456,1,0.9],  [512,458,3,0.8],
  ].forEach(([x, y, v, s]) => tsTuft(x, y, v, s));

  // ── Stepping-stone path (west door → boards area) ───────────────────
  ctx.fillStyle = '#8a8070';
  [[28,290],[70,305],[110,315],[152,322]].forEach(([sx,sy]) => {
    ctx.beginPath(); ctx.ellipse(sx, sy, 14, 9, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#6e6455';
    ctx.beginPath(); ctx.ellipse(sx+2, sy+1, 11, 7, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a8070';
  });

  // ── Photo Board ─────────────────────────────────────────────────────
  const pb = room.photoBoard;
  const bw = 108, bh = 148, bx = pb.x - bw/2, by = pb.y - bh/2;

  // Wood frame
  ctx.fillStyle = '#2e1506'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#7a4318'; ctx.fillRect(bx+4, by+4, bw-8, bh-8);
  ctx.fillStyle = '#4a2a0c'; ctx.fillRect(bx+2, by+2, bw-4, 5); // top bevel
  ctx.fillStyle = '#9a5a28'; ctx.fillRect(bx+2, by+bh-7, bw-4, 5); // bottom bevel
  // Cork surface
  ctx.fillStyle = '#c8963a'; ctx.fillRect(bx+8, by+8, bw-16, bh-16);
  // Cork grain dots
  ctx.fillStyle = 'rgba(140,88,20,0.22)';
  for (let d = 0; d < 24; d++) {
    ctx.fillRect(bx+10 + (d*29)%(bw-20), by+10 + (d*19)%(bh-20), 3, 2);
  }
  // Title banner
  ctx.fillStyle = '#5a2e0a'; ctx.fillRect(bx+8, by+8, bw-16, 22);
  ctx.fillStyle = '#e8c547'; ctx.font = px(7);
  ctx.fillText('PHOTOS', pb.x, by+23);
  // Pinned mini photos (6 tilted rectangles with pins)
  const miniPhotos = [
    { ox:-38, oy:16, w:30, h:22, c:'#7a9acc', r:-0.07 },
    { ox:8,   oy:14, w:28, h:20, c:'#cc7a7a', r: 0.06 },
    { ox:-40, oy:52, w:32, h:24, c:'#7acc9a', r: 0.08 },
    { ox:6,   oy:50, w:30, h:22, c:'#ccaa5a', r:-0.06 },
    { ox:-38, oy:92, w:29, h:21, c:'#aa7acc', r: 0.05 },
    { ox:7,   oy:90, w:31, h:23, c:'#7a9acc', r:-0.08 },
  ];
  miniPhotos.forEach(mp => {
    ctx.save();
    ctx.translate(pb.x + mp.ox + mp.w/2, by + mp.oy + mp.h/2 + 8);
    ctx.rotate(mp.r);
    ctx.fillStyle = '#fff'; ctx.fillRect(-mp.w/2-1, -mp.h/2-1, mp.w+2, mp.h+2);
    ctx.fillStyle = mp.c;  ctx.fillRect(-mp.w/2, -mp.h/2, mp.w, mp.h);
    // Pixel landscape in each "photo"
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-mp.w/2, mp.h/2-5, mp.w, 5);
    // Thumbtack pin
    ctx.fillStyle = '#cc2222'; ctx.beginPath(); ctx.arc(0, -mp.h/2+3, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(-1, -mp.h/2+2, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // ── Video Board ─────────────────────────────────────────────────────
  const vb = room.videoBoard;
  const vbx = vb.x - bw/2, vby = vb.y - bh/2;
  // Wood frame (same as photo board)
  ctx.fillStyle = '#2e1506'; ctx.fillRect(vbx, vby, bw, bh);
  ctx.fillStyle = '#7a4318'; ctx.fillRect(vbx+4, vby+4, bw-8, bh-8);
  ctx.fillStyle = '#4a2a0c'; ctx.fillRect(vbx+2, vby+2, bw-4, 5);
  ctx.fillStyle = '#9a5a28'; ctx.fillRect(vbx+2, vby+bh-7, bw-4, 5);
  // Dark screen backing
  ctx.fillStyle = '#12101e'; ctx.fillRect(vbx+8, vby+8, bw-16, bh-16);
  // Pixel scanlines
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let sl = 0; sl < 8; sl++) ctx.fillRect(vbx+8, vby+8+sl*16, bw-16, 8);
  // Title banner
  ctx.fillStyle = '#1a2a5a'; ctx.fillRect(vbx+8, vby+8, bw-16, 22);
  ctx.fillStyle = '#88aaff'; ctx.font = px(7);
  ctx.fillText('VIDEOS', vb.x, vby+23);
  // Single video thumbnail (fills content area)
  {
    const tx2 = vbx+8, ty2 = vby+34, tw = bw-16, th = 72;
    ctx.fillStyle = '#1a3a5a'; ctx.fillRect(tx2, ty2, tw, th);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(tx2, ty2, tw, th/3);
    // Play button
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(tx2+tw/2, ty2+th/2, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(tx2+tw/2-6, ty2+th/2-9);
    ctx.lineTo(tx2+tw/2+12, ty2+th/2);
    ctx.lineTo(tx2+tw/2-6, ty2+th/2+9);
    ctx.closePath(); ctx.fill();
    // Label
    ctx.fillStyle = '#88aaff'; ctx.font = px(5);
    ctx.fillText(CONFIG.videos[0].caption, vb.x, vby+34+72+14);
  }
  ctx.fillStyle = '#3a4a6a'; ctx.font = px(5);
  ctx.fillText('[ tap E to watch ]', vb.x, vby+bh-8);

  // ── Throne ──────────────────────────────────────────────────────────
  const { x: thx, y: thy } = room.throne;

  // Platform steps
  ctx.fillStyle = '#7a6a50'; ctx.fillRect(thx-58, thy+22, 116, 14);
  ctx.fillStyle = '#9a8a68'; ctx.fillRect(thx-50, thy+10, 100, 14);

  // Seat
  ctx.fillStyle = '#4a2008'; ctx.fillRect(thx-44, thy-6, 88, 30);
  ctx.fillStyle = '#880000'; ctx.fillRect(thx-40, thy-4, 80, 26); // velvet
  ctx.fillStyle = 'rgba(220,60,60,0.35)'; ctx.fillRect(thx-36, thy, 34, 10); // highlight

  // Armrests
  ctx.fillStyle = '#4a2008';
  ctx.fillRect(thx-52, thy-18, 14, 42);
  ctx.fillRect(thx+38, thy-18, 14, 42);
  // Armrest tops (gold cap)
  ctx.fillStyle = '#c8a030';
  ctx.fillRect(thx-54, thy-24, 18, 10);
  ctx.fillRect(thx+36, thy-24, 18, 10);

  // Back pillar
  ctx.fillStyle = '#380e02'; ctx.fillRect(thx-42, thy-80, 84, 78);
  ctx.fillStyle = '#7a3a14'; ctx.fillRect(thx-38, thy-76, 76, 70);
  // Decorative inset panel
  ctx.fillStyle = '#501a06'; ctx.fillRect(thx-30, thy-68, 60, 58);
  ctx.fillStyle = '#6a0000'; ctx.fillRect(thx-24, thy-62, 48, 48); // velvet back
  // Gold trim lines on back
  ctx.fillStyle = '#c8a030';
  ctx.fillRect(thx-38, thy-76, 4, 70); ctx.fillRect(thx+34, thy-76, 4, 70); // side pillars
  ctx.fillRect(thx-30, thy-68, 60, 4); // top trim
  ctx.fillRect(thx-30, thy-10, 60, 4); // bottom trim

  // Crown base band
  ctx.fillStyle = '#c8a030'; ctx.fillRect(thx-42, thy-84, 84, 12);
  // Crown spikes (5 points, tallest in center)
  const spikeHeights = [10, 17, 24, 17, 10];
  const spikeXs = [-28, -15, 0, 15, 28];
  ctx.fillStyle = '#e8c547';
  spikeXs.forEach((ox, i) => {
    ctx.fillRect(thx+ox-5, thy-84-spikeHeights[i], 10, spikeHeights[i]);
    // Small dark notch at spike top for pixel definition
    ctx.fillStyle = '#c8a030';
    ctx.fillRect(thx+ox-2, thy-84-spikeHeights[i], 4, 3);
    ctx.fillStyle = '#e8c547';
  });
  // Center crown gem (pink)
  ctx.fillStyle = '#FF69B4';
  ctx.beginPath(); ctx.arc(thx, thy-84-24-5, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath(); ctx.arc(thx-1, thy-84-24-7, 2, 0, Math.PI*2); ctx.fill();
  // Side gems (blue)
  ctx.fillStyle = '#4499ff';
  [-28, 28].forEach(ox => {
    ctx.beginPath(); ctx.arc(thx+ox, thy-84-10-4, 4, 0, Math.PI*2); ctx.fill();
  });
  // Gold rivets on back panel
  ctx.fillStyle = '#e8c547';
  [[-26,-56],[-26,-26],[26,-56],[26,-26]].forEach(([ox,oy]) => {
    ctx.beginPath(); ctx.arc(thx+ox, thy+oy, 3, 0, Math.PI*2); ctx.fill();
  });

  // ── Interaction prompts ─────────────────────────────────────────────
  if (Math.hypot(player.x-pb.x, player.y-pb.y) < 55) {
    ctx.fillStyle='#FFD6E5'; ctx.font=px(5);
    ctx.fillText('[E] View Photos', pb.x, by-10);
  }
  if (Math.hypot(player.x-vb.x, player.y-vb.y) < 55) {
    ctx.fillStyle='#aabbff'; ctx.font=px(5);
    ctx.fillText('[E] View Videos', vb.x, vby-10);
  }
  if (Math.hypot(player.x-thx, player.y-thy) < 55) {
    ctx.fillStyle='#e8c547'; ctx.font=px(5);
    ctx.fillText('[E] Sit', thx, thy-115);
  }

  ctx.restore();
}

function drawPopup() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  const pw=620, ph=380, px2=W/2-310, py2=H/2-190;

  // Outer frame — sakura pink border
  ctx.fillStyle = '#1a0d12';
  roundRect(ctx, px2, py2, pw, ph, 10); ctx.fill();
  ctx.strokeStyle='#ff8aa8'; ctx.lineWidth=2.5;
  roundRect(ctx, px2, py2, pw, ph, 10); ctx.stroke();
  ctx.strokeStyle='rgba(242,193,78,0.35)'; ctx.lineWidth=1;
  roundRect(ctx, px2+5, py2+5, pw-10, ph-10, 8); ctx.stroke();
  // Corner flowers
  drawSakuraFlower(px2,      py2,      9, 0.7);
  drawSakuraFlower(px2+pw,   py2,      9, 0.7);
  drawSakuraFlower(px2,      py2+ph,   9, 0.7);
  drawSakuraFlower(px2+pw,   py2+ph,   9, 0.7);

  ctx.textAlign = 'center';

  // ── Photos ──────────────────────────────────────────────────────────
  if (popupState.type === 'photos') {
    const cfg = CONFIG.photos[popupState.index];
    const img = boardImages[popupState.index];

    ctx.fillStyle='#ffb7c5'; ctx.font=px(7);
    ctx.shadowColor='#ff8aa8'; ctx.shadowBlur=10;
    ctx.fillText('✿  Messages from Friends  ✿', W/2, py2+28);
    ctx.shadowBlur=0; ctx.shadowColor='transparent';
    ctx.fillStyle='rgba(255,183,197,0.5)'; ctx.font=px(5);
    ctx.fillText(`${popupState.index+1} / ${CONFIG.photos.length}`, W/2, py2+44);

    // Image area — 520×265, centered, aspect-ratio preserved
    const ix=px2+50, iy=py2+54, iw=pw-100, ih=ph-110;
    ctx.fillStyle='#0d0810'; ctx.fillRect(ix, iy, iw, ih);
    if (img && img.naturalWidth > 0) {
      const scale = Math.min(iw / img.naturalWidth, ih / img.naturalHeight);
      const dw = Math.round(img.naturalWidth * scale);
      const dh = Math.round(img.naturalHeight * scale);
      ctx.drawImage(img, ix + (iw-dw)/2, iy + (ih-dh)/2, dw, dh);
    } else {
      ctx.fillStyle='#2a1a22'; ctx.fillRect(ix,iy,iw,ih);
      ctx.fillStyle='#664466'; ctx.font=px(5);
      ctx.fillText('[ ' + cfg.file + ' ]', W/2, iy+ih/2);
    }

    // Nav arrows — styled pink plaques
    ctx.fillStyle='rgba(255,138,168,0.18)';
    roundRect(ctx, px2+8, H/2-18, 36, 36, 6); ctx.fill();
    roundRect(ctx, px2+pw-44, H/2-18, 36, 36, 6); ctx.fill();
    ctx.fillStyle='#ffb7c5'; ctx.font=px(12);
    ctx.fillText('◄', px2+26, H/2+8);
    ctx.fillText('►', px2+pw-26, H/2+8);
  }

  // ── Videos ──────────────────────────────────────────────────────────
  if (popupState.type === 'videos') {
    const cfg = CONFIG.videos[popupState.index];

    ctx.fillStyle='#ffb7c5'; ctx.font=px(7);
    ctx.shadowColor='#ff8aa8'; ctx.shadowBlur=10;
    ctx.fillText('✿  Video Messages  ✿', W/2, py2+28);
    ctx.shadowBlur=0; ctx.shadowColor='transparent';
    ctx.fillStyle='rgba(255,183,197,0.5)'; ctx.font=px(5);
    ctx.fillText(`${popupState.index+1} / ${CONFIG.videos.length}`, W/2, py2+44);

    // Dark placeholder — the real <video> element overlays this area
    const vx=VID_FRAME.x, vy=VID_FRAME.y, vw=VID_FRAME.w, vh=VID_FRAME.h;
    ctx.fillStyle='#050308'; ctx.fillRect(vx, vy, vw, vh);
    ctx.strokeStyle='rgba(255,138,168,0.3)'; ctx.lineWidth=1;
    ctx.strokeRect(vx, vy, vw, vh);

    // Caption below frame
    ctx.fillStyle='rgba(255,183,197,0.7)'; ctx.font=px(5);
    ctx.fillText(cfg.caption, W/2, vy+vh+20);
  }

  // ── Footer hint ──────────────────────────────────────────────────────
  ctx.fillStyle='rgba(255,138,168,0.35)'; ctx.font=px(5);
  ctx.fillText('[◄ ►] navigate    [E / Esc] close', W/2, py2+ph-18);
  ctx.restore();
}

function drawCelebration() {
  if (currentRoom) drawRoom(currentRoom);
  drawGardenProps(currentRoom);
  drawPet();
  drawPlayer();
  drawHUD();

  // Confetti — one save/restore for all pieces
  ctx.save();
  for (let i = 0; i < confettiParticles.length; i++) {
    const c = confettiParticles[i];
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.restore();

  // Banner
  const bw=520, bh=140, bx=W/2-260, by=H/2-70;
  ctx.save();
  ctx.fillStyle='rgba(10,20,10,0.88)';
  roundRect(ctx, bx, by, bw, bh, 12); ctx.fill();
  ctx.strokeStyle='#e8c547'; ctx.lineWidth=3; ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#e8c547'; ctx.font=px(10);
  ctx.shadowColor='#e8c547'; ctx.shadowBlur=12;
  ctx.fillText('🎉 HAPPY BIRTHDAY 🎉', W/2, by+46);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  ctx.fillStyle='#ffffff'; ctx.font=px(18);
  ctx.shadowColor='#fff'; ctx.shadowBlur=15;
  ctx.fillText(CONFIG.friendName+'!', W/2, by+90);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  ctx.fillStyle='#a0c87a'; ctx.font=px(6);
  ctx.fillText(CONFIG.subtitle, W/2, by+114);
  ctx.fillStyle='#555'; ctx.font=px(5);
  ctx.fillText('[E / Esc] keep wandering', W/2, by+bh+16);
  ctx.restore();
}

function drawPauseMenu() {
  // Draw the current game frame underneath
  if (currentRoom) drawRoom(currentRoom);
  drawGardenProps(currentRoom);
  enemies.forEach(drawEnemy);
  drawEnemyProjectiles();
  if (boss) {
    if (boss.bossType === 'pinky') drawPinky();
    else if (boss.bossType === 'owlet') drawOwlet();
    else drawBloom();
    drawBossHPBar();
  }
  drawPet();
  drawTears();
  drawPlayer();
  drawParticles();
  drawHUD();
  // Overlay
  ctx.fillStyle = 'rgba(10,5,20,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFB3C6';
  ctx.font = '16px "Press Start 2P",monospace';
  ctx.shadowColor = '#FFB3C6'; ctx.shadowBlur = 14;
  ctx.fillText('PAUSED', W/2, H/2 - 72);
  ctx.shadowBlur = 0;
  const items = [
    ['[ESC]', 'Resume'],
    ['[M]',   musicMuted ? 'Unmute Music' : 'Mute Music'],
    ['[R]',   'Back to Menu'],
  ];
  items.forEach(([key, label], i) => {
    const y = H/2 - 20 + i * 34;
    ctx.font = '7px "Press Start 2P",monospace';
    ctx.fillStyle = '#e8c547'; ctx.textAlign = 'right';
    ctx.fillText(key, W/2 - 8, y);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';
    ctx.fillText(label, W/2 + 8, y);
  });
  const diffLabel = difficulty === 'hell' ? '⚠ HELL MODE' : 'Normal Mode';
  ctx.fillStyle = difficulty === 'hell' ? '#ff6666' : '#888';
  ctx.font = '5px "Press Start 2P",monospace';
  ctx.textAlign = 'center';
  ctx.fillText(diffLabel, W/2, H/2 + 90);
  ctx.restore();
}

function drawDeathScreen() {
  // Darken the frozen game world behind
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  const panW = 480, panH = 280, panX = W/2 - 240, panY = H/2 - 140;

  // Panel shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, panX+6, panY+6, panW, panH, 14); ctx.fill();

  // Panel body
  const grad = ctx.createLinearGradient(panX, panY, panX, panY+panH);
  grad.addColorStop(0, '#1a0412'); grad.addColorStop(1, '#0e0208');
  ctx.fillStyle = grad;
  roundRect(ctx, panX, panY, panW, panH, 14); ctx.fill();
  ctx.strokeStyle = '#c4453f'; ctx.lineWidth = 2.5;
  roundRect(ctx, panX, panY, panW, panH, 14); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,100,80,0.22)'; ctx.lineWidth = 1;
  roundRect(ctx, panX+7, panY+7, panW-14, panH-14, 10); ctx.stroke();

  // Corner flowers (red tint)
  drawSakuraFlower(panX,        panY,        11, 0.65);
  drawSakuraFlower(panX+panW,   panY,        11, 0.65);
  drawSakuraFlower(panX,        panY+panH,   11, 0.65);
  drawSakuraFlower(panX+panW,   panY+panH,   11, 0.65);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#ff4444';
  ctx.shadowColor = '#c4453f'; ctx.shadowBlur = 20;
  ctx.font = px(22);
  ctx.fillText('YOU DIED', W/2, panY + 62);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  ctx.fillStyle = '#cc6666'; ctx.font = px(6);
  ctx.fillText('Where would you like to continue from?', W/2, panY + 92);

  // Separator
  ctx.strokeStyle = 'rgba(200,70,70,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(panX+24, panY+104); ctx.lineTo(panX+panW-24, panY+104); ctx.stroke();

  // Two option cards
  const optW = 184, optH = 100, optY = panY + 116, gap = 16;
  const opt0X = W/2 - optW - gap/2;
  const opt1X = W/2 + gap/2;

  const opts = [
    { label: 'RESTART', sub: 'From the beginning', icon: '🔄' },
    { label: 'CHECKPOINT', sub: 'Secret Garden', icon: '🌸' },
  ];

  for (let i = 0; i < 2; i++) {
    const ox = i === 0 ? opt0X : opt1X;
    const sel = deathScreenSel === i;

    ctx.fillStyle = sel ? '#2e0a08' : '#180404';
    roundRect(ctx, ox, optY, optW, optH, 9); ctx.fill();
    ctx.strokeStyle = sel ? '#ff6644' : '#3a1010'; ctx.lineWidth = sel ? 2 : 1;
    if (sel) { ctx.shadowColor = '#ff4422'; ctx.shadowBlur = 12; }
    roundRect(ctx, ox, optY, optW, optH, 9); ctx.stroke();
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

    const cx = ox + optW/2;
    ctx.font = '28px serif';
    ctx.fillText(opts[i].icon, cx, optY + 38);
    ctx.fillStyle = sel ? '#f6e7d3' : '#6a3a3a'; ctx.font = px(7);
    ctx.fillText(opts[i].label, cx, optY + 64);
    ctx.fillStyle = sel ? '#ffb7c5' : '#3a1a1a'; ctx.font = px(5);
    ctx.fillText(opts[i].sub, cx, optY + 80);

    if (sel) {
      ctx.fillStyle = '#ff6644'; ctx.font = px(8);
      ctx.fillText('◆', cx, optY - 10);
    }
  }

  ctx.fillStyle = '#6a3a3a'; ctx.font = px(5);
  ctx.fillText('◄ ► to choose   ·   Enter to confirm', W/2, panY + panH - 14);
}

function drawTitle() {
  // ── Background ──────────────────────────────────────────────────────
  if (!drawTitle._sky) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#080614');
    g.addColorStop(0.42, '#18082a');
    g.addColorStop(0.72, '#5a1430');
    g.addColorStop(0.88, '#c4453f');
    g.addColorStop(1,    '#0e0806');
    drawTitle._sky = g;
  }
  ctx.fillStyle = drawTitle._sky;
  ctx.fillRect(0, 0, W, H);

  // ── Stars ───────────────────────────────────────────────────────────
  const STARS = [
    [55,28],[148,18],[275,42],[412,12],[558,33],[698,22],[835,38],
    [110,68],[338,55],[492,72],[638,50],[798,62],[88,96],[442,88],[726,78],
    [196,96],[602,92],[750,44],[300,24],[500,58],
  ];
  for (let i = 0; i < STARS.length; i++) {
    const [sx, sy] = STARS[i];
    const t = 0.35 + 0.65 * Math.abs(Math.sin(frameCount * 0.028 + i * 1.72));
    ctx.fillStyle = `rgba(246,231,211,${t * 0.88})`;
    const ss = i % 5 === 0 ? 2 : 1;
    ctx.fillRect(sx, sy, ss, ss);
    if (i % 6 === 0) {
      ctx.fillStyle = `rgba(246,231,211,${t * 0.28})`;
      ctx.fillRect(sx-2, sy, 5, 1); ctx.fillRect(sx, sy-2, 1, 5);
    }
  }

  // ── Moon ────────────────────────────────────────────────────────────
  const mx = 768, my = 68, mr = 26;
  const mhalo = ctx.createRadialGradient(mx, my, mr, mx, my, mr*2.8);
  mhalo.addColorStop(0, 'rgba(246,231,211,0.16)'); mhalo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = mhalo; ctx.fillRect(mx-80, my-80, 160, 160);
  ctx.fillStyle = '#f6e7d3'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#18082a'; ctx.beginPath(); ctx.arc(mx+9, my-5, mr*0.8, 0, Math.PI*2); ctx.fill();

  // ── Falling petals (seeded) ─────────────────────────────────────────
  if (!drawTitle._petals) {
    drawTitle._petals = Array.from({length: 30}, (_, i) => ({
      x0: (i*139+22) % (W+80) - 40, spd: 0.32 + (i%8)*0.11,
      wob: (i*0.73) % (Math.PI*2),  rot: (i*0.51) % (Math.PI*2),
      sz: 4 + i%4, ci: i%3,
    }));
  }
  const PC = ['rgba(255,183,197,','rgba(255,138,168,','rgba(246,231,211,'];
  for (let i = 0; i < drawTitle._petals.length; i++) {
    const p = drawTitle._petals[i];
    const py = (frameCount * p.spd * 0.55 + i*41) % (H+30) - 15;
    const px2 = p.x0 + Math.sin(frameCount*0.016 + p.wob)*32;
    const alpha = 0.38 + 0.42*Math.abs(Math.sin(frameCount*0.022 + i));
    ctx.save(); ctx.translate(px2, py); ctx.rotate(p.rot + frameCount*0.011);
    ctx.fillStyle = PC[p.ci] + alpha + ')';
    ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz*1.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Border ──────────────────────────────────────────────────────────
  ctx.strokeStyle = '#ff8aa8'; ctx.lineWidth = 3;
  roundRect(ctx, 18, 18, W-36, H-36, 16); ctx.stroke();
  ctx.strokeStyle = 'rgba(242,193,78,0.45)'; ctx.lineWidth = 1;
  roundRect(ctx, 27, 27, W-54, H-54, 12); ctx.stroke();
  drawSakuraFlower(18,   18,   11, 0.75); drawSakuraFlower(W-18, 18,   11, 0.75);
  drawSakuraFlower(18,   H-18, 11, 0.75); drawSakuraFlower(W-18, H-18, 11, 0.75);

  // ── Title ───────────────────────────────────────────────────────────
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f2c14e'; ctx.font = px(7);
  ctx.fillText('✿  ─────────────  ✿  ─────────────  ✿', W/2, 106);

  ctx.fillStyle = '#ffb7c5'; ctx.font = px(13);
  ctx.shadowColor = '#ff8aa8'; ctx.shadowBlur = 14;
  ctx.fillText('Bindings Of', W/2, 146);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  ctx.fillStyle = '#f6e7d3'; ctx.font = px(30);
  ctx.shadowColor = '#ffb7c5'; ctx.shadowBlur = 26;
  ctx.fillText('NopeYep', W/2, 200);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  ctx.fillStyle = '#f2c14e'; ctx.font = px(7);
  ctx.fillText('✿  ─────────────  ✿  ─────────────  ✿', W/2, 224);

  ctx.fillStyle = '#f6e7d3'; ctx.font = px(6);
  ctx.fillText('A Birthday Game Made For NopeYep', W/2, 248);

  // ── Controls box ────────────────────────────────────────────────────
  const cbx = W/2-225, cby = 265, cbw = 450, cbh = 106;
  ctx.fillStyle = '#1e0e04'; roundRect(ctx, cbx, cby, cbw, cbh, 8); ctx.fill();
  ctx.fillStyle = '#2c1608'; roundRect(ctx, cbx+3, cby+3, cbw-6, cbh-6, 6); ctx.fill();
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 1.5;
  roundRect(ctx, cbx+3, cby+3, cbw-6, cbh-6, 6); ctx.stroke();

  ctx.fillStyle = '#f2c14e'; ctx.font = px(8); ctx.textAlign = 'center';
  ctx.fillText('Controls', W/2, cby+22);
  // Underline under header + vertical centre divider only
  ctx.strokeStyle = 'rgba(242,193,78,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cbx+16, cby+29); ctx.lineTo(cbx+cbw-16, cby+29); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2, cby+35); ctx.lineTo(W/2, cby+cbh-10); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#8fd19e'; ctx.font = px(7);
  ctx.fillText('WASD', cbx+22, cby+54);  ctx.fillText('E', cbx+22, cby+80);
  ctx.fillStyle = '#f6e7d3';
  ctx.fillText('Move', cbx+94, cby+54);  ctx.fillText('Interact', cbx+94, cby+80);
  ctx.fillStyle = '#8fd19e';
  ctx.fillText('Arrows', W/2+18, cby+54); ctx.fillText('Esc', W/2+18, cby+80);
  ctx.fillStyle = '#f6e7d3';
  ctx.fillText('Shoot', W/2+106, cby+54); ctx.fillText('Close', W/2+106, cby+80);

  // ── Difficulty selector (arrow-navigated) ───────────────────────────
  ctx.textAlign = 'center';
  const selNorm = difficulty === 'normal';
  const dy = 388, pw = 210, ph = 50, gap = 20;
  const totalW = pw*2 + gap, lx = W/2 - totalW/2, rx = lx + pw + gap;

  // Normal plaque
  ctx.fillStyle = selNorm ? '#2e1a04' : '#140c02';
  roundRect(ctx, lx, dy, pw, ph, 7); ctx.fill();
  ctx.strokeStyle = selNorm ? '#f2c14e' : '#3a2408'; ctx.lineWidth = selNorm ? 2 : 1;
  roundRect(ctx, lx, dy, pw, ph, 7); ctx.stroke();
  if (selNorm) { ctx.shadowColor = '#f2c14e'; ctx.shadowBlur = 10; }
  ctx.fillStyle = selNorm ? '#f2c14e' : '#5a3a18'; ctx.font = px(8);
  ctx.fillText('NORMAL', lx + pw/2, dy + ph/2 + 4);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  // Hell plaque
  ctx.fillStyle = !selNorm ? '#2e0404' : '#0e0404';
  roundRect(ctx, rx, dy, pw, ph, 7); ctx.fill();
  ctx.strokeStyle = !selNorm ? '#c4453f' : '#2e0e0e'; ctx.lineWidth = !selNorm ? 2 : 1;
  roundRect(ctx, rx, dy, pw, ph, 7); ctx.stroke();
  if (!selNorm) { ctx.shadowColor = '#c4453f'; ctx.shadowBlur = 10; }
  ctx.fillStyle = !selNorm ? '#ff6644' : '#4a1a1a'; ctx.font = px(8);
  ctx.fillText('HELL MODE', rx + pw/2, dy + ph/2 + 4);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  // ── Cursor indicator on difficulty plaques ──────────────────────────
  if (titleSelected === 'play') {
    ctx.fillStyle = selNorm ? '#f2c14e' : '#ff6644'; ctx.font = px(9);
    const arrowX = selNorm ? lx + pw/2 : rx + pw/2;
    ctx.fillText('◆', arrowX, dy - 10);
  }

  // ── LEVEL SELECT button ─────────────────────────────────────────────
  const lsby = 446, lsbw = 244, lsbh = 30;
  const lsbx = W/2 - lsbw/2;
  const lsFocus = titleSelected === 'levels';
  ctx.fillStyle = lsFocus ? '#1e0a1a' : '#100608';
  roundRect(ctx, lsbx, lsby, lsbw, lsbh, 7); ctx.fill();
  ctx.strokeStyle = lsFocus ? '#ff8aa8' : '#3a1828'; ctx.lineWidth = lsFocus ? 2 : 1;
  roundRect(ctx, lsbx, lsby, lsbw, lsbh, 7); ctx.stroke();
  if (lsFocus) { ctx.shadowColor = '#ff8aa8'; ctx.shadowBlur = 10; }
  ctx.fillStyle = lsFocus ? '#ffb7c5' : '#4a2838'; ctx.font = px(7); ctx.textAlign = 'center';
  ctx.fillText('✿  LEVEL SELECT  ✿', W/2, lsby + lsbh/2 + 4);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  if (lsFocus) {
    ctx.fillStyle = '#ff8aa8'; ctx.font = px(9);
    ctx.fillText('◆', W/2, lsby - 9);
  }

  // ── Press to play / level select ───────────────────────────────────
  if (Math.floor(frameCount/26)%2===0) {
    if (titleSelected === 'play') {
      ctx.fillStyle = '#ffb7c5'; ctx.font = px(8);
      ctx.shadowColor = '#ff8aa8'; ctx.shadowBlur = 14;
      ctx.fillText('✿  Press Enter to play  ✿', W/2, 492);
    } else {
      ctx.fillStyle = '#ff8aa8'; ctx.font = px(8);
      ctx.shadowColor = '#c4453f'; ctx.shadowBlur = 10;
      ctx.fillText('✿  Press Enter to pick level  ✿', W/2, 492);
    }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }
  ctx.fillStyle = '#6a4a5a'; ctx.font = px(6); ctx.textAlign = 'center';
  ctx.fillText('▲ ▼ navigate   ·   ◄ ► difficulty', W/2, 514);
  ctx.textAlign = 'left';

  // ── Level select overlay ────────────────────────────────────────────
  if (titleMode === 'levelselect') {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);

    const panW = 560, panH = 420, panX = W/2 - 280, panY = H/2 - 210;
    ctx.fillStyle = '#0e0814'; roundRect(ctx, panX, panY, panW, panH, 12); ctx.fill();
    ctx.strokeStyle = '#ff8aa8'; ctx.lineWidth = 2;
    roundRect(ctx, panX, panY, panW, panH, 12); ctx.stroke();
    ctx.strokeStyle = 'rgba(242,193,78,0.3)'; ctx.lineWidth = 1;
    roundRect(ctx, panX+6, panY+6, panW-12, panH-12, 9); ctx.stroke();
    drawSakuraFlower(panX,      panY,      10, 0.7);
    drawSakuraFlower(panX+panW, panY,      10, 0.7);
    drawSakuraFlower(panX,      panY+panH, 10, 0.7);
    drawSakuraFlower(panX+panW, panY+panH, 10, 0.7);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2c14e'; ctx.font = px(9);
    ctx.fillText('✿  SELECT LEVEL  ✿', W/2, panY + 30);
    ctx.strokeStyle = 'rgba(242,193,78,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(panX+20, panY+40); ctx.lineTo(panX+panW-20, panY+40); ctx.stroke();

    const visCount = 11, rowH = 31, listY = panY + 52;
    const scrollOff = Math.max(0, Math.min(titleLevelSel - 5, LEVEL_LIST.length - visCount));
    for (let i = 0; i < visCount; i++) {
      const li = i + scrollOff;
      if (li >= LEVEL_LIST.length) break;
      const entry = LEVEL_LIST[li];
      const ry = listY + i * rowH;
      const isSel = li === titleLevelSel;
      if (isSel) {
        ctx.fillStyle = 'rgba(255,139,168,0.18)';
        roundRect(ctx, panX+14, ry-3, panW-28, rowH-2, 5); ctx.fill();
        ctx.strokeStyle = '#ff8aa8'; ctx.lineWidth = 1;
        roundRect(ctx, panX+14, ry-3, panW-28, rowH-2, 5); ctx.stroke();
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = isSel ? '#f2c14e' : '#3a2810'; ctx.font = px(6);
      ctx.fillText(`${li + 1}.`, panX + 26, ry + 16);
      ctx.fillStyle = isSel ? '#f6e7d3' : '#6a4858'; ctx.font = px(7);
      ctx.fillText(entry.name, panX + 56, ry + 17);
      ctx.fillStyle = isSel ? '#ffb7c5' : '#3a2030'; ctx.font = px(5);
      ctx.textAlign = 'right';
      ctx.fillText(entry.sub, panX + panW - 24, ry + 17);
    }

    ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(242,193,78,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(panX+20, panY+panH-38); ctx.lineTo(panX+panW-20, panY+panH-38); ctx.stroke();
    ctx.fillStyle = '#6a4a5a'; ctx.font = px(5);
    ctx.fillText('Enter to jump · Escape to go back · ▲ ▼ to scroll', W/2, panY + panH - 14);
  }
}
</script>
</body>
