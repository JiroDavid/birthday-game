function loadImage(src, callback) {
  const img = new Image();
  img.onload = () => callback(img);

  img.src = src;
}

// Bloom (boss + grub variant) sprite sheets

const bloomPaths = {
  crawl:  'sprites/Momo-Mama/Momo-Mama/momo mama/mm-crawl.png',

  happy:  'sprites/Momo-Mama/Momo-Mama/EXTRAS/mm-happy.png',
};
Object.entries(bloomPaths).forEach(([key, src]) => loadImage(src, img => { bloomSprites[key] = img; }));
const BLOOM_FRAMES = { crawl:5, attack:7, jump:6, hurt:6, happy:5 };
const BLOOM_FS = 64; // frame size in spritesheet

// Player sprites (Dude Monster — 32×32 per frame)

loadImage('sprites/3 Dude_Monster/Dude_Monster_Idle_4.png', img => { dudeSprites.idle = img; });

// Bat sprites (64×64 per frame)

const BAT_FS = 64;
const BAT_DS = 72; // display size (slightly larger than 1×)

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, gain, dur, startT, endFreq) {
  try {
    const ac = getAudio();
    const t = startT ?? ac.currentTime;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (endFreq !== undefined) osc.frequency.exponentialRampToValueAtTime(endFreq, t+dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.start(t); osc.stop(t+dur);
  } catch(e) { /* audio not ready yet */ }
}

function loadRoom(idx) {
  const room = ROOM_GRAPH[idx];
  currentRoom = room;
  currentRoomIdx = idx;
  room.visited = true;
  enemies.length = 0;
  tears.length = 0;
  particles.length = 0;
  boss = null;
  room.enemySpawns.forEach(s => spawnEnemy(s.type, s.x, s.y));
  if (room.type === 'boss') initBoss();
}

function isObstacle(tx, ty) {
  if (!currentRoom) return false;
  return currentRoom.obstacles.some(([ox, oy]) => ox === tx && oy === ty);
}

function circleCollidesRect(cx, cy, cr, rx, ry, rw, rh) {
  const nearX = Math.max(rx, Math.min(cx, rx + rw));
  const nearY = Math.max(ry, Math.min(cy, ry + rh));
  return Math.hypot(cx - nearX, cy - nearY) < cr;
}

function resolveCircleVsObstacles(obj, radius) {
  const tx = Math.floor(obj.x / TILE);
  const ty = Math.floor((obj.y - PF_TOP) / TILE);
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const ntx = tx + dx, nty = ty + dy;
      if (ntx < 1 || ntx > COLS - 2 || nty < 1 || nty > ROWS - 2) continue;
      if (!isObstacle(ntx, nty)) continue;
      const rx = ntx * TILE, ry = PF_TOP + nty * TILE;
      if (circleCollidesRect(obj.x, obj.y, radius, rx, ry, TILE, TILE)) {
        const centerX = rx + TILE / 2, centerY = ry + TILE / 2;
        const overlapX = (radius + TILE / 2) - Math.abs(obj.x - centerX);
        const overlapY = (radius + TILE / 2) - Math.abs(obj.y - centerY);
        if (overlapX < overlapY) {
          obj.x += obj.x < centerX ? -overlapX : overlapX;
        } else {
          obj.y += obj.y < centerY ? -overlapY : overlapY;
        }
      }
    }
  }
}

function clampToRoom(obj, radius) {
  obj.x = Math.max(TILE + radius, Math.min(W - TILE - radius, obj.x));
  obj.y = Math.max(PF_TOP + TILE + radius, Math.min(H - TILE - radius, obj.y));
}

function checkDoorTrigger() {
  if (!currentRoom || !currentRoom.cleared) return;
  const m = 24; // must be > player radius (16) so clampToRoom doesn't block trigger
  const checks = [
    { cond: player.y < PF_TOP+TILE+m && player.x>W/2-50 && player.x<W/2+50, dir:'north', entry:{x:W/2,y:H-TILE*2} },
    { cond: player.y > H-TILE-m       && player.x>W/2-50 && player.x<W/2+50, dir:'south', entry:{x:W/2,y:PF_TOP+TILE*2} },
    { cond: player.x > W-TILE-m       && player.y>H/2-50 && player.y<H/2+50, dir:'east',  entry:{x:TILE*2,y:H/2} },
    { cond: player.x < TILE+m         && player.y>H/2-50 && player.y<H/2+50, dir:'west',  entry:{x:W-TILE*2,y:H/2} },
  ];
  for (const c of checks) {
    if (!c.cond) continue;
    const targetIdx = currentRoom.doors[c.dir];
    if (targetIdx === null) continue;
    transition.entryPos = c.entry;
    startTransition(targetIdx);
    return;
  }
}

function startTransition(targetIdx) {
  transition.active = true;
  transition.progress = 0;
  transition.fromIdx = currentRoomIdx;
  transition.toIdx = targetIdx;
  transition.dir = targetIdx > currentRoomIdx ? -1 : 1;
  gameState = 'TRANSITION';
}

function updateTransition() {
  transition.progress++;
  if (transition.progress >= transition.duration) {
    transition.active = false;
    loadRoom(transition.toIdx);
    if (transition.entryPos) {
      player.x = transition.entryPos.x;
      player.y = transition.entryPos.y;
    }
    if (ROOM_GRAPH[transition.toIdx].type === 'boss') {
      gameState = 'BOSS_INTRO';
      bossIntro.timer = 0;
    } else {
      gameState = 'PLAYING';
    }
  }
}

function drawTransition() {
  const t = transition.progress / transition.duration;
  const offset = t * W * transition.dir;
  ctx.save();
  ctx.translate(offset, 0);
  drawRoom(ROOM_GRAPH[transition.fromIdx]);
  ctx.restore();
  ctx.save();
  ctx.translate(offset + W * -transition.dir, 0);
  drawRoom(ROOM_GRAPH[transition.toIdx]);
  ctx.restore();
}

// ─── ENEMIES ──────────────────────────────────────────────────────────────
function enemyRadius(e) {
  return e.type === 'fly' ? 10 : e.type === 'tank' ? 22 : 14;
}

function spawnEnemy(type, x, y) {
  const base = { type, x, y, hitFlash: 0, slowTimer: 0, knockVx: 0, knockVy: 0, animFrame: 0, animTimer: 0 };
  if (type === 'grub') enemies.push({ ...base, hp: 2, hopTimer: 0 });
  if (type === 'fly')  enemies.push({ ...base, hp: 1, phase: 'orbit', orbitAngle: Math.random() * Math.PI * 2, dashVx: 0, dashVy: 0, dashTimer: 0, telegraphTimer: 0, orbitRadius: 120 + Math.random() * 60, orbitFrames: null });
  if (type === 'tank') enemies.push({ ...base, hp: 3, pulseTimer: 0, orbitalCooldown: 0 });
}

function updateGrub(e) {
  // Advance animation frame
  e.animTimer++; if (e.animTimer >= 8) { e.animTimer = 0; e.animFrame++; }
  const speed = 1.2 * (e.slowTimer > 0 ? 0.4 : 1);
  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  e.knockVx *= 0.85; e.knockVy *= 0.85;
  e.x += (dx / len) * speed + e.knockVx;
  e.y += (dy / len) * speed + e.knockVy;
  resolveCircleVsObstacles(e, 14);
  clampToRoom(e, 14);
  e.hopTimer = (e.hopTimer + 1) % 30;
  if (e.slowTimer > 0) e.slowTimer--;
  if (e.hitFlash > 0) e.hitFlash--;
  if (e.orbitalCooldown > 0) e.orbitalCooldown--;
}

function updateFly(e) {
  // Advance animation frame
  e.animTimer++; if (e.animTimer >= 8) { e.animTimer = 0; e.animFrame++; }
  const slowMult = e.slowTimer > 0 ? 0.4 : 1;
  if (e.slowTimer > 0) e.slowTimer--;
  if (e.hitFlash > 0) e.hitFlash--;
  if (e.orbitalCooldown > 0) e.orbitalCooldown--;

  if (e.phase === 'orbit') {
    e.orbitAngle += 0.025 * slowMult;
    const targetX = player.x + Math.cos(e.orbitAngle) * e.orbitRadius;
    const targetY = player.y + Math.sin(e.orbitAngle) * e.orbitRadius;
    const dx = targetX - e.x, dy = targetY - e.y;
    const len = Math.hypot(dx, dy) || 1;
    e.x += (dx/len) * 2.5 * slowMult;
    e.y += (dy/len) * 2.5 * slowMult;
    clampToRoom(e, 10);

    if (e.orbitFrames === null) e.orbitFrames = 90 + Math.floor(Math.random() * 60);
    e.orbitFrames--;
    if (e.orbitFrames <= 0) {
      e.phase = 'telegraph';
      e.telegraphTimer = 40;
    }
  } else if (e.phase === 'telegraph') {
    e.telegraphTimer--;
    if (e.telegraphTimer <= 0) {
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.dashVx = (dx/len) * 6;
      e.dashVy = (dy/len) * 6;
      e.dashTimer = 24;
      e.phase = 'dash';
    }
  } else if (e.phase === 'dash') {
    e.x += e.dashVx * slowMult;
    e.y += e.dashVy * slowMult;
    e.dashTimer--;
    clampToRoom(e, 10);
    if (e.dashTimer <= 0) {
      e.phase = 'orbit';
      e.orbitFrames = 90 + Math.floor(Math.random() * 60);
    }
  }
}

function updateTank(e) {
  // Advance animation frame
  e.animTimer++; if (e.animTimer >= 8) { e.animTimer = 0; e.animFrame++; }
  const speed = 0.7 * (e.slowTimer > 0 ? 0.4 : 1);
  if (e.slowTimer > 0) e.slowTimer--;
  if (e.hitFlash > 0) e.hitFlash--;
  if (e.orbitalCooldown > 0) e.orbitalCooldown--;

  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.hypot(dx, dy) || 1;
  e.knockVx *= 0.8; e.knockVy *= 0.8;
  // Tank ignores obstacles per spec
  e.x += (dx/len)*speed + e.knockVx;
  e.y += (dy/len)*speed + e.knockVy;
  clampToRoom(e, 22);

  e.pulseTimer = (e.pulseTimer + 1) % 60;
}

// ─── INTERACTION ──────────────────────────────────────────────────────────
function tryInteract() {
  if (!currentRoom) return;

  // Pet befriend (also handled in update E-key block, but centralize here)
  if (pet.active && !pet.befriended && Math.hypot(player.x-pet.x, player.y-pet.y) < 48) {
    pet.befriended = true;
    spawnParticles(pet.x, pet.y, '#cc66ff', 15, 4, 30);
    return;
  }

  if (currentRoom.type !== 'garden') return;
  const pb = currentRoom.photoBoard, vb = currentRoom.videoBoard, th = currentRoom.throne;

  if (Math.hypot(player.x-pb.x, player.y-pb.y) < 50) {
    openPopup('photos');
  } else if (Math.hypot(player.x-vb.x, player.y-vb.y) < 50) {
    openPopup('videos');
  } else if (Math.hypot(player.x-th.x, player.y-th.y) < 50) {
    startCelebration();
  }
}

function openPopup(type) {
  popupState.type = type;
  popupState.index = 0;
  gameState = 'POPUP';
  if (type === 'videos') showVideo(0);
}

function closePopup() {
  if (activeVideoEl) {
    activeVideoEl.pause();
    activeVideoEl.style.display = 'none';
    activeVideoEl = null;
  }
  confettiParticles.length = 0;
  gameState = 'PLAYING';
}

function navigatePopup(dir) {
  const list = popupState.type === 'photos' ? CONFIG.photos : CONFIG.videos;
  popupState.index = (popupState.index + dir + list.length) % list.length;
  if (popupState.type === 'videos') {
    if (activeVideoEl) { activeVideoEl.pause(); activeVideoEl.style.display = 'none'; }
    showVideo(popupState.index);
  }
}

function showVideo(idx) {
  const rect = canvas.getBoundingClientRect();
  activeVideoEl = videoEls[idx];
  activeVideoEl.style.left = (rect.left + W/2 - 240) + 'px';
  activeVideoEl.style.top  = (rect.top  + H/2 - 135) + 'px';
  activeVideoEl.style.display = 'block';
}

function startCelebration() {
  gameState = 'CELEBRATION';
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8'];
  for (let i = 0; i < 80; i++) {
    confettiParticles.push({
      x: Math.random() * W,
      y: -10 - Math.random() * 60,
      vx: (Math.random()-0.5) * 3,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI*2,
      rotV: (Math.random()-0.5) * 0.15,
      w: 8 + Math.random() * 8,
      h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random()*colors.length)],
    });
  }
  playConfetti();
}

// ─── LOOP ─────────────────────────────────────────────────────────────────
function update() {
  frameCount++;
  Object.keys(keysJustPressed).forEach(k => delete keysJustPressed[k]);

  if (gameState === 'TITLE') return;
  if (gameState === 'TRANSITION') { updateTransition(); return; }
  if (gameState === 'BOSS_INTRO') { updateBossIntro(); return; }
  if (gameState === 'SKILL_PICKUP') { updateSkillPickup(); return; }
  if (gameState === 'POPUP') return;
  if (gameState === 'CELEBRATION') {
    // Tick confetti physics
    for (let i = confettiParticles.length-1; i >= 0; i--) {
      const c = confettiParticles[i];
      c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.rot += c.rotV;
      if (c.y > H+20) confettiParticles.splice(i,1);
    }
    return;
  }

  if (gameState === 'PLAYING') {
    updatePlayer();
    updateOrbitals();
    for (let i = enemies.length-1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type==='grub')      updateGrub(e);
      else if (e.type==='fly')  updateFly(e);
      else if (e.type==='tank') updateTank(e);
    }
    if (boss) updateBloom();
    updatePet();
    updateTears();
    updateParticles();
    checkTearEnemyCollisions();
    checkPlayerEnemyCollisions();
    checkDoorTrigger();
    // E key interaction now handled in keydown via tryInteract()
  }
}

function updatePlayer() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['W']) dy -= 1;
  if (keys['s'] || keys['S']) dy += 1;
  if (keys['a'] || keys['A']) dx -= 1;
  if (keys['d'] || keys['D']) dx += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

  // Apply knockback velocity (decays each frame); clampToRoom handles boundary
  player.vx *= 0.8; player.vy *= 0.8;
  player.x += dx * CONFIG.player.speed + player.vx;
  player.y += dy * CONFIG.player.speed + player.vy;

  if (dx > 0) player.facing = 1;
  if (dx < 0) player.facing = -1;

  if (player.iframes > 0) player.iframes--;

  player.fireTimer = Math.max(0, player.fireTimer - 1);
  let sx = 0, sy = 0;
  if (keys['ArrowRight']) sx = 1;
  if (keys['ArrowLeft'])  sx = -1;
  if (keys['ArrowDown'])  sy = 1;
  if (keys['ArrowUp'])    sy = -1;

  if ((sx !== 0 || sy !== 0) && player.fireTimer === 0) {
    fireTear(sx, sy);
    player.fireTimer = CONFIG.player.fireRate;
  }
  resolveCircleVsObstacles(player, 16);
  clampToRoom(player, 16);
}

function fireTear(sx, sy) {
  const speed = CONFIG.player.tearSpeed * (player.skills.speed ? 1.8 : 1);
  const len = Math.hypot(sx, sy);
  const baseTear = {
    x: player.x, y: player.y,
    vx: (sx / len) * speed,
    vy: (sy / len) * speed,
    life: CONFIG.player.tearLifespan,
    lifespan: CONFIG.player.tearLifespan,
    radius: CONFIG.player.tearRadius,
    hitEnemies: new Set(),
    returning: false,
  };

  if (player.skills.triple) {
    [-15, 0, 15].forEach(deg => {
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      tears.push({
        ...baseTear,
        hitEnemies: new Set(),
        vx: baseTear.vx * cos - baseTear.vy * sin,
        vy: baseTear.vx * sin + baseTear.vy * cos,
      });
    });
  } else {
    tears.push({ ...baseTear });
  }
  playShoot();
}

function updateTears() {
  for (let i = tears.length - 1; i >= 0; i--) {
    const t = tears[i];

    // Homing steering
    if (player.skills.homing && !t.returning) {
      let nearest = null, nearestDist = Infinity;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - t.x, e.y - t.y);
        if (d < nearestDist) { nearestDist = d; nearest = e; }
      });
      if (boss) {
        const d = Math.hypot(boss.x - t.x, boss.y - t.y);
        if (d < nearestDist) { nearestDist = d; nearest = boss; }
      }
      if (nearest) {
        const dx = nearest.x - t.x, dy = nearest.y - t.y;
        const len = Math.hypot(dx, dy) || 1;
        const force = 0.3;
        t.vx += (dx / len) * force;
        t.vy += (dy / len) * force;
        const spd = Math.hypot(t.vx, t.vy);
        const maxSpd = CONFIG.player.tearSpeed * (player.skills.speed ? 1.8 : 1);
        if (spd > maxSpd) { t.vx = t.vx / spd * maxSpd; t.vy = t.vy / spd * maxSpd; }
      }
    }

    // Boomerang: reverse at half lifespan
    if (player.skills.boomerang && !t.returning && t.life <= t.lifespan / 2) {
      t.returning = true;
      t.vx = -t.vx; t.vy = -t.vy;
      t.hitEnemies.clear();
    }

    t.x += t.vx;
    t.y += t.vy;
    t.life--;

    if (t.x < TILE || t.x > W - TILE || t.y < PF_TOP + TILE || t.y > H - TILE || t.life <= 0) {
      if (t.life > 0) impactParticles(t.x, t.y, '#88ccff');
      tears.splice(i, 1);
    }
  }
}

function spawnParticles(x, y, color, count, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.5 + Math.random() * 0.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life * (0.7 + Math.random() * 0.3),
      maxLife: life,
      r: 3 + Math.random() * 3,
      color,
    });
  }
}

function impactParticles(x, y, color) {
  spawnParticles(x, y, color, 5, 3, 12);
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function render() {
  ctx.save();
  if (screenShake.timer > 0) {
    ctx.translate(screenShake.x, screenShake.y);
    screenShake.timer--;
    screenShake.x = (Math.random()-0.5)*screenShake.timer*0.5;
    screenShake.y = (Math.random()-0.5)*screenShake.timer*0.5;
    if (screenShake.timer<=0) { screenShake.x=0; screenShake.y=0; }
  }
  ctx.clearRect(-10,-10,W+20,H+20);

  if (gameState==='TITLE') { drawTitle(); ctx.restore(); return; }

  if (gameState==='TRANSITION') { drawTransition(); drawHUD(); ctx.restore(); return; }

  if (currentRoom) drawRoom(currentRoom);
  drawGardenProps(currentRoom);
  enemies.forEach(drawEnemy);
  if (boss) { drawBloom(); drawBossHPBar(); }
  drawPet();
  drawTears();
  drawPlayer();
  drawOrbitals();
  drawParticles();
  drawHUD();

  if (gameState==='SKILL_PICKUP') { drawSkillPickup(); ctx.restore(); return; }
  if (gameState==='BOSS_INTRO')   { drawBossIntro();   ctx.restore(); return; }

  if (gameState === 'POPUP') {
    if (currentRoom) drawRoom(currentRoom);
    drawGardenProps(currentRoom);
    drawPet();
    drawPlayer();
    drawHUD();
    drawPopup();
    ctx.restore(); return;
  }

  if (gameState === 'CELEBRATION') {
    drawCelebration();
    ctx.restore(); return;
  }

  ctx.restore();
}

window.addEventListener('keydown', e => {
  if (!keys[e.key]) keysJustPressed[e.key] = true;
  keys[e.key] = true;

  // Popup / celebration controls
  if ((e.key==='e'||e.key==='E'||e.key==='Escape') &&
      (gameState==='POPUP'||gameState==='CELEBRATION')) {
    closePopup(); e.preventDefault(); return;
  }
  if (e.key==='ArrowLeft'  && gameState==='POPUP') { navigatePopup(-1); e.preventDefault(); return; }
  if (e.key==='ArrowRight' && gameState==='POPUP') { navigatePopup(1);  e.preventDefault(); return; }

  // E key in PLAYING — tryInteract
  if ((e.key==='e'||e.key==='E') && gameState==='PLAYING') {
    tryInteract();
  }

  if (e.key === 'Enter' && gameState === 'TITLE') initGame();
  const gameKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D','e','E','Enter',' ','Escape'];
  if (gameKeys.includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function startShake(intensity, duration) {
  screenShake.timer = duration;
  screenShake.x = (Math.random() - 0.5) * intensity;
  screenShake.y = (Math.random() - 0.5) * intensity;
}

function initGame() {
  player.hp = player.maxHP;
  player.iframes = 0;
  player.fireTimer = 0;
  player.vx = 0; player.vy = 0;
  player.facing = 1;
  player.x = 450; player.y = 300;
  player.animFrame = 0; player.animTimer = 0;
  Object.keys(player.skills).forEach(k => player.skills[k] = false);
  player.orbitals = [];

  skillPool = ['homing','explosive','piercing','orbital','freeze','boomerang','triple','speed'];
  for (let i = skillPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [skillPool[i], skillPool[j]] = [skillPool[j], skillPool[i]];
  }

  tears.length = 0;
  enemies.length = 0;
  particles.length = 0;
  confettiParticles.length = 0;
  currentRoomIdx = 0;
  boss = null;
  pet.active = false; pet.befriended = false; pet.bounceTimer = 0;
  gameState = 'PLAYING';
  loadRoom(0);
}

function initBoss() {
  boss = {
    x: W/2, y: 220,
    hp: 24, maxHP: 24,
    phase: 1,
    speed: 0.9,
    jumpTimer: 180,
    telegraphTimer: 0,
    telegraphing: false,
    shadowX: 0, shadowY: 0,
    jumpInFlight: false,
    jumpT: 0,
    startX: 0, startY: 0,
    hitFlash: 0,
    slowTimer: 0,
    spawnedMinions: false,
    knockVx: 0, knockVy: 0,
    projectiles: [],
    animFrame: 0,
    animTimer: 0,
    orbitalCooldown: 0,
  };
}

function updateBloom() {
  if (!boss) return;
  if (boss.hitFlash > 0) boss.hitFlash--;
  if (boss.slowTimer > 0) boss.slowTimer--;
  if (boss.orbitalCooldown > 0) boss.orbitalCooldown--;

  // Animate frames
  boss.animTimer++;
  if (boss.animTimer >= 8) { boss.animTimer = 0; boss.animFrame++; }

  // Arc jump in flight — skip other movement
  if (boss.jumpInFlight) {
    boss.jumpT += 0.06;
    boss.x = boss.startX + (boss.shadowX - boss.startX) * boss.jumpT;
    boss.y = boss.startY + (boss.shadowY - boss.startY) * boss.jumpT
             - Math.sin(boss.jumpT * Math.PI) * 80;
    if (boss.jumpT >= 1) {
      boss.jumpInFlight = false;
      boss.x = boss.shadowX; boss.y = boss.shadowY;
      const shakeMag = boss.phase === 2 ? 12 : 8;
      startShake(shakeMag, boss.phase === 2 ? 20 : 14);
      spawnParticles(boss.x, boss.y, '#aa44ee', 20, 8, 40);
      spawnParticles(boss.x, boss.y, '#44ee88', 15, 6, 35);
      // Phase 2: aimed blob on landing
      if (boss.phase === 2) {
        const dx = player.x - boss.x, dy = player.y - boss.y;
        const len = Math.hypot(dx, dy) || 1;
        boss.projectiles.push({
          x: boss.x, y: boss.y,
          vx: (dx/len)*3.5, vy: (dy/len)*3.5,
          life: 150, color: '#aa44ee',
        });
      }
    }
    updateBossProjectiles();
    return;
  }

  // Crawl toward player
  const speed = boss.speed * (boss.slowTimer > 0 ? 0.4 : 1) * (boss.phase === 2 ? 1.55 : 1);
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const len = Math.hypot(dx, dy) || 1;
  boss.knockVx *= 0.85; boss.knockVy *= 0.85;
  boss.x += (dx/len)*speed + boss.knockVx;
  boss.y += (dy/len)*speed + boss.knockVy;
  clampToRoom(boss, 45);

  // Phase 2 transition
  if (boss.phase === 1 && boss.hp <= 12) {
    boss.phase = 2;
    boss.animFrame = 0;
    startShake(12, 20);
    if (!boss.spawnedMinions) {
      boss.spawnedMinions = true;
      spawnEnemy('grub', boss.x - 120, boss.y + 80);
      spawnEnemy('grub', boss.x + 120, boss.y + 80);
      spawnEnemy('grub', boss.x, boss.y + 120);
    }
  }

  // Jump telegraph
  boss.jumpTimer--;
  if (!boss.telegraphing && boss.jumpTimer <= 60) {
    boss.telegraphing = true;
    boss.telegraphTimer = 60;
    boss.shadowX = player.x; boss.shadowY = player.y;
  }
  if (boss.telegraphing) {
    boss.telegraphTimer--;
    if (boss.telegraphTimer <= 0) {
      boss.telegraphing = false;
      boss.jumpInFlight = true;
      boss.jumpT = 0;
      boss.startX = boss.x; boss.startY = boss.y;
      boss.jumpTimer = boss.phase === 2 ? 120 : 180;
      boss.animFrame = 0;
    }
  }

  updateBossProjectiles();
}

function updateBossProjectiles() {
  if (!boss) return;
  for (let i = boss.projectiles.length - 1; i >= 0; i--) {
    const p = boss.projectiles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < PF_TOP || p.y > H) {
      boss.projectiles.splice(i, 1); continue;
    }
    if (player.iframes <= 0 && Math.hypot(p.x - player.x, p.y - player.y) < 12 + 16) {
      player.hp--;
      player.iframes = CONFIG.player.iframeDuration;
      startShake(4, 8);
      boss.projectiles.splice(i, 1);
      if (player.hp <= 0) gameState = 'TITLE';
    }
  }
}

function updatePet() {
  if (!pet.active) return;
  pet.bounceTimer++;
  if (!pet.befriended) return;
  // Follow player with lag, trailing ~60px behind
  const dx = player.x - pet.x, dy = player.y - pet.y;
  const dist = Math.hypot(dx, dy);
  const targetDist = 60;
  if (dist > targetDist + 5) {
    const speed = Math.min((dist - targetDist) * 0.1, 4);
    pet.x += (dx/dist) * speed;
    pet.y += (dy/dist) * speed;
  }
}

(function loop() {
  update();
  render();
  requestAnimationFrame(loop);
})();

// ─── COMBAT ───────────────────────────────────────────────────────────────
function checkRoomClear() {
  if (enemies.length > 0 || boss !== null) return;
  if (currentRoom.cleared) return;
  currentRoom.cleared = true;
  playDoorUnlock();
  if (skillPool.length >= 2 && currentRoom.type !== 'start' && currentRoom.type !== 'garden') {
    skillPickupState.choices = [skillPool.pop(), skillPool.pop()];
    skillPickupState.selected = 0;
    gameState = 'SKILL_PICKUP';
  }
}

function damageEnemy(e, tearVx, tearVy, idx) {
  playHit();
  e.hp--;
  e.hitFlash = 6;
  const len = Math.hypot(tearVx, tearVy) || 1;
  e.knockVx = (tearVx / len) * 4;
  e.knockVy = (tearVy / len) * 4;
  if (player.skills.freeze) e.slowTimer = 120;
  if (e.hp <= 0) killEnemy(e, idx);
}

function killBoss() {
  if (!boss) return;
  playBossDeath();
  spawnParticles(boss.x, boss.y, '#aa44ee', 40, 8, 60);
  spawnParticles(boss.x, boss.y, '#44ee88', 20, 6, 50);
  spawnParticles(boss.x, boss.y, '#ffffff', 15, 5, 45);
  startShake(15, 30);
  // Spawn befriendable mini Bloom at boss position
  pet.x = boss.x; pet.y = boss.y;
  pet.active = true; pet.befriended = false; pet.bounceTimer = 0;
  boss = null;
  checkRoomClear();
}

function killEnemy(e, idx) {
  if (e.type === 'tank') playTankDeath(); else playEnemyDeath();
  const colors = { grub: '#4aaa2a', fly: '#6666ff', tank: '#cc2222' };
  spawnParticles(e.x, e.y, colors[e.type] || '#fff',
    e.type === 'tank' ? 20 : 10,
    e.type === 'tank' ? 6  : 4,
    e.type === 'tank' ? 40 : 20);
  if (e.type === 'tank') startShake(8, 12);
  enemies.splice(idx, 1);
  checkRoomClear();
}

function checkTearEnemyCollisions() {
  for (let ti = tears.length - 1; ti >= 0; ti--) {
    const t = tears[ti];
    let tearUsed = false;

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (t.hitEnemies.has(ei)) continue;
      if (Math.hypot(t.x - e.x, t.y - e.y) < t.radius + enemyRadius(e)) {
        if (player.skills.explosive) {
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(([sx, sy]) => {
            tears.push({
              x: t.x, y: t.y,
              vx: sx * CONFIG.player.tearSpeed * 0.7,
              vy: sy * CONFIG.player.tearSpeed * 0.7,
              life: 18, lifespan: 18, radius: t.radius,
              hitEnemies: new Set([ei]), returning: false,
            });
          });
        }
        impactParticles(t.x, t.y, '#88aaff');
        damageEnemy(e, t.vx, t.vy, ei);
        if (!player.skills.piercing) {
          tears.splice(ti, 1);
          tearUsed = true;
          break;
        } else {
          t.hitEnemies.add(ei);
        }
      }
    }
    if (tearUsed) continue;
    // Boss tear collision
    if (boss && boss.hp > 0 && !tearUsed) {
      if (Math.hypot(t.x - boss.x, t.y - boss.y) < t.radius + 45) {
        if (player.skills.freeze) boss.slowTimer = 120;
        boss.hp--;
        boss.hitFlash = 6;
        const len = Math.hypot(t.vx, t.vy) || 1;
        boss.knockVx = (t.vx/len) * 2; boss.knockVy = (t.vy/len) * 2;
        if (player.skills.explosive) {
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(([sx,sy]) => {
            tears.push({ x:t.x, y:t.y, vx:sx*5, vy:sy*5,
                         life:18, lifespan:18, radius:t.radius,
                         hitEnemies:new Set(['boss']), returning:false });
          });
        }
        impactParticles(t.x, t.y, '#ffaaaa');
        if (!player.skills.piercing) {
          tears.splice(ti, 1);
        } else {
          t.hitEnemies.add('boss');
        }
        if (boss && boss.hp <= 0) killBoss();
      }
    }
  }
}

function checkPlayerEnemyCollisions() {
  if (player.iframes > 0) return;
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];
    if (Math.hypot(player.x - e.x, player.y - e.y) < 16 + enemyRadius(e)) {
      playPlayerHit();
      player.hp--;
      player.iframes = CONFIG.player.iframeDuration;
      // Knock player away from enemy
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      player.vx = (dx / len) * 5;
      player.vy = (dy / len) * 5;
      startShake(4, 8);
      if (player.hp <= 0) { gameState = 'TITLE'; }
      break;
    }
  }
}

// ─── DRAWING ──────────────────────────────────────────────────────────────
function px(size) { return `${size}px 'Press Start 2P', monospace`; }

function drawRoom(room) {
  for (let ty = 0; ty < ROWS; ty++) {
    for (let tx = 0; tx < COLS; tx++) {
      const rx = tx * TILE, ry = PF_TOP + ty * TILE;
      if (tx === 0 || tx === COLS-1 || ty === 0 || ty === ROWS-1) {
        ctx.fillStyle = '#4a4a3a';
        ctx.fillRect(rx, ry, TILE, TILE);
        ctx.fillStyle = '#5a5a4a';
        ctx.fillRect(rx+2, ry+2, TILE-4, TILE-4);
        ctx.strokeStyle = '#3a3a2a'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(rx+8, ry+4); ctx.lineTo(rx+20, ry+14);
        ctx.moveTo(rx+TILE-10, ry+TILE-8); ctx.lineTo(rx+TILE-22, ry+TILE-18);
        ctx.stroke();
      } else if (room.obstacles.some(([ox,oy]) => ox===tx && oy===ty)) {
        ctx.fillStyle = '#2a4a2a';
        ctx.fillRect(rx, ry, TILE, TILE);
        ctx.fillStyle = '#3a6a3a';
        ctx.beginPath(); ctx.arc(rx+TILE/2, ry+TILE/2, 22, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4a8a4a';
        ctx.beginPath(); ctx.arc(rx+TILE/2, ry+TILE/2-4, 16, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = (tx+ty)%2===0 ? '#2a5a2a' : '#2e6430';
        ctx.fillRect(rx, ry, TILE, TILE);
      }
    }
  }

  // Garden room: brighter grass + flower carpet + grass tufts
  if (room.type === 'garden') {
    for (let ty = 1; ty < ROWS-1; ty++) {
      for (let tx = 1; tx < COLS-1; tx++) {
        const rx = tx*TILE, ry = PF_TOP+ty*TILE;
        ctx.fillStyle = (tx+ty)%2===0 ? '#3a7a3a' : '#3e8440';
        ctx.fillRect(rx, ry, TILE, TILE);
        if ((tx*3+ty*7)%5===0) {
          ctx.strokeStyle='#4a9a4a'; ctx.lineWidth=1.5;
          [[6,8],[14,5],[22,9]].forEach(([gx,gy]) => {
            ctx.beginPath(); ctx.moveTo(rx+gx, ry+TILE-2);
            ctx.lineTo(rx+gx-2, ry+TILE-gy); ctx.stroke();
          });
        }
      }
    }
  }

  // Decorations: flowers + pebbles in non-obstacle tiles (deterministic per room)
  const decorCount = 8;
  for (let i = 0; i < decorCount; i++) {
    const t = (room.id * 17 + i * 37) % 100;
    const tx = 2 + (t * 11) % (COLS-4);
    const ty = 2 + (t * 7)  % (ROWS-4);
    if (room.obstacles.some(([ox,oy]) => ox===tx && oy===ty)) continue;
    const rx = tx*TILE+20, ry = PF_TOP+ty*TILE+20;
    if (i%3===0) {
      ctx.fillStyle = i%6===0 ? '#e8c547' : '#e05252';
      ctx.beginPath(); ctx.arc(rx, ry, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4a9a4a';
      ctx.fillRect(rx-1, ry+4, 2, 8);
    } else {
      ctx.fillStyle = '#5a5a4a';
      ctx.beginPath(); ctx.ellipse(rx, ry, 6, 4, 0.3, 0, Math.PI*2); ctx.fill();
    }
  }

  // Doors
  const doorDefs = {
    north: { x: W/2-30, y: PF_TOP,     w: 60, h: TILE },
    south: { x: W/2-30, y: H-TILE,     w: 60, h: TILE },
    east:  { x: W-TILE, y: H/2-30,     w: TILE, h: 60 },
    west:  { x: 0,      y: H/2-30,     w: TILE, h: 60 },
  };
  Object.entries(room.doors).forEach(([dir, targetIdx]) => {
    if (targetIdx === null) return;
    const d = doorDefs[dir];
    const locked = !room.cleared;
    ctx.fillStyle = locked ? '#cc3333' : '#5abf5a';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    if (locked) {
      ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 3;
      const isVert = dir==='north'||dir==='south';
      for (let i=0; i<3; i++) {
        const off = 12+i*14;
        ctx.beginPath();
        if (isVert) { ctx.moveTo(d.x+off, d.y); ctx.lineTo(d.x+off, d.y+d.h); }
        else        { ctx.moveTo(d.x, d.y+off); ctx.lineTo(d.x+d.w, d.y+off); }
        ctx.stroke();
      }
    }
  });

  // Vignette
  const grad = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(20,10,30,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, PF_TOP, W, H-PF_TOP);
}

const SKILL_META = {
  homing:    { icon:'🎯', name:'HOMING TEARS',    desc:'Tears curve toward nearest enemy' },
  explosive: { icon:'💥', name:'EXPLOSIVE TEARS', desc:'Burst into 4 shards on impact' },
  piercing:  { icon:'👻', name:'PIERCING TEARS',  desc:'Pass through all enemies' },
  orbital:   { icon:'🛡️', name:'ORBITAL SHIELD', desc:'2 orbs orbit and damage enemies' },
  freeze:    { icon:'❄️', name:'FREEZE TEARS',    desc:'Slow enemies by 60% on hit' },
  boomerang: { icon:'🔄', name:'BOOMERANG TEARS', desc:'Return at max range, hit twice' },
  triple:    { icon:'🌀', name:'TRIPLE SHOT',     desc:'Fire 3 tears in a spread' },
  speed:     { icon:'⚡', name:'SPEED TEARS',     desc:'Tears move 80% faster' },
};

function updateSkillPickup() {
  if (keysJustPressed['ArrowLeft'])  skillPickupState.selected = 0;
  if (keysJustPressed['ArrowRight']) skillPickupState.selected = 1;
  if (keysJustPressed['e'] || keysJustPressed['E'] || keysJustPressed['Enter']) {
    applySkill(skillPickupState.choices[skillPickupState.selected]);
    skillPickupState.choices = [];
    gameState = 'PLAYING';
  }
}

function drawSkillPickup() {
  ctx.fillStyle = 'rgba(20,5,30,0.85)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFB3C6'; ctx.font = px(10);
  ctx.fillText('❖ UPGRADE ❖', W/2, 140);
  ctx.fillStyle = '#888'; ctx.font = px(6);
  ctx.fillText('Room cleared! Choose a power-up.', W/2, 168);

  skillPickupState.choices.forEach((skillId, i) => {
    const meta = SKILL_META[skillId];
    const cardW=200, cardH=160;
    const cx = W/2 + (i===0 ? -cardW/2-16 : cardW/2+16);
    const cy = H/2;
    const sel = skillPickupState.selected===i;
    ctx.fillStyle = sel ? '#2d1040' : '#1a0a28';
    ctx.strokeStyle = sel ? '#FFB3C6' : '#5a3a6a';
    ctx.lineWidth = sel ? 3 : 1;
    roundRect(ctx, cx-cardW/2, cy-cardH/2, cardW, cardH, 8);
    ctx.fill(); ctx.stroke();
    ctx.font='32px serif'; ctx.fillText(meta.icon, cx, cy-40);
    ctx.fillStyle = sel ? '#FFD6E0':'#C7F0BD'; ctx.font=px(7);
    ctx.fillText(meta.name, cx, cy-5);
    ctx.fillStyle='#888'; ctx.font=px(5);
    wrapText(ctx, meta.desc, cx, cy+20, cardW-20, 14);
  });

  ctx.fillStyle='#555'; ctx.font=px(5);
  ctx.fillText('[← →] navigate   [E] pick', W/2, H-80);
  ctx.restore();
}

function updateBossIntro() {
  bossIntro.timer++;
  if (bossIntro.timer === 1) playBossIntro();
  if (bossIntro.timer >= bossIntro.duration) gameState = 'PLAYING';
}

function drawBossIntro() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  const alpha = Math.min(1, bossIntro.timer/20);
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cc3333'; ctx.font = px(9);
  ctx.fillText('BLOOM', W/2, H/2-20);
  ctx.fillStyle = '#888'; ctx.font = px(6);
  ctx.fillText("She's here to protect her slimes...", W/2, H/2+20);
  ctx.restore();
}

// ─── SKILLS ───────────────────────────────────────────────────────────────
function applySkill(skillId) {
  playSkillPickup();
  player.skills[skillId] = true;
  spawnParticles(player.x, player.y, '#e8c547', 20, 5, 30);

  if (skillId === 'orbital') {
    player.orbitals = [
      { angle: 0,       speed: 0.04 },
      { angle: Math.PI, speed: 0.04 },
    ];
  }
}

function updateOrbitals() {
  if (!player.skills.orbital || player.orbitals.length === 0) return;
  const r = 50;
  for (let oi = 0; oi < player.orbitals.length; oi++) {
    const orb = player.orbitals[oi];
    orb.angle += orb.speed;
    orb.x = player.x + Math.cos(orb.angle) * r;
    orb.y = player.y + Math.sin(orb.angle) * r;

    // Check vs enemies (reverse loop so splices are safe)
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if ((e.orbitalCooldown || 0) > 0) continue;
      if (Math.hypot(orb.x - e.x, orb.y - e.y) < enemyRadius(e) + 8) {
        damageEnemy(e, 0, 0, ei);
        e.orbitalCooldown = 30;
      }
    }
    // Check vs boss
    if (boss && boss.hp > 0) {
      if (Math.hypot(orb.x - boss.x, orb.y - boss.y) < 40 + 8) {
        if (!boss.orbitalCooldown || boss.orbitalCooldown <= 0) {
          boss.hp--;
          boss.hitFlash = 6;
          boss.orbitalCooldown = 30;
          if (boss.hp <= 0) killBoss();
        }
      }
      // orbitalCooldown decrement handled by updateBloom()
    }
  }
}

function drawOrbitals() {
  if (!player.skills.orbital) return;
  player.orbitals.forEach(orb => {
    if (orb.x === undefined) return;
    ctx.save();
    ctx.strokeStyle = '#e8c547';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#e8c547';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(orb.x, orb.y, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(232,197,71,0.4)';
    ctx.fill();
    ctx.restore();
  });
}

function drawPlayer() {
  ctx.save();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(player.x, player.y + 28, 18, 7, 0, 0, Math.PI*2); ctx.fill();

  // Blink during i-frames
  if (player.iframes > 0 && Math.floor(frameCount / 4) % 2 === 1) {
    ctx.restore(); return;
  }

  ctx.translate(player.x, player.y);
  ctx.scale(player.facing, 1);

  // Pick animation sheet + frame count
  let sheet = null, frameCount2 = 1;
  const isMoving = (keys['w']||keys['W']||keys['s']||keys['S']||keys['a']||keys['A']||keys['d']||keys['D']);
  if (player.iframes > 0 && dudeSprites.hurt) {
    sheet = dudeSprites.hurt; frameCount2 = DUDE_FRAMES.hurt;
  } else if (isMoving && dudeSprites.walk) {
    sheet = dudeSprites.walk; frameCount2 = DUDE_FRAMES.walk;
  } else if (dudeSprites.idle) {
    sheet = dudeSprites.idle; frameCount2 = DUDE_FRAMES.idle;
  }

  // Advance player anim (every 6 frames)
  if (player.animTimer === undefined) player.animTimer = 0;
  if (player.animFrame === undefined) player.animFrame = 0;
  player.animTimer++;
  if (player.animTimer >= 6) { player.animTimer = 0; player.animFrame++; }
  const frame = Math.floor(player.animFrame % frameCount2);

  if (sheet && sheet.naturalWidth > 0) {
    ctx.drawImage(sheet, frame * DUDE_FS, 0, DUDE_FS, DUDE_FS,
                  -DUDE_DS/2, -DUDE_DS/2, DUDE_DS, DUDE_DS);
  } else {
    // Fallback placeholder
    ctx.fillStyle = '#c8a87a';
    ctx.beginPath(); ctx.arc(0, -8, 18, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6,-10,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-10,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#88aaff';
    ctx.beginPath(); ctx.ellipse(-7,-4,2,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-4,2,4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGrub(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const frame = Math.floor(e.animFrame % GRUB_FRAMES);
  if (grubSprites.crawl && grubSprites.crawl.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    else if (e.slowTimer > 0) ctx.filter = 'hue-rotate(180deg) brightness(1.5)';
    ctx.drawImage(grubSprites.crawl, frame * GRUB_FS, 0, GRUB_FS, GRUB_FS,
                  -GRUB_DS/2, -GRUB_DS/2, GRUB_DS, GRUB_DS);
    ctx.filter = 'none';
  } else {
    // Canvas fallback (original hop/squash art)
    const bob = Math.sin(e.hopTimer / 30 * Math.PI * 2) * 4;
    const squash = 1 + Math.abs(Math.sin(e.hopTimer / 30 * Math.PI * 2)) * 0.2;
    ctx.translate(0, bob);
    ctx.scale(1/squash, squash);
    const bodyColor = e.hitFlash>0 ? '#fff' : e.slowTimer>0 ? '#88ccff' : '#4a8a2a';
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0,0,18,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-5,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-6,-5,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-5,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFly(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  let sheet = null, frames = 1;
  if (e.hitFlash > 0 && batSprites.hurt)         { sheet = batSprites.hurt; frames = BAT_FRAMES.hurt; }
  else if (e.phase === 'dash' && batSprites.run)  { sheet = batSprites.run;  frames = BAT_FRAMES.run; }
  else if (batSprites.idle)                        { sheet = batSprites.idle; frames = BAT_FRAMES.idle; }

  const frame = Math.floor(e.animFrame % frames);

  if (sheet && sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    else if (e.slowTimer > 0) ctx.filter = 'hue-rotate(180deg) brightness(1.2)';
    // Telegraph glow
    if (e.phase === 'telegraph') {
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 15 * Math.abs(Math.sin(frameCount * 0.2));
    }
    ctx.drawImage(sheet, frame * BAT_FS, 0, BAT_FS, BAT_FS,
                  -BAT_DS/2, -BAT_DS/2, BAT_DS, BAT_DS);
    ctx.filter = 'none';
  } else {
    // Canvas fallback (original fly art)
    const flutter = Math.sin(frameCount * 0.3) * 3;
    const glow = e.phase === 'telegraph' ? Math.abs(Math.sin(frameCount * 0.2)) : 0;
    if (glow > 0) { ctx.shadowColor='#ff4444'; ctx.shadowBlur=15*glow; }
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = 'rgba(150,180,255,0.5)';
    ctx.beginPath(); ctx.ellipse(-14,-2+flutter,14,7,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14,-2+flutter,14,7,0.3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#5a5a9a';
    ctx.beginPath(); ctx.ellipse(0,4,8,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(-5,-4,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-4,4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawTank(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const frame = Math.floor(e.animFrame % GOLEM_IDLE_FRAMES);

  if (golemSprites.sheet && golemSprites.sheet.naturalWidth > 0) {
    if (e.hitFlash > 0) ctx.filter = 'brightness(10)';
    else if (e.slowTimer > 0) ctx.filter = 'hue-rotate(200deg) brightness(1.2)';
    ctx.drawImage(golemSprites.sheet,
                  frame * GOLEM_FS, GOLEM_IDLE_ROW * GOLEM_FS, GOLEM_FS, GOLEM_FS,
                  -GOLEM_DS/2, -GOLEM_DS/2, GOLEM_DS, GOLEM_DS);
    ctx.filter = 'none';
  } else {
    // Canvas fallback (original tank art)
    const pulse = 1 + Math.sin(e.pulseTimer/60*Math.PI*2) * 0.04;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#6a1a1a';
    ctx.beginPath(); ctx.ellipse(0,4,24,19,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = e.hitFlash>0 ? '#fff' : '#8a2a2a';
    ctx.beginPath(); ctx.ellipse(0,3,20,16,0,0,Math.PI*2); ctx.fill();
    for (let i=0; i<3; i++) {
      ctx.fillStyle = i<e.hp ? '#ff6060' : '#3a1010';
      ctx.beginPath(); ctx.arc(-8+i*8,6,4,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#7a2020'; ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-16,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-16,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.type === 'grub') drawGrub(e);
  else if (e.type === 'fly')  drawFly(e);
  else if (e.type === 'tank') drawTank(e);
}

function drawTears() {
  tears.forEach(t => {
    // Stay fully visible until last 25% of life, then fade
    const lifeFrac = t.life / t.lifespan;
    const alpha = lifeFrac > 0.25 ? 1 : Math.max(0, lifeFrac / 0.25);
    const r = t.radius * (0.7 + 0.3 * alpha); // shrinks only slightly
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = player.skills.freeze ? '#88ccff' :
                    player.skills.explosive ? '#ff8844' : '#88aaff';
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function drawMinimap() {
  const cellW = 22, cellH = 14, gap = 3;
  const totalW = 6*(cellW+gap)-gap;
  const startX = W - 10 - totalW;
  const startY = HUD_H/2 - cellH/2;

  ROOM_GRAPH.forEach((room, i) => {
    const rx = startX + i*(cellW+gap), ry = startY;
    // Cell background
    if (!room.visited)             ctx.fillStyle = '#1a1a2a';
    else if (room.type==='garden') ctx.fillStyle = '#5a9e6f';
    else if (room.cleared)         ctx.fillStyle = '#7a5a8a';
    else                           ctx.fillStyle = '#c87a3a';
    roundRect(ctx, rx, ry, cellW, cellH, 3);
    ctx.fill();

    // Current room: bright pink outline
    if (i === currentRoomIdx) {
      ctx.strokeStyle = '#FFB3C6';
      ctx.lineWidth = 2;
      roundRect(ctx, rx, ry, cellW, cellH, 3);
      ctx.stroke();
    }

    // Garden icon
    if (room.type === 'garden') {
      ctx.font = '10px serif';
      ctx.textAlign = 'center';
      ctx.fillText('🌸', rx + cellW/2, ry + cellH - 1);
    }

    // Boss room skull
    if (room.type === 'boss' && room.visited && !room.cleared) {
      ctx.font = '9px serif';
      ctx.textAlign = 'center';
      ctx.fillText('💀', rx + cellW/2, ry + cellH - 1);
    }
  });
  ctx.textAlign = 'left';
}

function drawHUD() {
  ctx.save();
  // HUD background — soft dark with pastel gradient hint
  const hudGrad = ctx.createLinearGradient(0, 0, 0, HUD_H);
  hudGrad.addColorStop(0, '#2a1a2e');
  hudGrad.addColorStop(1, '#1e1228');
  ctx.fillStyle = hudGrad;
  ctx.fillRect(0, 0, W, HUD_H);
  // Bottom border line
  ctx.strokeStyle = '#FFB3C6';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(W, HUD_H); ctx.stroke();

  // Hearts — bigger, cuter
  const hs = 22; // heart display size
  for (let i = 0; i < player.maxHP; i++) {
    const hx = 10 + i * (hs + 3);
    const hy = HUD_H / 2;
    ctx.fillStyle = i < player.hp ? '#FF6B9D' : '#3a2a3a';
    ctx.save();
    ctx.translate(hx + hs/2, hy);
    ctx.scale(hs/20, hs/20);
    ctx.beginPath();
    ctx.arc(-5, -3, 5, Math.PI, 0);
    ctx.arc(5, -3, 5, Math.PI, 0);
    ctx.lineTo(0, 8);
    ctx.closePath();
    ctx.fill();
    // Shine on filled hearts
    if (i < player.hp) {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(-3, -5, 2.5, 1.5, -0.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Room name — centered, readable
  ctx.fillStyle = '#FFD6E0';
  ctx.font = px(7);
  ctx.textAlign = 'center';
  ctx.fillText(currentRoom ? currentRoom.name.toUpperCase() : '', W/2, HUD_H/2 + 4);

  drawMinimap();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, cx, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  words.forEach((w, i) => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && i > 0) {
      ctx.fillText(line.trim(), cx, y); y += lineH; line = w + ' ';
    } else { line = test; }
  });
  ctx.fillText(line.trim(), cx, y);
}

function drawBloom() {
  if (!boss) return;
  ctx.save();

  // Telegraph shadow at target position
  if (boss.telegraphing) {
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(frameCount * 0.15));
    ctx.globalAlpha = 0.5 * pulse;
    ctx.fillStyle = '#220022';
    ctx.beginPath(); ctx.ellipse(boss.shadowX, boss.shadowY, 40, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.translate(boss.x, boss.y);

  // Pick animation sheet
  let sheet = null, frames = 1;
  if (boss.hitFlash > 0 && bloomSprites.hurt)        { sheet = bloomSprites.hurt;   frames = BLOOM_FRAMES.hurt; }
  else if (boss.jumpInFlight && bloomSprites.jump)    { sheet = bloomSprites.jump;   frames = BLOOM_FRAMES.jump; }
  else if (boss.phase === 2 && bloomSprites.attack)   { sheet = bloomSprites.attack; frames = BLOOM_FRAMES.attack; }
  else if (bloomSprites.crawl)                         { sheet = bloomSprites.crawl;  frames = BLOOM_FRAMES.crawl; }

  const frame = Math.floor(boss.animFrame % frames);
  const half = 64; // display at 128×128 (2× of 64px frames)

  if (sheet && sheet.naturalWidth > 0) {
    if (boss.hitFlash > 0) { ctx.filter = 'brightness(10)'; }
    ctx.drawImage(sheet, frame * BLOOM_FS, 0, BLOOM_FS, BLOOM_FS, -half, -half, half*2, half*2);
    ctx.filter = 'none';
  } else {
    // Canvas fallback blob
    const wobble = Math.sin(frameCount * 0.1) * 4;
    ctx.fillStyle = boss.hitFlash > 0 ? '#fff' : (boss.phase===2 ? '#882299' : '#aa44ee');
    ctx.beginPath(); ctx.ellipse(0, wobble/2, 38+wobble, 35-wobble/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(-10,-12,12,8,-0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-13,-5,9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(13,-5,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = boss.phase===2 ? '#ff0000':'#222';
    ctx.beginPath(); ctx.arc(-11,-5,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-5,5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Projectiles
  boss.projectiles.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color || '#aa44ee';
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawBossHPBar() {
  if (!boss) return;
  ctx.save();
  const barW = 400, barH = 14;
  const bx = W/2 - barW/2, by = H - 30;
  ctx.fillStyle = '#1a0a0a'; ctx.fillRect(bx-2, by-2, barW+4, barH+4);
  ctx.fillStyle = '#660000'; ctx.fillRect(bx, by, barW, barH);
  const hpW = Math.max(0, (boss.hp/boss.maxHP)) * barW;
  ctx.fillStyle = boss.hp > 12 ? '#cc3333' : '#ff6666';
  ctx.fillRect(bx, by, hpW, barH);
  ctx.fillStyle = '#e8c547'; ctx.font = px(5); ctx.textAlign = 'center';
  ctx.fillText('BLOOM', W/2, by - 6);
  ctx.restore();
}

function drawPet() {
  if (!pet.active) return;
  const bounce = Math.sin(pet.bounceTimer * 0.08) * 3;
  ctx.save();
  ctx.translate(pet.x, pet.y + bounce);

  const sheet = bloomSprites.happy;
  const frame = Math.floor(pet.bounceTimer / 10) % BLOOM_FRAMES.happy;
  const petSize = 48;

  if (sheet && sheet.naturalWidth > 0) {
    ctx.drawImage(sheet, frame * BLOOM_FS, 0, BLOOM_FS, BLOOM_FS,
                  -petSize/2, -petSize/2, petSize, petSize);
  } else {
    ctx.fillStyle = '#cc66ff';
    ctx.beginPath(); ctx.ellipse(0,0,16,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.ellipse(-5,-5,5,3,-0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-6,-2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(6,-2,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#220033';
    ctx.beginPath(); ctx.arc(-5,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-2,2.5,0,Math.PI*2); ctx.fill();
  }

  // [E] prompt when not yet befriended and player nearby
  if (!pet.befriended && Math.hypot(player.x - pet.x, player.y - pet.y) < 48) {
    ctx.fillStyle = '#fff'; ctx.font = '9px "Press Start 2P",monospace';
    ctx.textAlign = 'center'; ctx.fillText('[E] befriend', 0, -32);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawGardenProps(room) {
  if (!room || room.type !== 'garden') return;
  ctx.save();

  const drawBoard = (x, y, label, color) => {
    // Board frame
    ctx.fillStyle = '#3a2010';
    ctx.fillRect(x-32, y-38, 64, 54);
    ctx.fillStyle = color;
    ctx.fillRect(x-28, y-34, 56, 46);
    // Label
    ctx.fillStyle = '#e8c547'; ctx.font = px(4); ctx.textAlign='center';
    ctx.fillText(label, x, y+22);
    // E prompt when nearby
    if (Math.hypot(player.x-x, player.y-y) < 50) {
      ctx.fillStyle='#fff'; ctx.font=px(5);
      ctx.fillText('[E]', x, y-46);
    }
  };

  drawBoard(room.photoBoard.x, room.photoBoard.y, 'PHOTOS', '#5a8a5a');
  drawBoard(room.videoBoard.x, room.videoBoard.y, 'VIDEOS', '#5a5a8a');

  // Throne
  const {x: tx, y: ty} = room.throne;
  ctx.fillStyle = '#8b6914'; ctx.fillRect(tx-24, ty-44, 48, 54);
  ctx.fillStyle = '#e8c547';
  ctx.fillRect(tx-20, ty-54, 40, 16);
  ctx.fillRect(tx-20, ty-40, 40, 40);
  ctx.fillStyle = '#aa8822';
  [[-12,-50],[12,-50],[-12,-32],[12,-32]].forEach(([ox,oy]) => {
    ctx.beginPath(); ctx.arc(tx+ox, ty+oy, 4, 0, Math.PI*2); ctx.fill();
  });
  if (Math.hypot(player.x-tx, player.y-ty) < 50) {
    ctx.fillStyle='#fff'; ctx.font=px(5); ctx.textAlign='center';
    ctx.fillText('[E]', tx, ty-62);
  }
  ctx.textAlign='left';
  ctx.restore();
}

function drawPopup() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  const pw=600, ph=360, px2=W/2-300, py2=H/2-180;

  // Frame
  ctx.fillStyle = '#1a1209';
  roundRect(ctx, px2, py2, pw, ph, 8); ctx.fill();
  ctx.strokeStyle='#8b6914'; ctx.lineWidth=4; ctx.stroke();
  ctx.strokeStyle='#5a4510'; ctx.lineWidth=2;
  roundRect(ctx, px2+4, py2+4, pw-8, ph-8, 6); ctx.stroke();

  ctx.textAlign = 'center';

  if (popupState.type === 'photos') {
    const cfg = CONFIG.photos[popupState.index];
    const img = boardImages[popupState.index];

    ctx.fillStyle='#e8c547'; ctx.font=px(6);
    ctx.fillText('📸 PHOTOS FROM FRIENDS', W/2, py2+26);
    ctx.fillStyle='#666'; ctx.font=px(5);
    ctx.fillText(`${popupState.index+1} / ${CONFIG.photos.length}`, W/2, py2+42);

    const ix=W/2-200, iy=py2+58, iw=400, ih=220;
    if (img.naturalWidth > 0) {
      ctx.drawImage(img, ix, iy, iw, ih);
    } else {
      ctx.fillStyle='#222'; ctx.fillRect(ix,iy,iw,ih);
      ctx.fillStyle='#555'; ctx.font=px(5);
      ctx.fillText('[ drop '+cfg.file+' here ]', W/2, iy+ih/2);
    }

    ctx.fillStyle='#c8a040'; ctx.font=px(5);
    ctx.fillText(cfg.caption, W/2, iy+ih+20);

    ctx.fillStyle='#e8c547'; ctx.font='28px sans-serif';
    ctx.fillText('◄', px2+28, H/2+10);
    ctx.fillText('►', px2+pw-28, H/2+10);
  }

  if (popupState.type === 'videos') {
    ctx.fillStyle='#a0a0e0'; ctx.font=px(6);
    ctx.fillText('🎥 VIDEO MESSAGES', W/2, py2+26);
    ctx.fillStyle='#666'; ctx.font=px(5);
    ctx.fillText(`${popupState.index+1} / ${CONFIG.videos.length}`, W/2, py2+42);
    ctx.fillStyle='#444'; ctx.font=px(5);
    ctx.fillText(CONFIG.videos[popupState.index].caption, W/2, py2+ph-30);
    ctx.fillStyle='#e8c547'; ctx.font='28px sans-serif';
    ctx.fillText('◄', px2+28, H/2+10);
    ctx.fillText('►', px2+pw-28, H/2+10);
  }

  ctx.fillStyle='#555'; ctx.font=px(5);
  ctx.fillText('[◄ ►] navigate   [E / Esc] close', W/2, py2+ph-12);
  ctx.restore();
}

function drawCelebration() {
  if (currentRoom) drawRoom(currentRoom);
  drawGardenProps(currentRoom);
  drawPet();
  drawPlayer();
  drawHUD();

  // Confetti
  confettiParticles.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  });

  // Banner
  const bw=520, bh=140, bx=W/2-260, by=H/2-70;
  ctx.save();
  ctx.fillStyle='rgba(10,20,10,0.88)';
  roundRect(ctx, bx, by, bw, bh, 12); ctx.fill();
  ctx.strokeStyle='#e8c547'; ctx.lineWidth=3; ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#e8c547'; ctx.font=px(10);
  ctx.shadowColor='#e8c547'; ctx.shadowBlur=12;
  ctx.fillText('🎉 HAPPY BIRTHDAY 🎉', W/2, by+46);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  ctx.fillStyle='#ffffff'; ctx.font=px(18);
  ctx.shadowColor='#fff'; ctx.shadowBlur=15;
  ctx.fillText(CONFIG.friendName+'!', W/2, by+90);
  ctx.shadowBlur=0; ctx.shadowColor='transparent';
  ctx.fillStyle='#a0c87a'; ctx.font=px(6);
  ctx.fillText(CONFIG.subtitle, W/2, by+114);
  ctx.fillStyle='#555'; ctx.font=px(5);
  ctx.fillText('[E / Esc] keep wandering', W/2, by+bh+16);
  ctx.restore();
}

function drawTitle() {
  // Background — soft dark purple
  ctx.fillStyle = '#1a0f1a';
  ctx.fillRect(0, 0, W, H);

  // Animated pastel grass along bottom
  for (let i = 0; i < 50; i++) {
    const x = (i * 71) % W;
    const baseY = H - 40 - (i * 23) % 60;
    const sway = Math.sin(frameCount * 0.03 + i * 0.4) * 4;
    const hue = (i * 37) % 60;
    ctx.strokeStyle = `hsl(${120+hue}, 60%, 70%)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + sway, baseY + 18);
    ctx.lineTo(x, baseY);
    ctx.stroke();
  }

  // Floating flowers decoration
  for (let i = 0; i < 8; i++) {
    const fx = 60 + i * 110 + Math.sin(frameCount*0.02 + i) * 8;
    const fy = 80 + (i%2)*30 + Math.cos(frameCount*0.015 + i) * 5;
    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    ctx.fillText(['🌸','🌺','🌼','🌷','🍀'][i%5], fx, fy);
  }

  // Decorative frame
  ctx.strokeStyle = '#FFB3C6';
  ctx.lineWidth = 3;
  roundRect(ctx, 24, 24, W-48, H-48, 16);
  ctx.stroke();
  ctx.strokeStyle = '#FFD6E0';
  ctx.lineWidth = 1;
  roundRect(ctx, 32, 32, W-64, H-64, 12);
  ctx.stroke();

  ctx.textAlign = 'center';

  // Game title — two lines
  ctx.fillStyle = '#FFB3C6';
  ctx.font = px(13);
  ctx.shadowColor = '#FF6B9D'; ctx.shadowBlur = 18;
  ctx.fillText('BINDINGS OF', W/2, 170);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  ctx.fillStyle = '#FFF5E4';
  ctx.font = px(20);
  ctx.shadowColor = '#FFB3C6'; ctx.shadowBlur = 20;
  ctx.fillText('NOPEYEP', W/2, 220);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  // Subtitle
  ctx.fillStyle = '#C9B1FF';
  ctx.font = px(6);
  ctx.fillText('a birthday game made for NopeYep', W/2, 262);

  // Controls box
  ctx.fillStyle = 'rgba(255,179,198,0.1)';
  roundRect(ctx, W/2-200, 288, 400, 90, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,179,198,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#FFD6E0';
  ctx.font = px(6);
  ctx.fillText('HOW TO PLAY', W/2, 310);
  ctx.fillStyle = '#C7F0BD';
  ctx.font = px(5);
  ctx.fillText('WASD  move       ARROWS  shoot', W/2, 334);
  ctx.fillText('E  interact      ESC  close popup', W/2, 354);
  ctx.fillText('collect upgrades · befriend Bloom · reach the garden', W/2, 374);

  // Blinking prompt
  if (Math.floor(frameCount/30)%2 === 0) {
    ctx.fillStyle = '#FF8B6A';
    ctx.font = px(8);
    ctx.shadowColor = '#FF8B6A'; ctx.shadowBlur = 12;
    ctx.fillText('PRESS ENTER TO START', W/2, 438);
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }
  ctx.textAlign = 'left';
}
</script>
